# Tech Monkey Hindi reel bank: run_posts.py --channel ai-news --reel --lang hi posts the first entry
# not in history.json (key reels_hi), daily at config.yaml's reels_hi.publish_time, plus its Story.
- id: tm01-hi
  folder: 01-claude-memory-hi
  caption: 'Claude Code आपके rules भूल जाता है? 🧠


    इसकी 2 तरह की memory है:

    📄 CLAUDE.md: rules जो आप लिखते हो

    🤖 Auto memory: notes जो Claude आपकी corrections से लिखता है


    दोनों हर session की शुरुआत में load होती हैं। /init से starter CLAUDE.md बनाओ, /memory से edit करो।

    ⚠️ Memory context है, पक्का rule नहीं। कुछ रोकना हो तो hook लगाओ।


    Docs के लिए "MEMORY" comment करो 📩'
  hashtags: '#claudecode #claude #ai #hindi #techmonkey'
- id: tm02-hi
  folder: 02-effort-levels-hi
  caption: 'क्या आप Claude Code के सही effort level पर हो? 🎚️


    5 levels: low · medium · high · xhigh · max

    ज़्यादा effort = ज़्यादा सोच: मुश्किल problems पर बेहतर, पर धीमा और महँगा।

    Fable 5.2 और Opus 5.5 का default medium है। /effort से बदलो।


    मेरा rule: छोटे edits के लिए low, tricky bugs के लिए high+, max सिर्फ़ सबसे मुश्किल काम के लिए।


    Cheat sheet के लिए "EFFORT" comment करो 📩'
  hashtags: '#claudecode #claude #ai #hindi #techmonkey'
- id: tm03-hi
  folder: 03-system-prompts-hi
  caption: 'आपके type करने से पहले Claude को जो system prompt मिलता है, Anthropic उसे publish करता है 👀


    📑 हर Claude model का अपना page

    📱 claude.ai, iOS और Android के लिए

    🗓️ हर version पर date, तो दिखता है क्या बदला

    सबसे नया: Claude Fable 5.2 (9 Nov 2026)


    Link के लिए "PROMPT" comment करो 📩'
  hashtags: '#claude #anthropic #promptengineering #hindi #techmonkey'
- id: tm04-hi
  folder: 04-mcp-three-hi
  caption: '3 MCP connections जो Claude Code को power-up करते हैं 🔌


    🐙 GitHub: issues और pull requests

    🎭 Playwright: app test करने के लिए असली browser

    🗄️ Supabase: आपका database


    हर एक बस एक `claude mcp add` command है। फिर /mcp से check करो।


    तीनों commands के लिए "MCP" comment करो 📩'
  hashtags: '#claudecode #mcp #ai #hindi #techmonkey'
- id: tm05-hi
  folder: 05-legal-traps-hi
  caption: 'आपकी vibe-coded app पर पहली sale से पहले ही case हो सकता है 😬


    1. Parents की permission के बिना बच्चों का data (US COPPA, ~$53K तक)

    2. Google से load होते Google Fonts (Munich court, €100)

    3. Keystrokes record करता session replay (California CIPA, $5K)

    4. बिना unsubscribe के marketing emails (CAN-SPAM, ~$53K तक)

    5. छुपी हुई auto-renewal terms

    6. Registered DMCA agent नहीं ($6)


    ये legal advice नहीं है। हर देश के law अलग हैं। Save करो 🔖'
  hashtags: '#vibecoding #startup #saas #hindi #techmonkey'
- id: tm06-hi
  folder: 06-launch-checklist-hi
  caption: 'Vibe-coded app launch करने से पहले 4 काम 🚀


    🔑 API keys front-end code से बाहर रखो

    💸 Cloud और AI accounts पर spending limit

    💾 Database backups चालू करो

    🔒 एक असली privacy policy डालो


    ये छोड़े, तो एक बुरा दिन सब ले जा सकता है।


    Checklist के लिए "LAUNCH" comment करो 📩'
  hashtags: '#vibecoding #startup #webdev #hindi #techmonkey'
- id: tm07-hi
  folder: 07-faceless-mascot-hi
  caption: 'Channel बढ़ाने के लिए face दिखाना ज़रूरी नहीं 🐒


    इस channel का face एक बंदर है। हर reel AI से बनती है (script, voice, animation), और हर fact पहले असली sources से check होता है।


    अपना mascot channel चाहिए? "MASCOT" comment करो 📩'
  hashtags: '#facelesscreator #aicontent #contentcreator #hindi #techmonkey'
- id: tm08-hi
  folder: 08-how-this-reel-hi
  caption: 'ये reel कैसे बनी, 6 steps में 🎬


    1. Topic चुनो, facts check करो

    2. Claude छोटी script लिखता है

    3. हर line code में एक scene बनती है

    4. AI voice जोश के साथ पढ़ती है

    5. Browser frame by frame बनाता है

    6. देखो और fixes माँगो


    Setup के लिए "STEPS" comment करो 📩'
  hashtags: '#claudecode #aivideo #contentcreator #hindi #techmonkey'
- id: tm09-hi
  folder: 09-vibe-code-learn-hi
  caption: 'Vibe coding आपको कमज़ोर coder बना सकती है। 4 आदतें जो इसे रोकें 🧠


    🗺️ पहले Claude से plan समझाने को कहो

    ⌨️ पहला version खुद लिखो, Claude से review करवाओ

    ❓ उसके लिखे code पर quiz लो

    🔍 Accept करने से पहले हर diff पढ़ो


    मेरे prompt के लिए "LEARN" comment करो 📩'
  hashtags: '#vibecoding #claudecode #learntocode #hindi #techmonkey'
- id: tm10-hi
  folder: 10-expert-debate-hi
  caption: 'Claude आपकी हर बात से सहमत होता है? ये try करो 🥊


    उसे 3 experts बनने को कहो जो असहमत हों: एक सख्त investor, एक busy customer और एक rival founder. हर एक आपके idea पर attack करे। फिर पूछो, वो एक बदलाव जिस पर तीनों राज़ी हों।


    असली feedback, तारीफ़ नहीं।


    पूरे prompt के लिए "DEBATE" comment करो 📩'
  hashtags: '#claude #promptengineering #startup #hindi #techmonkey'
