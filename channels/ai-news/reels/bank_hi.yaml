  hashtags: '#claude #promptengineering #startup #hindi #techmonkey'
- id: tm15-hi
  folder: 15-photo-location-hi
  caption: 'आपने जो photo अभी भेजी, वो आपके घर का पता बता सकती है 📍🏠


    Phone का camera हर photo के अंदर GPS location save कर सकता है। Normal WhatsApp photo में ये अक्सर हट जाती है, पर "send as document", original-quality files और drive links में location साथ जा सकती है। Online कुछ बेच रहे हो? घर पर खींची listing photo सीधे आपके दरवाज़े तक ला सकती है।


    ऐसे off करो:

    📱 iPhone: share screen पर Options → Location off करो (हर बार share करते समय)

    🤖 Android: Camera → Settings → Location tags / Save location off

    ⚠️ ये सिर्फ़ नई photos के लिए है। पुरानी photos share करने से पहले check करो।


    🔖 Save करो, और उसे भेजो जो online कुछ बेचता है।

    रोज़ एक tech safety trick के लिए @d_tech_monkey follow करो 🐒'
  hashtags: '#privacy #cybersafety #smartphonetips #hindi #techmonkey'
- id: tm13-hi
  folder: 13-voice-clone-hi
  caption: 'बेटे का रोता हुआ call, पैसे चाहिए… पर वो आपका बेटा नहीं है 📞⚠️


    AI सिर्फ़ ~3 seconds की आवाज़ से voice clone कर सकता है, और आपकी एक reel या voice note काफ़ी है। McAfee के India survey में 47% लोगों के साथ AI voice scam हुआ या उनके किसी जानने वाले के साथ, और उनमें से 83% के पैसे गए।


    10 second का बचाव:

    1️⃣ घर में एक family safe word रखो, जो कभी online post न हो

    2️⃣ उसे किसी chat में type मत करो

    3️⃣ पैसे वाला "emergency" call? Safe word पूछो

    4️⃣ Word नहीं पता? Call काटो और अपने saved number पर वापस call करो


    🔖 Save करो, और अपने family group में अभी भेजो।

    रोज़ एक tech safety trick के लिए @d_tech_monkey follow करो 🐒


    Source: McAfee "Beware the Artificial Impostor" (2023, 1,010 Indian adults)'
  hashtags: '#aivoicescam #cybersafety #scamalert #hindi #techmonkey'
- id: tm14-hi
  folder: 14-sim-check-hi
  caption: 'कहीं आपके नाम पर कोई और SIM तो नहीं चला रहा? 1 minute में check करो 📱🕵️


    Scammers चोरी की ID copies से SIM लेते हैं, तो scam calls और OTP fraud का रास्ता आप तक आ सकता है। सरकार का free Sanchar Saathi portal आपकी ID पर issue हुए सारे mobile numbers दिखाता है।


    कैसे check करें:

    1️⃣ sancharsaathi.gov.in खोलो (या Sanchar Saathi app)

    2️⃣ "Know mobile connections in your name" पर tap करो

    3️⃣ अपना number + captcha डालो, फिर OTP

    4️⃣ कोई number आपका नहीं? "Not my number" report करो


    कानून (Telecommunications Act 2023) के हिसाब से एक इंसान max 9 SIM रख सकता है, J&K, Assam और North-East में 6।


    🔖 Save करो, और अपने parents को भेजो। उनकी ID भी misuse हो सकती है।

    रोज़ एक tech safety trick के लिए @d_tech_monkey follow करो 🐒'
  hashtags: '#sancharsaathi #simcard #cybersafety #hindi #techmonkey'
- id: tm11-hi
  folder: 11-tokens-hi
  caption: 'AI आपके words नहीं पढ़ता, वो tokens पढ़ता है 🔤


    1 token ≈ ¾ word (≈ 4 characters)। 200K-token window ≈ 1,50,000 words ≈ 500 pages की किताब। पर हर message, file और AI का हर reply इसी budget में गिना जाता है, इसलिए लंबी chats पुरानी बातें भूलने लगती हैं।


    नया काम? नई chat शुरू करो। Context साफ़, budget पूरा, जवाब ज़्यादा sharp।


    🔖 Save करो, और उस दोस्त को भेजो जो एक ही chat में सब करता है।

    रोज़ एक AI trick के लिए @d_tech_monkey follow करो 🐒'
  hashtags: '#ai #chatgpt #claude #hindi #techmonkey'
- id: tm16-hi
  folder: 16-screen-share-scam-hi
  caption: '"Bank customer care" एक app install करवाना चाहता है? Call काटो 📵🏦


    Screen-sharing / remote-access apps से अजनबी आपका phone live देख सकता है: हर OTP, type करते समय आपका UPI PIN, आपके bank SMS। एक transfer और account खाली। RBI ने 2019 में ही इस trick पर alert जारी किया था (Alert 1/2019)।


    सही तरीका:

    1️⃣ असली bank call पर कभी app install नहीं करवाता

    2️⃣ Call काटो और card पर लिखे number पर call करो

    3️⃣ Bank या UPI app खुला हो तो कभी screen share मत करो

    4️⃣ Share कर चुके हो? तुरंत 1930 (cyber crime helpline) या cybercrime.gov.in, और अपने bank को call करो


    🔖 Save करो, और उसे भेजो जो हर call उठा लेता है।

    रोज़ एक tech safety trick के लिए @d_tech_monkey follow करो 🐒'
  hashtags: '#cybersafety #bankfraud #upi #hindi #techmonkey'
- id: tm17-hi
  folder: 17-prompt-formula-hi
  caption: 'AI के जवाब generic लगते हैं? गलती prompt की है, AI की नहीं 🤖✍️


    हर बार 4 हिस्से:

    🎭 ROLE: कौन बने → "You''re a hiring manager in tech"

    🎯 TASK: एक साफ़ काम → "Write my cover letter, under 200 words"

    📎 CONTEXT: आपकी details → job post, आपकी skills, ये company क्यों

    📐 FORMAT: कैसा दिखे → "3 short paragraphs, no clichés"


    Copy-paste template:

    "You are [role]. [Task]. Here''s the context: [details]. Format: [length, style, structure]."


    ChatGPT, Gemini, Claude, हर chatbot में चलता है।


    🔖 Save करो, और उस दोस्त को भेजो जो job ढूँढ रहा है।

    रोज़ एक AI trick के लिए @d_tech_monkey follow करो 🐒'
  hashtags: '#chatgpt #prompts #ai #hindi #techmonkey'
- id: tm12-hi
  folder: 12-hallucination-hi
  caption: 'AI ने कुछ गलत बताया… और वो भी 100% भरोसे से? 🤖❌


    इसे hallucination कहते हैं: model अगला likely word guess करता है, facts check नहीं करता। इसलिए बना हुआ जवाब भी असली जितना पक्का लगता है।


    2 fixes:

    1️⃣ उससे source quote करवाओ, और link खुद खोलो

    2️⃣ उसे बोलो: पक्का न हो तो "I don''t know" कहो


    Health, पैसा, legal? हमेशा verify करो।


    🔖 Save करो, और उसे भेजो जो AI की हर बात मान लेता है।

    रोज़ एक AI trick के लिए @d_tech_monkey follow करो 🐒'
  hashtags: '#ai #chatgpt #aihallucination #hindi #techmonkey'
