# Channel: Daily AI News
name: "Tech Monkey"             # shown on slides
handle: "@d_tech_monkey"        # your Instagram handle, shown on slides
timezone: "Asia/Kolkata"        # IST; used for dates and the once-per-day check

daily:
  publish_time: "18:30"         # local time; the GitHub job starts earlier and waits for this
  stories: 7                    # story slides per daily post (plus cover + outro)
  min_stories: 3                # skip the day if fewer good stories are found
  lookback_hours: 24

weekly:
  publish_time: "12:00"         # Sundays, local time
  stories: 8                    # story slides in the weekly recap

hashtags: >-
  #AI #ArtificialIntelligence #AINews #MachineLearning #TechNews #GenerativeAI
  #ChatGPT #LLM #DeepLearning #FutureOfWork #Innovation #Technology #TechMonkey

ai:
  models:                       # strong free-tier Gemini models, tried in order (update if Google renames them)
    - "gemini-3.8-flash"
    - "gemini-3.7-flash"
    - "gemini-flash-latest"
  strong_retry_minutes: 10      # keep retrying the strong models this long before using a fallback
  fallback_models:              # lighter models: last resort only
    - "gemini-3.5-flash-lite"
  tone: "clear, energetic and factual; written for a curious non-expert audience"

images:                         # tried in order; "hf:" = Hugging Face Space (free GPU quota, ~7 images/day), "@cf/" = Cloudflare (10,000 neurons/day)
  cover_models:                 # Qwen: best at combining several stories into one collage
    - "hf:mcp-tools/Qwen-Image"
    - "@cf/black-forest-labs/flux-1-schnell"   # ~100 neurons
  story_models:                 # used only where no stock/NASA/press video was found
    - "hf:black-forest-labs/FLUX.1-dev"        # most photorealistic
    - "hf:mcp-tools/Qwen-Image"
    - "@cf/black-forest-labs/flux-1-schnell"

instagram:
  api_version: "v23.0"

brand:
  background: "#0B0F19"
  surface: "#151B2C"
  text: "#F5F7FB"
  muted: "#9AA3B8"
  accent: "#7C5CFF"
  accent2: "#22D3EE"

sources:
  rss:
    - { name: "TechCrunch",      url: "https://techcrunch.com/category/artificial-intelligence/feed/" }
    - { name: "The Verge",       url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml" }
    - { name: "Wired",           url: "https://www.wired.com/feed/tag/ai/latest/rss" }
    - { name: "The Decoder",     url: "https://the-decoder.com/feed/" }
    - { name: "MIT Tech Review", url: "https://www.technologyreview.com/topic/artificial-intelligence/feed" }
    - { name: "Ars Technica",    url: "https://arstechnica.com/ai/feed/" }
    - { name: "OpenAI",          url: "https://openai.com/news/rss.xml" }
    - { name: "Google DeepMind", url: "https://deepmind.google/blog/rss.xml" }
    - { name: "Google AI",       url: "https://blog.google/technology/ai/rss/" }
    - { name: "Microsoft",       url: "https://news.microsoft.com/source/topics/ai/feed/" }
    - { name: "NVIDIA",          url: "https://blogs.nvidia.com/feed/" }
    - { name: "Hugging Face",    url: "https://huggingface.co/blog/feed.xml" }
  hackernews:
    query: "AI"
    min_points: 150

video:                          # video slides in the carousel
  enabled: true                 # cover + story slides become 6 s clips; the outro stays a photo
  seconds: 6
  broll: true                   # real stock / NASA footage as story backgrounds when a good clip is found
  broll_providers: [nasa, pexels, pixabay]   # nasa only for space stories; pexels/pixabay need free API keys

github_user: dtechmonkey        # @mentioned in the daily heads-up issue (email notification)

# Official newsrooms linked in the heads-up issue when a story is about that company.
# Check each site's terms: use only clips offered for media/editorial use.
newsrooms:
  Apple: https://www.apple.com/newsroom/
  NVIDIA: https://nvidianews.nvidia.com/
  Google: https://blog.google/image-library/
  Microsoft: https://news.microsoft.com/source/
  Meta: https://about.fb.com/news/
  OpenAI: https://openai.com/news/
  Anthropic: https://www.anthropic.com/news
  Samsung: https://news.samsung.com/global/
  Tesla: https://www.tesla.com/presskit
  Amazon: https://press.aboutamazon.com/
  AMD: https://newsroom.amd.com/
  Qualcomm: https://www.qualcomm.com/news
  Intel: https://www.intel.com/content/www/us/en/newsroom/home.html
  NASA: https://images.nasa.gov/
