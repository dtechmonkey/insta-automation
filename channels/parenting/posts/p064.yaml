caption: |
  “Nahi!” “No!” “NO!” If your toddler's favourite word is no, congratulations: they're right on track. 😄

  Around age 2, children discover they're separate people with their own opinions. “No” is how they practise.

  What they might mean:
  🙋 “I'm my own person.”
  🎮 “I want some control.”
  🧪 “I'm testing the rules.”
  🎉 “I just love saying this word!”

  Offer two choices, keep limits calm and steady, and laugh when you can. 🌿

  How many no's do you hear in a day? 👇
