printable:
  title: "Fewer Battles: Choices and Games"
  subtitle: "For the 'no!' stage · Ages 2–4"
  intro: "Toddlers resist commands but love choices and games. These swaps turn power struggles into cooperation."
  sections:
    - heading: "Offer two choices"
      items:
        - "“Red cup or blue cup?”"
        - "“Walk or hop to the bath?”"
        - "“Shoes first or jacket first?”"
        - "“You put the toys away, or should we do it together?”"
    - heading: "Make it a game"
      items:
        - "“Can you get there before I count to 10?”"
        - "“Let's tiptoe like mice to the car.”"
        - "Sing the instruction"
        - "Use a toy to 'ask' them"
    - heading: "When it really matters"
      items:
        - "Safety limits are not choices: “I'll hold your hand on the road.”"
        - "Calm, short, the same every time"
    - heading: "Use 'yes' more"
      text: "Turn 'No, not now' into 'Yes, after lunch'. Same limit, less resistance."
  sources:
    - label: "General early-childhood guidance on toddler autonomy."
