id: p075
plan: "D38 1 PM · Practical"
topic: "Practical life · age 2–3"
keyword: FOLD
slides:
  - kind: cover
    title: "Folding: start with *napkins*"
    body: ""
    prompt: >-
      A 2-year-old South Asian girl at a low table folding a small cloth napkin in half, a small stack of folded
      napkins beside her. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft cream
      watercolor wash, reserved for text.
  - kind: tip
    title: "Draw a *fold line*"
    body: "A stitched or drawn line on a napkin shows exactly where to fold."
    prompt: >-
      Close view of a square cloth napkin with a simple stitched line across the middle, small hands lifting one
      corner towards the other. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty,
      soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "Corner to *corner*"
    body: "Match the corners, then smooth the fold with a flat hand."
    prompt: >-
      A mother slowly demonstrating matching corners of a napkin and smoothing it with a flat hand, her toddler
      watching. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green
      watercolor wash, reserved for text.
  - kind: tip
    title: "Then *towels*"
    body: "Small hand towels next, folded in half and half again."
    prompt: >-
      A 3-year-old South Asian boy folding a small hand towel on a bed, concentrating. Keep the child in the lower
      60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "Then their *own* t-shirt"
    body: "Sleeves in, fold in half. Around 4, many can do it."
    prompt: >-
      A 4-year-old South Asian girl folding her own small t-shirt on a bed, placing it on a little pile. Keep the
      child in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved for
      text.
  - kind: outro
    title: "Fold by fold, *capable*."
    body: "Does your child help with folding?"
    prompt: >-
      A father and his 3-year-old son sitting on a bed with a laundry basket, both folding and laughing. Keep the
      figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor wash,
      reserved for text.
caption: |
  Folding is a classic Montessori practical-life skill, and it starts with something small: a napkin. 🧺

  The steps:
  ✏️ Napkins with a drawn or stitched fold line
  📐 Corner to corner, smooth with a flat hand
  🧻 Then small hand towels
  👕 Then their own t-shirts (often around age 4)

  Folding builds order, precision and the joy of finishing a job. 🌿

  Does your child help with folding? 👇
hashtags: >-
  #practicallife #montessori #montessoriathome #folding #toddlerhelpers #montessoriindia #2yearold
  #chores #indianmoms #lifeskills #letmetry #toddleractivities
printable:
  title: "Folding Step by Step"
  subtitle: "From napkins to t-shirts · Ages 2–4"
  intro: "Folding teaches precision and order. Start simple, and add a new item only when the last one feels easy."
  sections:
    - heading: "Level 1: Napkins (age 2+)"
      items:
        - "Draw or stitch a line across a cloth napkin"
        - "Fold along the line, corner to corner"
        - "Smooth with a flat hand"
    - heading: "Level 2: Diagonal and quarters"
      items:
        - "Fold into a triangle along a diagonal line"
        - "Fold in half, then half again"
    - heading: "Level 3: Towels (age 3+)"
      items:
        - "Small hand towels in half, then half again"
        - "Stack them in a basket"
    - heading: "Level 4: T-shirts (age 4+)"
      items:
        - "Lay flat, face down"
        - "Fold each sleeve in"
        - "Fold bottom to top"
  sources:
    - label: "Montessori, M. The Discovery of the Child (practical life: folding)."
