printable:
  title: "Festival Day Rhythm Planner"
  subtitle: "Keep the anchors steady · Ages 2–4"
  intro: >-
    Write in your plan for the big day. Keep the anchors (sleep, meals, wind-down) close to your normal times,
    and fit the celebrations around them.
  sections:
    - heading: "Anchors"
      items:
        - "Wake-up time:"
        - "Breakfast:"
        - "Lunch:"
        - "Nap (where?):"
        - "Dinner:"
        - "Bath and story:"
        - "Bedtime:"
    - heading: "Pack for visits"
      items:
        - "Their blanket or soft toy"
        - "Simple snacks and water"
        - "A change of clothes"
        - "A small quiet activity (book, crayons)"
    - heading: "Signs they need a break"
      items:
        - "Rubbing eyes, yawning"
        - "Clinginess or whining"
        - "Getting louder or more 'wild'"
  sources:
    - label: "General paediatric guidance on toddler sleep and routines."
