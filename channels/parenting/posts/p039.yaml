caption: |
  Late nights, skipped naps, sweets for lunch… and then the meltdown. Festival days don't have to go this way. 🪔

  Toddlers feel safe when their day has a predictable rhythm. Keeping a few anchors steady makes celebrations much smoother.

  The anchors:
  ☀️ Wake-up close to normal
  🍛 Real meals first, sweets after
  😴 A nap, even on the go (bring their blanket or soft toy)
  🛁 A calm wind-down before bed, even if it's late

  You don't need perfection. Just enough rhythm to keep everyone smiling. 🌿

  How do you manage routines during festivals? 👇
