caption: |
  “Montessori? That's for rich people with fancy wooden toys.” This is one of the biggest myths we hear. 🪵

  The first Montessori school, Casa dei Bambini, opened in 1907 for children in a poor neighbourhood of Rome. Montessori is a way of seeing children: as capable people who learn through real work and independence.

  What it actually needs:
  🙌 Respect for the child
  🫗 Real tools: steel jugs, katoris, a cloth
  ⏳ Time to let them try
  🏠 A home arranged so they can reach things

  Research has even found Montessori preschool helped narrow the gap between children from lower- and higher-income families.

  What surprised you most? 👇
