printable:
  title: "Montessori at Home on Zero Budget"
  subtitle: "Principles and free materials · Ages 2–6"
  intro: >-
    Montessori is an approach, not a product. These principles and everyday materials cost nothing.
  sections:
    - heading: "What the research found"
      items:
        - "Children in public Montessori preschools showed stronger academic outcomes, and Montessori narrowed the gap between lower- and higher-income children (Lillard et al., 2017)."
    - heading: "Core principles"
      items:
        - "Follow the child's interests"
        - "Let them do it themselves"
        - "Real work with real tools"
        - "A calm, ordered environment"
        - "Freedom within limits"
    - heading: "Free materials from your home"
      items:
        - "Steel jugs, katoris and spoons: pouring and spooning"
        - "Dals and beans: sorting and transferring"
        - "Cloths and a small broom: cleaning"
        - "Socks and laundry: matching"
        - "Fruits and vegetables: washing, peeling, naming"
        - "Cardboard boxes: building and imagination"
    - heading: "What to skip"
      text: "Expensive branded toys, screens marketed as 'educational', and over-scheduling."
  sources:
    - label: "Lillard, A. S., Heise, M. J., Richey, E. M., Tong, X., Hart, A., & Bray, P. M. (2017). Montessori preschool elevates and equalizes child outcomes: A longitudinal study. Frontiers in Psychology, 8, 1783."
    - label: "Lillard, A. S. (2017). Montessori: The Science Behind the Genius. Oxford University Press."
