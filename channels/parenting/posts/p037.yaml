id: p037
plan: "D19 1 PM · Practical (festive)"
topic: "Practical life · age 3–4"
keyword: CARDS
slides:
  - kind: cover
    title: "Card-making and gift-wrapping: festive *practical life*"
    body: ""
    prompt: >-
      A 3-year-old South Asian girl at a low table wrapping a small box in colourful paper with tape, her tongue
      out in concentration, a handmade card beside her. Keep the child in the lower 60% of the frame. Leave the
      top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "*Fold* the card"
    body: "Show how to match the corners and press the fold. Slowly."
    prompt: >-
      Close view of small hands folding a piece of coloured card in half, matching the corners on a table. Keep
      the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash,
      reserved for text.
  - kind: tip
    title: "Stick and *decorate*"
    body: "Glue stick, paper shapes, stickers. Their design, their way."
    prompt: >-
      A 3-year-old South Asian boy sticking paper flowers onto a folded card with a glue stick, colourful scraps
      around him. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green
      watercolor wash, reserved for text.
  - kind: tip
    title: "Practise *taping*"
    body: "Pre-cut tape strips on the table edge. Tearing tape is hard for little hands!"
    prompt: >-
      A row of short tape strips stuck along a table edge, a toddler's hand peeling one off to wrap a small box.
      Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor
      wash, reserved for text.
  - kind: tip
    title: "They *give* it"
    body: "Let them hand over the card themselves. Giving feels wonderful."
    prompt: >-
      A 3-year-old South Asian girl shyly handing a handmade card to her smiling grandmother. Keep the figures in
      the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: outro
    title: "Made with *love* (and lots of tape)."
    body: "Who will your little one make a card for?"
    prompt: >-
      A small pile of lumpy, colourfully wrapped gifts and handmade cards on a table, a proud toddler peeking
      from behind it. Keep the subject in the lower 55% of the frame. Leave the top 40% as an empty, soft
      sage-green watercolor wash, reserved for text.
caption: |
  The most treasured gift this season? A lumpy, tape-covered present wrapped by a 3-year-old. 🎁

  Card-making and wrapping are full of practical-life skills: folding, gluing, tearing tape and finishing a task, plus the joy of giving.

  Tips:
  📄 Show folding slowly: match the corners, press the fold
  ✂️ Pre-cut paper shapes for decorating
  🩹 Stick tape strips on the table edge, ready to use
  💌 Let them give it themselves

  Who will your little one make a card for? 👇
hashtags: >-
  #diwali #handmadecards #kidscrafts #practicallife #montessori #montessoriathome #festivewithkids
  #finemotorskills #indianmoms #diwali2026 #letmetry #giftwrapping
printable:
  title: "Festive Card and Wrapping Station"
  subtitle: "Practical life for the giving season · Ages 3–4"
  intro: >-
    Set up a small 'station' with everything your child needs, and let them make cards and wrap gifts as
    independently as possible.
  sections:
    - heading: "Set up"
      items:
        - "Folded blank cards (or card sheets to fold)"
        - "A glue stick and pre-cut paper shapes"
        - "Stickers and crayons"
        - "Small boxes and wrapping paper cut to size"
        - "Tape strips pre-stuck along the table edge"
    - heading: "Skills they practise"
      items:
        - "Folding and matching corners"
        - "Gluing and placing"
        - "Peeling stickers and tape (pincer grip)"
        - "Planning and finishing"
    - heading: "Make it meaningful"
      items:
        - "Talk about who the card is for"
        - "Let them 'write' or draw their name"
        - "They hand it over themselves"
  sources:
    - label: "Montessori, M. The Discovery of the Child (practical life)."
