id: p028
plan: "D14 7:30 PM · Practical (recap)"
topic: "Our first 2 weeks · ages 2–4"
keyword: TOP5
slides:
  - kind: cover
    title: "5 favourite ideas from our *first 2 weeks*"
    body: "Save this one"
    prompt: >-
      A collage-like warm watercolor scene of a cosy Indian home with several small vignettes: a toddler
      pouring water, sorting dals, watering a plant, wearing a jacket, rolling dough. Keep the scene in the
      lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "Pouring with a steel *jug*"
    body: "Start dry with rajma, then water. Spills are practice."
    prompt: >-
      A 2-year-old South Asian girl pouring water from a small steel jug into a tumbler at a low table, a sponge
      nearby. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor
      wash, reserved for text.
  - kind: tip
    title: "Describe, don't just *praise*"
    body: "“You used so many colours!” instead of “Good job!”"
    prompt: >-
      A mother pointing at her 3-year-old son's colourful drawing with interest while he smiles proudly. Keep
      the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green watercolor wash,
      reserved for text.
  - kind: tip
    title: "Turns, not forced *sharing*"
    body: "“You can have it when she's done.”"
    prompt: >-
      Two South Asian toddlers on a rug, one waiting patiently with a parent while the other finishes playing
      with a wooden train. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft
      dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "A calm *corner*"
    body: "A place to go with big feelings, not a punishment."
    prompt: >-
      A cosy corner with cushions and a soft toy where a 3-year-old South Asian girl sits calmly, breathing
      slowly. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor
      wash, reserved for text.
  - kind: tip
    title: "Fewer toys, deeper *play*"
    body: "6–8 toys on a low shelf. Rotate weekly."
    prompt: >-
      A minimal low wooden shelf with a few toys in baskets and a 2-year-old South Asian boy choosing one. Keep
      the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash,
      reserved for text.
  - kind: outro
    title: "Thank you for *trying* with us."
    body: "Which idea worked best in your home? 💛"
    prompt: >-
      A happy South Asian family sitting together on a rug with their toddler, everyone laughing, warm evening
      light. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green
      watercolor wash, reserved for text.
caption: |
  Two weeks of Let Me Try! 🌿 Thank you for trying these ideas with us.

  Here are 5 favourites to save:
  💧 Pouring with a steel jug
  🎨 Describe, don't just praise
  🧸 Turns, not forced sharing
  🛋️ A calm corner for big feelings
  🧺 Fewer toys, deeper play

  Which idea worked best in your home? Tell us below. We read every comment 💛

  Follow along for 2 new ideas every day.
hashtags: >-
  #montessori #montessoriathome #gentleparenting #parentingtips #montessoriindia #toddleractivities
  #indianparents #indianmoms #positiveparenting #toddlerlife #letmetry #raisingkids
