  - kind: outro
    title: "Spills are *practice*, not mistakes."
    body: "Which step is your child on?"
    prompt: >-
      A 2-year-old South Asian girl wiping a small spill on a wooden tray with a sponge, smiling proudly, a
      small jug beside her. Gentle warm light. Keep the child in the lower 55% of the frame. Leave the top 40%
      as an empty, soft sage-green watercolor wash, reserved for text.
caption: |
  Pouring looks simple. For a 2-year-old, it's a full-body workout of focus, balance and hand control. 💧

  Montessori classrooms start with dry pouring for a reason: it's slow, forgiving and easy to clean up.

  The 4 steps:
  1️⃣ Dry: rajma or chana between two small jugs
  2️⃣ Show it slowly, with few words
  3️⃣ A little water (a third of the jug) with a sponge nearby
  4️⃣ Real pouring: their own water at meals

  Expect spills. Hand them the sponge, not a sigh. 🌿

  Which step is your child on? 👇
