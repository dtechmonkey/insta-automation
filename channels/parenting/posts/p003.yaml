slides:
  - kind: cover
    title: "Pouring work: from dry rajma to *water*"
    body: "4 steps to a confident little pourer"
    prompt: >-
      A 2-year-old South Asian girl sitting at a low wooden table, pouring dry red rajma beans from one small
      steel jug into another, deeply focused. A small tray holds the jugs. Calm home corner, soft light. Keep
      the child in the lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash,
      reserved for text.
  - kind: tip
    title: "Start *dry*"
    body: "Two small jugs on a tray. Rajma or chana pours slowly and is easy to pick up."
    prompt: >-
      Top-down view of a small wooden tray on a low table holding two little steel jugs, one filled with dry
      rajma beans, and a few beans scattered on the tray. Small toddler hands reaching for a jug. Keep the tray
      in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved for
      text.
  - kind: tip
    title: "Show it *slowly*"
    body: "Hold the handle, tip gently, watch the stream. Few words, slow hands."
    prompt: >-
      A mother kneeling beside a low table slowly demonstrating pouring beans from a small steel jug while her
      2-year-old South Asian son watches her hands intently. Keep the figures in the lower 60% of the frame.
      Leave the top 35% as an empty, soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "Then a little *water*"
    body: "Fill the jug only a third. Add a small sponge on the tray for drips."
    prompt: >-
      A 2-year-old South Asian boy carefully pouring water from a small glass jug into a small steel tumbler on
