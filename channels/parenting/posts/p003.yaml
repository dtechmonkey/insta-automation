      lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "Pour for *real*"
    body: "Their own water at meals, milk for cereal, water for the plants."
    prompt: >-
      A happy 3-year-old South Asian girl pouring water into her own steel tumbler at a family dining table
