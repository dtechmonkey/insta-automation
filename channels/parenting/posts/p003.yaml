printable:
  title: "Pouring Work: A 4-Step Montessori Sequence"
  subtitle: "Practical life · Ages 2–3 · 10 minutes a day"
  intro: >-
    Pouring builds hand-eye coordination, concentration and independence. Move to the next step only when
    your child is pouring the current one calmly and with few spills.
  sections:
    - heading: "You'll need"
      items:
        - "A small tray"
        - "Two small jugs with handles (steel or small glass)"
        - "Dry rajma, chana or whole moong"
        - "A small sponge and a cloth"
        - "Their own small tumbler for meals"
    - heading: "Step 1: Dry pouring"
      items:
        - "Fill one jug a third full with beans."
        - "Pour into the empty jug, then back again."
        - "Pick up dropped beans with fingers. That's fine-motor practice too."
    - heading: "Step 2: Show, don't tell"
      items:
        - "Sit to your child's right, so they can see your hands clearly."
        - "Hold the handle, support the spout with two fingers, tip slowly."
        - "Say almost nothing. Let them watch."
        - "Offer: 'Would you like a turn?'"
    - heading: "Step 3: Water"
      items:
        - "Start with a third of a jug. Add a drop of food colour to make it easy to see."
        - "Keep a sponge on the tray. Show how to squeeze it out."
    - heading: "Step 4: Real life"
      items:
        - "Their own water at every meal."
        - "Pouring dal water for the plants."
        - "Pouring milk onto cereal or poha."
    - heading: "Troubleshooting"
      items:
        - "Lots of spills? Use less in the jug and a smaller jug."
        - "Throwing beans? Calmly put the tray away: 'We'll try again later.'"
        - "Bored? Add a funnel or a third container."
  sources:
    - label: "Montessori, M. The Discovery of the Child (practical life exercises)."
    - label: "Lillard, A. S. (2017). Montessori: The Science Behind the Genius. Oxford University Press."
