  - kind: tip
    title: "Pinch, push, *pull*"
    body: "Show slowly: pinch the button, push it halfway, pull it through."
    prompt: >-
      A mother slowly demonstrating buttoning on a dressing frame while her 3-year-old son watches closely. Keep
      the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash,
      reserved for text.
  - kind: tip
    title: "Then their *own* clothes"
    body: "A cardigan on the table first, then on their body."
    prompt: >-
      A 3-year-old South Asian girl buttoning her own cardigan in front of a low mirror, proud and focused. Keep
      the child in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash,
