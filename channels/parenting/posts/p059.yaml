printable:
  title: "Make a Dressing Frame at Home"
  subtitle: "Buttons, zips and velcro practice · Ages 3–4"
  intro: "Dressing frames let children practise fastenings on a flat surface before trying them on their own body."
  sections:
    - heading: "You'll need"
      items:
        - "A sturdy cardboard square (about 30 × 30 cm)"
        - "An old shirt with big buttons (or a cardigan)"
        - "Strong tape or a stapler"
        - "Scissors (adult use)"
    - heading: "Make it"
      items:
        - "Cut a window in the cardboard."
        - "Cut the front panel of the shirt, keeping buttons and buttonholes."
        - "Stretch it over the window and tape the edges at the back."
    - heading: "More frames"
      items:
        - "Velcro (easiest)"
        - "Big snaps"
        - "A large zip from an old jacket"
        - "Bows with ribbon (age 4+)"
    - heading: "How to show"
      text: "Slowly, with few words: pinch the button, push it halfway through, pull it from the other side."
  sources:
    - label: "Montessori, M. The Discovery of the Child (dressing frames)."
