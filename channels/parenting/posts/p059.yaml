      reserved for text.
caption: |
  Buttoning is hard! It needs pinching, pushing and two hands working together. A dressing frame makes it easier to practise. 🔘

  Montessori classrooms use dressing frames, and you can make one for free:
  📦 Tape the button panel from an old shirt over a cardboard frame
  ⚪ Start with big, flat buttons
  🤏 Show slowly: pinch, push, pull
  👕 Then practise on a cardigan on the table, then on their body

  Can your little one button yet? 👇
