plan: "D11 1 PM · Practical"
topic: "Care of the environment · ages 2–4"
keyword: PLANTS
slides:
  - kind: cover
    title: "Watering plants: a daily job that teaches *care*"
    body: ""
    prompt: >-
      A 2-year-old South Asian girl on a sunny balcony carefully watering a small potted tulsi plant with a tiny
      watering can, among a few other potted plants. Keep the child in the lower 60% of the frame. Leave the top
      35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "A *small* watering can"
    body: "Child-sized and only a little water. Less to spill, more to repeat."
    prompt: >-
      Close view of a small child's hand holding a tiny metal watering can, pouring a thin stream of water onto
      soil in a clay pot. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft
      peach watercolor wash, reserved for text.
  - kind: tip
    title: "Touch the *soil*"
    body: "Dry? Water it. Wet? Not today. Simple science."
    prompt: >-
      A 3-year-old South Asian boy poking his finger into the soil of a potted plant with a curious face, his
      father crouching beside him. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty,
      soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "Wipe the *leaves*"
    body: "A damp cloth on big leaves. Slow, gentle, very calming."
    prompt: >-
      A 3-year-old South Asian girl gently wiping a large green leaf of a money plant with a small damp cloth,
      concentrating. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft
      dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "Their *own* plant"
    body: "A methi or mustard seed pot they own. Sprouts in days!"
    prompt: >-
      A 3-year-old South Asian boy proudly holding a small clay pot with tiny green sprouts, a hand-painted pot.
      Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash,
      reserved for text.
  - kind: outro
    title: "Little hands, *growing* things."
    body: "Does your child have a plant of their own?"
    prompt: >-
      A mother and her 2-year-old South Asian daughter on a balcony full of plants, the child pointing excitedly
      at a new flower bud. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft
      sage-green watercolor wash, reserved for text.
caption: |
  One small plant can teach a toddler patience, responsibility and gentleness. 🌱

  In Montessori, 'care of the environment' is part of daily life. Children take care of the space and the living things around them.

  Start simple:
  🚿 A small watering can with a little water
  👆 Touch the soil: dry = water, wet = wait
  🍃 Wipe big leaves with a damp cloth
  🌱 Give them their own fast-growing pot: methi or mustard sprouts in days

  Make it a daily job, at the same time every day. 🌿

  Does your child have a plant of their own? 👇
hashtags: >-
  #montessori #montessoriathome #careoftheenvironment #gardeningwithkids #practicallife #montessoriindia
  #toddleractivities #naturekids #indianmoms #balconygarden #letmetry #lifeskills
printable:
  title: "Plant Care for Little Hands"
  subtitle: "Care of the environment · Ages 2–4"
  intro: >-
    Caring for a living thing is one of the most meaningful jobs a young child can have. Start with one hardy
    plant and one fast sprouting pot.
  sections:
    - heading: "You'll need"
      items:
        - "A small watering can (or a small jug)"
        - "A small damp cloth"
        - "One hardy plant: money plant, tulsi, snake plant"
        - "A small pot, soil and methi or mustard seeds"
    - heading: "Daily routine"
      items:
        - "Touch the soil. Dry? Water a little. Wet? Not today."
        - "Wipe one or two big leaves gently."
        - "Pick up any fallen leaves."
    - heading: "Grow methi in 5 days"
      items:
        - "Day 1: Soak seeds overnight."
        - "Day 2: Sprinkle on moist soil, cover lightly."
        - "Day 3–5: Keep moist. Watch for sprouts!"
        - "Week 2: Snip and add to your dal or paratha together."
    - heading: "Talk about it"
      items:
        - "“What does the plant need?” (water, sun, soil)"
        - "“Is the soil dry or wet?”"
        - "“How tall is it today?” Measure with a stick each week."
    - heading: "Safety"
      text: >-
        Choose plants that are safe if touched or nibbled, and keep pots small enough not to tip on little
        feet.
  sources:
    - label: "Montessori, M. The Discovery of the Child (care of the environment)."
