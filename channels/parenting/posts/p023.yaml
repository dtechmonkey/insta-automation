caption: |
  If bedtime is a nightly battle, the fix is usually not stricter rules. It's a predictable routine. 🌙

  Research finds that young children with a consistent bedtime routine fall asleep faster, wake less at night and sleep longer, and the effect grows the more nights the routine happens.

  The simple version:
  📋 Same order every night: bath, pyjamas, brush, book, cuddle
  💡 Dim lights and screens off an hour before
  🎯 Two small choices: which book, which pyjamas
  🎵 The same last song or words every night

  Picture cards on the wall help toddlers follow along on their own. 🌿

  What time does your toddler sleep? 👇

  (General information, not medical advice.)
