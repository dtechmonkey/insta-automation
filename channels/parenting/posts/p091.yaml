printable:
  title: "Care of the Home: Little Cleaning Jobs"
  subtitle: "Child-sized tools and steps · Ages 2–4"
  intro: "Real cleaning jobs build coordination, responsibility and belonging. Keep the tools small and within reach."
  sections:
    - heading: "Tools (child-sized)"
      items:
        - "A short broom and a small dustpan"
        - "A small mop or cloth"
        - "A spray bottle of water"
        - "A small bucket"
    - heading: "Sweeping steps"
      items:
        - "Mark a square on the floor with tape"
        - "Sweep crumbs into the square"
        - "Hold the dustpan flat; sweep crumbs in"
        - "Tip into the bin; hang the broom back up"
    - heading: "More jobs"
      items:
        - "Wipe the table after meals"
        - "Spray and wipe low windows"
        - "Mop a small spill"
        - "Dust low shelves"
  sources:
    - label: "Montessori, M. The Discovery of the Child (care of the environment)."
