keyword: SWEEP
slides:
  - kind: cover
    title: "Sweeping with a *small broom* and dustpan"
    body: ""
    prompt: >-
      A 2-year-old South Asian boy sweeping a small pile of crumbs on a kitchen floor with a child-sized broom,
      a small dustpan beside him, his mother sweeping nearby. Keep the figures in the lower 60% of the frame.
      Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "*Child-sized* tools"
    body: "A short broom and a small dustpan. Real, not toy."
    prompt: >-
      A small child-sized broom and dustpan hanging on low hooks on a wall. Keep the subject in the lower 60% of
      the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "Sweep *into* a shape"
    body: "Mark a square with tape on the floor. Sweep the crumbs inside it."
    prompt: >-
      A 3-year-old South Asian girl sweeping crumbs into a small square marked with masking tape on the floor.
      Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green watercolor
      wash, reserved for text.
  - kind: tip
    title: "Then the *dustpan*"
    body: "Hold the pan, sweep in, tip into the bin."
    prompt: >-
      A 3-year-old South Asian boy tipping a dustpan of crumbs into a small bin, focused. Keep the child in the
      lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash, reserved for text.
  - kind: outro
    title: "Little broom, *big* help."
    body: "Does your toddler love to sweep?"
    prompt: >-
      A proud 2-year-old South Asian girl holding a small broom, standing in a tidy kitchen, her grandmother
      smiling. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green
      watercolor wash, reserved for text.
caption: |
  Toddlers LOVE sweeping. Give them a real (small) broom and watch the concentration. 🧹

  Sweeping builds coordination, focus and a sense of caring for the home.

  How to:
  🧹 A child-sized broom and dustpan on a low hook
  ⬜ Tape a square on the floor; sweep the crumbs into it
  🗑️ Then use the dustpan and tip it into the bin
  🍞 After meals is the perfect time

  Does your toddler love to sweep? 👇
