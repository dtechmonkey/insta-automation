printable:
  title: "Everyday Counting Games"
  subtitle: "Building real number sense · Ages 3–5"
  intro: "Real counting has three parts: saying numbers in order, one number per object, and knowing the last number is 'how many'."
  sections:
    - heading: "Games"
      items:
        - "Count plates and spoons while setting the table"
        - "Count stairs as you climb"
        - "Count rotis, idlis or grapes on the plate"
        - "Count jumps, claps or hops"
        - "Count toys back into the basket"
    - heading: "Montessori-style activity"
      items:
        - "Make number cards 1–5"
        - "Put the right number of chana under each card"
        - "Later: cards 1–10"
    - heading: "Ask"
      items:
        - "“How many are there?”"
        - "“Which pile has more?”"
        - "“If I take one away, how many now?”"
  sources:
    - label: "Montessori, M. The Montessori Method (mathematics: cards and counters)."
