slides:
  - kind: cover
    title: "Counting with *real objects*, beyond reciting"
    body: ""
    prompt: >-
      A 3-year-old South Asian girl counting small steel spoons into a basket one by one, touching each, her
      father watching. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft cream
      watercolor wash, reserved for text.
  - kind: tip
    title: "Reciting isn't *counting*"
    body: "Saying 1 to 20 is a song. Counting means one number for each object."
    prompt: >-
      A 3-year-old South Asian boy saying numbers out loud while pointing randomly at a pile of blocks, his mother
      smiling. Gentle humour. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft
      peach watercolor wash, reserved for text.
  - kind: tip
    title: "*Touch* and count"
    body: "Move each object as you count it. One touch, one number."
    prompt: >-
      Close view of a small finger moving chana one at a time from a pile into a row, counting. Keep the subject
      in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green watercolor wash, reserved for
      text.
  - kind: tip
    title: "Count *real life*"
    body: "Plates for dinner, stairs, shoes by the door, rotis on the plate."
    prompt: >-
      A 3-year-old South Asian girl counting steps as she climbs a staircase holding the railing, her
      grandfather behind her. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft
      dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "*“How many?”*"
    body: "After counting, ask: “So how many are there?” The last number is the answer."
    prompt: >-
      A 3-year-old South Asian boy holding up four fingers proudly next to four oranges on a table. Keep the child
      in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: outro
    title: "Maths is *everywhere*."
    body: "What does your child love to count?"
    prompt: >-
      A happy South Asian mother and her 3-year-old counting stars on a balcony at dusk, pointing at the sky. Keep
      the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor wash,
      reserved for text.
caption: |
  “She can count to 50!” But can she count 5 spoons? Those are two different skills. 🔢

  Reciting numbers is like a song. Real counting means matching one number to each object, and knowing the last number tells you 'how many'.

  Try:
  ✋ Touch and move each object as you count
  🍽️ Count real life: plates, stairs, shoes, rotis
  ❓ Ask: “So how many are there?”
  🔟 Start small: up to 5, then 10

  What does your child love to count? 👇
