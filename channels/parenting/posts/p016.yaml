topic: "Self-esteem · ages 2–4"
keyword: COMPARE
slides:
  - kind: cover
    title: "*“Sharma ji ka beta”* is hurting your child"
    body: ""
    prompt: >-
      A 4-year-old South Asian boy standing slightly behind his mother, looking down and fidgeting, while in the
      background another child confidently recites something to clapping adults at a family gathering. Gentle,
      empathetic tone. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft cream
      watercolor wash, reserved for text.
  - kind: tip
    title: "They hear: *“You're not enough”*"
    body: "Comparison rarely motivates small children. It mostly makes them feel smaller."
    prompt: >-
      A 3-year-old South Asian girl sitting alone on a staircase hugging her knees, a little sad, soft muted
      light. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor
      wash, reserved for text.
  - kind: tip
    title: "Milestones have *ranges*"
    body: "Talking, reading, counting: normal spans are wide. Every child has their own pace."
    prompt: >-
      Three South Asian toddlers of similar age playing differently on a rug: one stacking blocks, one looking
      at a book, one crawling after a ball. Calm, accepting tone. Keep the figures in the lower 60% of the frame.
      Leave the top 35% as an empty, soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "Compare them to *yesterday*"
    body: "“Last month you needed help. Now you do it alone!”"
    prompt: >-
      A father crouching beside his 3-year-old South Asian daughter, who is proudly buttoning her own cardigan,
      both smiling. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft
      dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "Protect them at *gatherings*"
    body: "“He'll say a poem when he's ready.” You don't owe relatives a performance."
    prompt: >-
      A mother at a family gathering gently putting her arm around her shy 3-year-old South Asian son, smiling
      politely at relatives. Warm festive living room. Keep the figures in the lower 60% of the frame. Leave the
      top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: outro
    title: "Your child is the only *your child*."
    body: "Who was your Sharma ji ka beta? 😄"
    prompt: >-
      A joyful 3-year-old South Asian boy running towards his mother's open arms in a sunny park. Keep the
      figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor wash,
      reserved for text.
caption: |
  Every Indian kid grew up with a Sharma ji ka beta: the cousin, neighbour or classmate who did everything better. 😅

  Comparison is meant to motivate. But for young children, it mostly sends one message: “You're not enough.” Children build their sense of self from how the adults around them see them.

  Instead:
  📏 Remember milestones have wide normal ranges
  📈 Compare them only to their own past: “Last month this was hard!”
  🛡️ Protect them from “performing” for relatives
  💛 Notice who they are, not who they're not

  Who was YOUR Sharma ji ka beta? 👇
hashtags: >-
  #sharmajikabeta #gentleparenting #selfesteem #indianparents #indianmoms #desiparents #montessori
  #childpsychology #parentingtips #raisingconfidentkids #letmetry #consciousparenting
printable:
  title: "Instead of Comparing: Words That Build Self-Worth"
  subtitle: "For parents and grandparents · Ages 2–4"
  intro: >-
    Young children build their picture of themselves from how the important adults in their lives describe
    them. Comparison paints them as 'less than'. These swaps help them see their own growth.
  sections:
    - heading: "What we know"
      items:
        - "Children's self-concept forms largely through the messages and appraisals of the adults close to them (Harter, 2012)."
        - "Developmental milestones have wide normal ranges. Two healthy 2-year-olds can be months apart in speech or motor skills."
    - heading: "Swap this…"
      items:
        - "“Look, Riya already reads!” → “You know so many letter sounds now.”"
        - "“Your brother never did this.” → “This is hard for you. Let's work on it.”"
        - "“Why can't you be like him?” → “You're good at different things.”"
        - "“Say the poem for aunty!” → “He'll share when he's ready.”"
    - heading: "Compare them to their past self"
      items:
        - "“Last month you needed help with this. Now you do it alone!”"
        - "“Remember when this puzzle was too hard?”"
        - "Keep a small 'I can' list on the fridge and add to it."
    - heading: "At family gatherings"
      items:
        - "Prepare your child: “Lots of people will say hello. You can wave or say namaste.”"
        - "Answer for them when needed, kindly but firmly."
        - "Talk to grandparents beforehand about avoiding comparisons."
    - heading: "When to check"
      text: >-
        If you're worried your child is far behind in speech, movement or play, speak to your paediatrician.
        Concern is not comparison.
  sources:
    - label: "Harter, S. (2012). The Construction of the Self: Developmental and Sociocultural Foundations (2nd ed.). Guilford Press."
