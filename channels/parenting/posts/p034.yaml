      soft dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "Hand over *gradually*"
    body: "First half the meal, then most of it. Help only when asked."
    prompt: >-
      A mother and her 4-year-old daughter eating side by side, each from their own plate, the child copying how
