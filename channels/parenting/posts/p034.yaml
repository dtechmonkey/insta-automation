  - kind: tip
    title: "It builds their *hands*"
    body: "Scooping, tearing roti, bringing food to the mouth: all fine-motor practice."
    prompt: >-
      Close view of a small child's hand tearing a piece of roti and scooping sabzi with it, on a steel plate.
      Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash,
