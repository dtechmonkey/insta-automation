      empty, soft peach watercolor wash, reserved for text.
  - kind: outro
    title: "Let them *feed* themselves."
    body: "Honest question: until what age were you spoon-fed? 😄"
    prompt: >-
      A happy South Asian family eating together on the floor with hands, the toddler proudly eating alone.
      Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor
      wash, reserved for text.
caption: |
  In many Indian homes, feeding a 4- or 5-year-old by hand is normal. It's faster, cleaner and comes from love. 💛 But it can hold them back.

  Feeding themselves builds hand skills, helps children notice their own hunger and fullness, and builds independence.

  Try a gradual handover:
  🥄 Start with them feeding the first half of the meal
  🫓 Teach tearing roti and scooping
  🧽 Use a mat and a cloth; mess is temporary
  🍽️ Eat together so they can copy you

  Honest question: until what age were YOU spoon-fed? 👇
