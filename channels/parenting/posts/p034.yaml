slides:
  - kind: cover
    title: "Still spoon-feeding at *4*?"
    body: "Why self-feeding matters"
    prompt: >-
      A 4-year-old South Asian boy sitting at a table with his mouth open while his mother spoon-feeds him rice,
      his own hands resting idle on the table. Gentle, non-judgemental tone. Keep the figures in the lower 60% of
