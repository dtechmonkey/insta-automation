printable:
  title: "Handing Over the Spoon: A 3-Week Plan"
  subtitle: "From being fed to eating independently · Ages 2–5"
  intro: >-
    Most toddlers can feed themselves with fingers by about 12 months and use a spoon well by around 2–3
    years. Children fed for longer can learn quickly with a gradual handover.
  sections:
    - heading: "Week 1"
      items:
        - "They eat the first few bites themselves, then you help"
        - "Offer easy finger foods: roti pieces, idli, cut fruit"
        - "Eat together at the table"
    - heading: "Week 2"
      items:
        - "They feed half the meal"
        - "Teach tearing roti and scooping sabzi"
        - "A small spoon and a bowl with sides"
    - heading: "Week 3"
      items:
        - "They feed most of the meal; you help only when asked"
        - "Praise effort: “You fed yourself the whole idli!”"
    - heading: "Tips"
      items:
        - "Smaller portions, seconds allowed"
        - "A mat under the chair, a cloth within reach"
        - "Expect them to eat a little less at first"
        - "No screens at meals"
    - heading: "When to check"
      text: "If your child has trouble chewing or swallowing, or is losing weight, speak to your paediatrician."
  sources:
    - label: "HealthyChildren.org (American Academy of Pediatrics): Feeding and nutrition for toddlers."
      url: "https://www.healthychildren.org/English/ages-stages/toddler/nutrition/"
