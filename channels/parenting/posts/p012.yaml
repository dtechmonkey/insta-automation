printable:
  title: "What to Do Instead of Hitting"
  subtitle: "Calm discipline that works · Ages 2–4"
  medical: true
  intro: >-
    Discipline means teaching. Children learn best from adults who are calm, clear and consistent. Here are
    tools that work in the real moments: hitting, throwing, refusing.
  sections:
    - heading: "What the research found"
      items:
        - "A large review of studies found spanking linked to more aggression, more behaviour problems and poorer parent-child relationships, and not to better behaviour (Gershoff & Grogan-Kaylor, 2016)."
        - "The American Academy of Pediatrics recommends against spanking and harsh verbal discipline (Sege & Siegel, 2018)."
    - heading: "In the moment"
      items:
        - "Stop the action: “I won't let you hit.” Gently hold their hands."
        - "Name the feeling: “You're really angry that it's time to go.”"
        - "Keep your voice low and slow. Your calm is contagious."
        - "Move them to a quieter spot if needed."
    - heading: "After the storm"
      items:
        - "Reconnect with a hug or sitting together."
        - "Teach what to do instead: “When you're angry, you can stamp your feet or squeeze a pillow.”"
        - "Repair together if something got broken or someone got hurt."
    - heading: "Prevent the next one"
      items:
        - "Predictable routines for meals, sleep and outings"
        - "Warnings before transitions: “Five more minutes, then shoes.”"
        - "Two choices instead of commands: “Red cup or blue cup?”"
    - heading: "Talking with grandparents"
      text: >-
        Lead with respect: “You raised us with so much love. We're trying something new that the doctors
        recommend. Can you help us?” Ask them to call you in for discipline moments.
  sources:
    - label: "Gershoff, E. T., & Grogan-Kaylor, A. (2016). Spanking and child outcomes: Old controversies and new meta-analyses. Journal of Family Psychology, 30(4), 453–469."
    - label: "Sege, R. D., Siegel, B. S., & AAP Council on Child Abuse and Neglect (2018). Effective discipline to raise healthy children. Pediatrics, 142(6)."
