id: p019
plan: "D10 1 PM · Practical"
topic: "Sensorial · age 3–4"
keyword: RANGOLI
slides:
  - kind: cover
    title: "Rangoli *colours*: sort, match, pattern"
    body: "A festive Montessori activity"
    prompt: >-
      A 3-year-old South Asian girl sitting on a floor mat arranging colourful flower petals (marigold orange,
      rose pink, white jasmine, green leaves) into a simple circular pattern, a basket of petals beside her.
      Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash,
      reserved for text.
  - kind: tip
    title: "*Sort* by colour"
    body: "A basket of mixed petals, small bowls for each colour."
    prompt: >-
      Top-down view of small steel bowls each holding one colour of flower petals (orange, pink, white, green)
      and a basket of mixed petals, small hands sorting. Keep the subject in the lower 60% of the frame. Leave
      the top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "*Match* the pairs"
    body: "Cut coloured card in pairs. Find the two that match."
    prompt: >-
      A 3-year-old South Asian boy matching pairs of small coloured card squares laid out on a low table,
      holding two orange ones up happily. Keep the child in the lower 60% of the frame. Leave the top 35% as an
      empty, soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "Make a *pattern*"
    body: "Orange, pink, orange, pink… What comes next? Early maths!"
    prompt: >-
      A line of alternating orange and pink flower petals forming a pattern on a floor, a 4-year-old South
      Asian girl placing the next petal with concentration. Keep the subject in the lower 60% of the frame.
      Leave the top 35% as an empty, soft dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "Build a *rangoli* together"
    body: "Petals in a circle on the doorstep. Their part can be imperfect."
    prompt: >-
      A mother and a 3-year-old South Asian boy making a simple flower-petal rangoli together at a home's
      doorstep, the child adding petals to the outer ring. Keep the figures in the lower 60% of the frame.
      Leave the top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: outro
    title: "Festive, and *focused*."
    body: "Will you try a petal rangoli this season?"
    prompt: >-
      A finished, slightly imperfect flower rangoli at a doorstep with a small diya beside it, and a proud
      3-year-old South Asian girl standing next to it. Keep the subject in the lower 55% of the frame. Leave the
      top 40% as an empty, soft sage-green watercolor wash, reserved for text.
caption: |
  Festive season is full of colour, and colour is one of the first things Montessori sensorial work teaches. 🌼

  A flower-petal rangoli turns into a whole learning sequence:
  🎨 Sort petals by colour
  🃏 Match coloured card pairs
  🔁 Make patterns: orange, pink, orange… what's next?
  🌸 Build a family rangoli at the doorstep

  Petals are softer and less messy than powder, and perfect for small hands. 🌿

  Will you try a petal rangoli this season? 👇
hashtags: >-
  #rangoli #montessori #montessoriathome #sensorialplay #montessoriindia #festiveactivities
  #toddleractivities #preschoolactivities #indianmoms #diwaliactivities #letmetry #learningthroughplay
printable:
  title: "Colour Sorting and Patterns with Petals"
  subtitle: "Sensorial work for the festive season · Ages 3–4"
  intro: >-
    In Montessori, children learn to see differences in colour, size and shape through hands-on sorting and
    matching. Flower petals make it beautiful, seasonal and free.
  sections:
    - heading: "You'll need"
      items:
        - "Flower petals and leaves in 3–4 colours (marigold, rose, jasmine, leaves)"
        - "Small bowls or katoris"
        - "Coloured card cut into small squares, in pairs"
        - "A tray or mat"
    - heading: "Step 1: Sort"
      items:
        - "Mix two colours first. Add more as they get confident."
        - "One bowl per colour."
    - heading: "Step 2: Match"
      items:
        - "Lay out card squares face up. Find the two that match."
        - "Later: shades of one colour, light to dark."
    - heading: "Step 3: Patterns"
      items:
        - "Start with AB: orange, pink, orange, pink."
        - "Then ABB or ABC patterns."
        - "Ask: “What comes next?”"
    - heading: "Step 4: Family rangoli"
      items:
        - "Draw a simple circle with chalk at the doorstep."
        - "Fill rings with one colour each."
        - "Let their part stay imperfect. It's theirs."
    - heading: "Words to use"
      text: >-
        Colour names in your home language and English, plus 'same', 'different', 'light', 'dark', 'next'.
  sources:
    - label: "Montessori, M. The Montessori Method (sensorial materials: colour tablets)."
