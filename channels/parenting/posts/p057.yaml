id: p057
plan: "D29 1 PM · Practical"
topic: "Fine motor · age 2–3"
keyword: JARS
slides:
  - kind: cover
    title: "Jars and lids: the *opening and closing* activity"
    body: ""
    prompt: >-
      A 2-year-old South Asian boy at a low table twisting the lid off a small plastic jar, a basket of different
      small jars and boxes beside him, concentrating. Keep the child in the lower 60% of the frame. Leave the top
      35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "Collect *containers*"
    body: "Empty jars, small boxes, purses, tiffin boxes. Different lids, different skills."
    prompt: >-
      A woven basket holding assorted small empty containers: a plastic jar, a small steel tiffin, a coin purse
      with a clasp, a small box with a lid. Keep the subject in the lower 60% of the frame. Leave the top 35% as
      an empty, soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "*Twist*, snap, unzip"
    body: "Screw lids, snap lids, zips, clasps: each needs a different hand movement."
    prompt: >-
      Close view of small hands unzipping a small coin purse, a jar with its lid off beside it. Keep the subject
      in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green watercolor wash, reserved
      for text.
  - kind: tip
    title: "Hide a *surprise*"
    body: "A small toy inside each one makes opening exciting."
    prompt: >-
      A 2-year-old South Asian girl gasping with delight as she opens a small box to find a tiny toy animal
      inside. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue
      watercolor wash, reserved for text.
  - kind: tip
    title: "Then *match* lids"
    body: "Take all the lids off and mix them up. Which lid fits which jar?"
    prompt: >-
      A 3-year-old South Asian boy trying different lids on jars to find the matching one, a row of open jars in
      front of him. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: outro
    title: "Every lid is a little *puzzle*."
    body: "What does your toddler love to open?"
    prompt: >-
      A proud 2-year-old South Asian girl surrounded by opened jars and boxes, holding up a lid triumphantly to
      her mother. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green
      watercolor wash, reserved for text.
caption: |
  Toddlers want to open EVERYTHING. So let's give them a basket made for it. 🫙

  Opening and closing is a classic Montessori activity: twisting, snapping and unzipping build wrist strength, coordination and problem-solving.

  How to:
  🧺 Collect empty jars, boxes, tiffins, purses
  🔄 Different lids: screw, snap, zip, clasp
  🎁 Hide a small toy inside each one
  🧩 Later: mix up the lids and match them

  Choose containers without small parts or sharp edges. 🌿

  What does your toddler love to open? 👇
hashtags: >-
  #montessori #montessoriathome #finemotorskills #toddleractivities #practicallife #montessoriindia
  #2yearold #diyactivities #indianmoms #playathome #letmetry #problemsolving
printable:
  title: "The Opening and Closing Basket"
  subtitle: "Fine-motor work · Ages 2–3"
  intro: "A free activity that builds hand strength, coordination and patience, using containers from your home."
  sections:
    - heading: "Fill the basket with"
      items:
        - "A plastic jar with a screw lid"
        - "A small box with a lift-off lid"
        - "A steel tiffin with clips"
        - "A coin purse with a zip or clasp"
        - "A small bottle with a flip cap"
    - heading: "Levels"
      items:
        - "Level 1: Lift-off and snap lids"
        - "Level 2: Screw lids, large then small"
        - "Level 3: Zips and clasps"
        - "Level 4: Mix up the lids and match them"
    - heading: "Safety"
      text: "Avoid glass, sharp edges and tiny parts; supervise if you hide small toys inside."
  sources:
    - label: "Montessori, M. The Discovery of the Child (practical life)."
