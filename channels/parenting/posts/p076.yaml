printable:
  title: "Parenting Together with Grandparents"
  subtitle: "A conversation guide for joint and nearby families · All ages"
  intro: "Grandparents bring love, wisdom and extra hands. A respectful conversation about a few shared rules keeps everyone on the same team."
  sections:
    - heading: "What the research says"
      items:
        - "A systematic review found grandparent involvement is generally associated with positive child health and development outcomes (Sadruddin et al., 2019)."
    - heading: "Agree on the big things"
      items:
        - "Safety (car seats, roads, water, medicines)"
        - "Sleep times (roughly)"
        - "Screen limits"
        - "No hitting or harsh punishment"
    - heading: "Let go of the small things"
      items:
        - "An extra sweet"
        - "A different bedtime story"
        - "Some extra cuddles and indulgence"
    - heading: "How to talk"
      items:
        - "Start with thanks: “You're so good with her.”"
        - "Explain why: “The doctor said screens before bed affect sleep.”"
        - "Ask for help: “Can we try this together?”"
  sources:
    - label: "Sadruddin, A. F. A., Ponguta, L. A., Zonderman, A. L., Wiley, K. S., Grimshaw, A., & Panter-Brick, C. (2019). How do grandparents influence child health and development? A systematic review. Social Science & Medicine, 239, 112476."
