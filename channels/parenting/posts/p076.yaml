caption: |
  “Dadi gives him sweets before dinner!” “Nana lets her stay up late!” Sound familiar? 😄

  Grandparents 'spoiling' is a classic Indian family debate. But research reviewing many studies finds that involved grandparents are generally linked with positive child outcomes. More loving adults mean more security.

  A balanced approach:
  🤝 Agree on a few big rules: safety, sleep, screens
  🍬 Let the small stuff go
  🏡 Kids understand different rules in different homes
  💬 Talk to grandparents with respect, not criticism

  Agree or disagree? Tag a grandparent 👇
hashtags: >-
