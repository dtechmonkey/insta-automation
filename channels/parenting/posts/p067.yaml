caption: |
  No park nearby? Even a lane with a few trees works. All you need is a small basket and 20 minutes. 🍃

  A nature walk is full of learning: collecting, comparing, counting, naming and noticing.

  Try:
  🧺 Collect fallen leaves, pebbles, seeds, feathers
  🔢 Sort them at home: big/small, smooth/rough, colours
  🔍 Name and notice: “This is a neem leaf.”
  🪟 Make a nature tray on a low shelf

  Collect only fallen things, and wash hands after. 🌿

  What does your child love to collect outside? 👇
hashtags: >-
  #naturewalk #natureplay #montessori #montessoriathome #outdoorlearning #montessoriindia
  #toddleractivities #naturekids #indianmoms #sensoryplay #letmetry #childhoodunplugged
printable:
  title: "Nature Walk Scavenger Hunt"
  subtitle: "Find, collect, sort · Ages 2–4"
  intro: "Take this list on your walk. Tick off what you find, collect a few fallen treasures, and sort them at home."
  sections:
    - heading: "Can you find…"
      items:
        - "A big leaf and a small leaf"
        - "A smooth pebble"
        - "Something yellow"
        - "A feather"
        - "A seed or pod"
        - "A bird (just look!)"
        - "An ant"
        - "A flower on the ground"
    - heading: "Back home"
      items:
        - "Sort by size, colour or texture"
        - "Count them"
        - "Make a leaf rubbing with crayons"
        - "Display them on a nature tray"
    - heading: "Rules"
      text: "Collect only fallen things, leave living plants and creatures, and wash hands afterwards."
  sources:
    - label: "General early-childhood guidance on nature play."
