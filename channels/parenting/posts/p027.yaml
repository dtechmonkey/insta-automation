caption: |
  “Jaldi karo! Hurry up!” …and suddenly they move at half speed. Sound familiar? 😅

  Toddlers can't rush. When we're stressed, they feel it, and they freeze, resist or melt down. Calm mornings are actually faster mornings.

  What helps:
  ⏰ Wake up 15 minutes before the kids
  🎒 Prepare clothes, bags and shoes the night before
  🤗 Start with 5 minutes of cuddles
  🕰️ Give time for “I do it myself”

  Slow is smooth. Smooth is fast. 🌿

  What are your mornings like? Be honest 👇
