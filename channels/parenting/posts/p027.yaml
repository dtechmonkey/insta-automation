printable:
  title: "The Calm Morning Checklist"
  subtitle: "For smoother school and daycare mornings · Ages 2–4"
  intro: >-
    Most morning battles are planned the night before. A little preparation and a slower start make the whole
    day easier for everyone.
  sections:
    - heading: "The night before"
      items:
        - "Two outfits laid out (they choose one in the morning)"
        - "Bag packed and by the door"
        - "Shoes and water bottle ready"
        - "Breakfast planned"
    - heading: "In the morning"
      items:
        - "Wake up 15 minutes before your child"
        - "5 minutes of cuddles before anything else"
        - "Picture cards for the steps: toilet, wash, dress, eat, shoes"
        - "Give 5-minute warnings before leaving"
        - "Let them do what they can themselves"
    - heading: "Phrases that help"
      items:
        - "“First shoes, then we go see the birds.”"
        - "“Do you want to hop or tiptoe to the door?”"
        - "“Let's race the timer!”"
    - heading: "On hard mornings"
      text: >-
        Lower the bar. Mismatched socks and a quick breakfast are fine. Connection matters more than
        perfection.
  sources:
    - label: "General guidance based on Montessori principles of independence and routine."
