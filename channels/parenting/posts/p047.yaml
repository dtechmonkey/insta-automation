printable:
  title: "Bath-Time Independence Checklist"
  subtitle: "Self-care steps · Ages 2–4"
  intro: >-
    Hand over one small job at a time. Children do first, adults finish. Always stay within arm's reach near
    water.
  sections:
    - heading: "Set up"
      items:
        - "A small mug for pouring"
        - "A small bar of soap or a pump bottle"
        - "A small washcloth"
        - "A low towel hook"
        - "A basket for bath toys"
    - heading: "Jobs by age"
      items:
        - "Age 2: pour water, soap tummy, put toys away"
        - "Age 3: wash arms and legs, dry themselves, hang towel"
        - "Age 4: wash hair with help, choose pyjamas, brush hair"
    - heading: "Words to learn"
      text: "Body parts, 'wet' and 'dry', 'warm' and 'cold', 'pour', 'rinse', 'squeeze'."
    - heading: "Safety"
      text: "Never leave a young child alone in or near water. Check water temperature first."
  sources:
    - label: "Montessori, M. The Discovery of the Child (care of the self)."
