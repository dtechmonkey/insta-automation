caption: |
  Bath time is usually something we do TO toddlers. But it's full of chances for them to do it themselves. 🛁

  5 small jobs:
  🫗 Pouring water with a small mug
  🧼 Soaping their tummy, arms and legs
  🧽 Washing with a small cloth
  🧺 Squeezing and tidying the bath toys
  🛁 Drying themselves with a towel from a low hook

  They do first, you finish. 🌿 Never leave a young child alone near water, even for a moment.

  Which bath job does your child love? 👇
