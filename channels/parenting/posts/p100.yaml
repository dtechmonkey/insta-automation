printable:
  title: "Freedom Within Limits at Home"
  subtitle: "The Montessori balance · Ages 2–6"
  intro: "Montessori gives children real choices inside clear, consistent limits. Here's how to bring that balance home."
  sections:
    - heading: "Freedoms"
      items:
        - "Choose an activity from the shelf"
        - "Repeat it as long as they like"
        - "Choose where to work (table or rug)"
        - "Move around freely in safe spaces"
    - heading: "Limits"
      items:
        - "We don't hurt people"
        - "We treat materials with care"
        - "We don't disturb someone else's work"
        - "We put things back when we're done"
    - heading: "How to hold limits"
      items:
        - "Calm, short reminders: “Trays go back on the shelf.”"
        - "Show again instead of scolding"
        - "If materials are misused, put them away for now"
    - heading: "What the research says"
      text: "Montessori education has shown positive effects on children's executive function and academic skills in several studies (Lillard, 2017)."
  sources:
    - label: "Lillard, A. S. (2017). Montessori: The Science Behind the Genius. Oxford University Press."
