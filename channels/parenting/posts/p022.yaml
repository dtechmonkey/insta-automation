caption: |
  If toddlers could explain themselves, maybe they'd say this. 💛

  “I'm not giving you a hard time. I'm having a hard time.”
  “I want to help, even if I'm slow.”
  “When you put the phone down, I feel like the most important person in the world.”
  “I still love you when you're angry. Please love me when I am.”

  They're little for such a short time.

  Send this to someone who needs it today 👇
hashtags: >-
  #toddlerlife #gentleparenting #parentingquotes #montessori #indianparents #indianmoms #momlife
  #dadlife #consciousparenting #childhood #letmetry #connectionnotperfection
printable:
  title: "10 Connection Rituals for Busy Parents"
  subtitle: "Small moments, big impact · All ages"
  intro: >-
    Connection doesn't need hours. It's built in small, daily moments of full attention. Pick two rituals and
    make them part of every day.
  sections:
    - heading: "Daily rituals"
      items:
        - "A 10-minute 'special time': phone away, child leads the play"
        - "A long hug at the door before work and after coming home"
        - "One meal a day together, without screens"
        - "A bedtime question: “What was the best part of your day?”"
        - "A silly family song for bath time"
    - heading: "When they're struggling"
      items:
        - "Get to their eye level"
        - "Name what you see: “That was really hard.”"
        - "Stay close, even if they push you away"
        - "Reconnect after a conflict: “We're okay. I love you.”"
    - heading: "Remember"
      items:
        - "Toddler 'misbehaviour' is often a need: tired, hungry, overwhelmed or wanting you."
        - "You don't have to get it right every time. Repair matters more than perfection."
  sources:
    - label: "Siegel, D. J., & Bryson, T. P. (2011). The Whole-Brain Child. Delacorte Press."
