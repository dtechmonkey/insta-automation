caption: |
  Happy Diwali to you and your little ones! 🪔✨

  This year, we're wishing you a slower, simpler festival: fewer plans, small traditions, little hands helping, and time to see the lights through your child's eyes.

  The magic isn't in doing everything. It's in noticing what's already there. 💛

  How are you celebrating with your little ones today? 👇
hashtags: >-
  #happydiwali #diwali2026 #diwali #festivewithkids #slowparenting #montessori #indianparents
  #indianmoms #familytime #festivalsofindia #letmetry #mindfulparenting
printable:
  title: "Simple Festival Traditions for Little Ones"
  subtitle: "Small rituals that become big memories · All ages"
  intro: >-
    Young children don't need big celebrations. Small, repeated traditions are what they'll remember and look
    forward to year after year.
  sections:
    - heading: "Ideas to choose from"
      items:
        - "Light one diya together (with adult hands on the flame)"
        - "Make a flower rangoli at the door"
        - "Choose one 'special sweet' to make together"
        - "Deliver sweets to a neighbour"
        - "Tell a simple festival story at bedtime"
        - "Take the same family photo in the same spot each year"
        - "Give away one toy to a child who needs it"
    - heading: "Keep it calm"
      items:
        - "One or two visits per day"
        - "Naps and meals near normal times"
        - "A quiet corner at home"
    - heading: "Safety"
      text: "Keep children away from lit diyas and firecrackers, and dress them in cotton near flames."
  sources:
    - label: "A Let Me Try family activity."
