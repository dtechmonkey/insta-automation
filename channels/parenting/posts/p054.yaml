caption: |
  “If you eat your sabzi, you'll get a chocolate.” Easy, effective, and a habit many of us grew up with. 🍫

  But research suggests that using food as a reward or comfort can teach children to turn to food for feelings. In one study, children whose parents used food to manage emotions were more likely to eat when upset later.

  Try instead:
  🎉 Celebrate with time: a song, a story, the park
  🙌 High-fives and hugs
  🍬 Serve sweets sometimes, with no strings attached
  🥦 Never make vegetables the 'price' of dessert

  Do you use food rewards? No judgement, tell us 👇

  (General information, not medical advice.)
