printable:
  title: "Non-Food Rewards and Celebrations"
  subtitle: "Ways to celebrate without sweets · Ages 2–5"
  medical: true
  intro: >-
    Sweets can be a normal part of family life, but using them as rewards or comfort can shape a child's
    relationship with food. Here are other ways to celebrate.
  sections:
    - heading: "What the research found"
      items:
        - "Children whose parents used food to regulate emotions showed more emotional eating later (Farrow, Haycraft & Blissett, 2015)."
        - "Adults who recalled food being used as a reward in childhood reported more binge eating and dieting (Puhl & Schwartz, 2003)."
    - heading: "Celebrate with"
      items:
        - "A special dance or song"
        - "An extra bedtime story"
        - "Choosing the weekend outing"
        - "A sticker on the 'I can' chart"
        - "Calling Nani to tell her"
        - "A high-five and a big hug"
    - heading: "Comfort with"
      items:
        - "A cuddle"
        - "Naming the feeling"
        - "A favourite soft toy"
        - "A walk outside"
    - heading: "Sweets without strings"
      text: "Offer sweets sometimes, after meals, without linking them to behaviour or vegetables."
  sources:
    - label: "Farrow, C. V., Haycraft, E., & Blissett, J. M. (2015). Teaching our children when to eat: How parental feeding practices inform the development of emotional eating. American Journal of Clinical Nutrition, 101(5), 908–913."
    - label: "Puhl, R. M., & Schwartz, M. B. (2003). If you are good you can have a cookie: How memories of childhood food rules link to adult eating behaviors. Eating Behaviors, 4(3), 283–293."
