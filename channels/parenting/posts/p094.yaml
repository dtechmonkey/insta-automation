caption: |
  Writing worksheets every evening. Rhymes to memorise. Projects for parents to do. For 4-year-olds. 📝

  A large review of homework research found little evidence of benefit for young children. Meanwhile, play builds the very skills homework aims for: focus, hand control, maths and language.

  If your child's school sends homework:
  ⏱️ Keep it short
  🎲 Make it playful (letters in sand, counting with spoons)
  😢 Stop if there are tears
  🗣️ Talk kindly with teachers

  Does your preschooler get homework? 👇
hashtags: >-
  #homework #preschool #playbasedlearning #earlychildhood #montessori #indianparents #indianmoms
  #desiparents #academicpressure #letthemplay #letmetry #parentingtips
printable:
  title: "Turning Preschool Homework into Play"
  subtitle: "If school sends it home · Ages 3–5"
  intro: "When homework comes home, these playful swaps cover the same skills without tears."
  sections:
    - heading: "What the research says"
      items:
        - "A synthesis of homework research found little relationship between homework and achievement for younger students (Cooper, Robinson & Patall, 2006)."
        - "The AAP highlights play as essential for young children's development (Yogman et al., 2018)."
    - heading: "Swaps"
      items:
        - "Writing letters → trace letters in sand, flour or on a steamy mirror"
        - "Counting worksheets → count spoons, stairs, rotis"
        - "Colouring pages → free drawing, painting, play dough"
        - "Memorising rhymes → sing them with actions in the bath"
    - heading: "Rules"
      items:
        - "10 minutes maximum"
        - "Stop at the first tears"
        - "Never in place of outdoor play or sleep"
    - heading: "Talking to teachers"
      text: "“She's tired in the evenings. Could we do this through play instead?” Most teachers appreciate a respectful conversation."
  sources:
    - label: "Cooper, H., Robinson, J. C., & Patall, E. A. (2006). Does homework improve academic achievement? A synthesis of research, 1987–2003. Review of Educational Research, 76(1), 1–62."
    - label: "Yogman, M., et al. (2018). The power of play. Pediatrics, 142(3)."
