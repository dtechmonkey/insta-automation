caption: |
  The festival's over, the decorations need to come down, and your toddler wants to help. Let them! 🧺

  Packing up is full of practical-life learning: sorting, wiping, folding, carrying, and finishing what we started. It also teaches that celebrations include taking care of our home afterwards.

  Little jobs:
  🧺 Sorting decorations into baskets
  🧽 Wiping diyas before packing
  📦 Placing soft items in the box
  🌼 Taking old flowers to the compost

  Do your kids help clean up after celebrations? 👇
