printable:
  title: "Clean-Up Jobs for Little Helpers"
  subtitle: "After festivals, parties and every day · Ages 2–4"
  intro: >-
    Children are more likely to help when the job is clear, small and theirs. Pick one or two from the list.
  sections:
    - heading: "After a festival or party"
      items:
        - "Sort decorations into baskets"
        - "Wipe and pack diyas"
        - "Fold cloth decorations"
        - "Collect wrapping paper into a bag"
        - "Take old flowers to the compost"
    - heading: "Every day"
      items:
        - "Toys back in their baskets"
        - "Shoes on the rack"
        - "Plate to the kitchen after meals"
        - "Clothes in the laundry basket"
    - heading: "Make it work"
      items:
        - "One basket or box for each type of item"
        - "Show the job slowly once"
        - "Work alongside them"
        - "Thank them for helping the family"
  sources:
    - label: "Montessori, M. The Discovery of the Child (care of the environment)."
