caption: |
  “She's too stubborn.” “He's too loud.” “She cries too much.” If you have a spirited child, you've heard it all. 💛

  But many of the traits that are exhausting at 3 are strengths for life:

  💪 Stubborn → determined
  📣 Loud → expressive
  💧 Sensitive → empathetic
  👑 Bossy → a leader

  Our job isn't to make them smaller. It's to help them channel who they are.

  Tag the parent of a spirited child 👇
hashtags: >-
