printable:
  title: "Parenting a Spirited Child"
  subtitle: "Reframes and practical tools · Ages 2–5"
  intro: "Spirited, strong-willed children need the same things as all children, just more of them: clear limits, choices and connection."
  sections:
    - heading: "Reframes"
      items:
        - "Stubborn → persistent"
        - "Demanding → knows what they want"
        - "Dramatic → expressive"
        - "Sensitive → perceptive"
        - "Bossy → a natural organiser"
    - heading: "What helps"
      items:
        - "Offer real choices within firm limits"
        - "Explain the 'why' briefly"
        - "Give advance warnings before transitions"
        - "Plenty of physical play every day"
        - "Daily one-on-one time"
    - heading: "For you"
      text: "Spirited children can be exhausting. Take breaks, share the load, and remember: their intensity is not your failure."
  sources:
    - label: "General guidance on child temperament."
