caption: |
  Dal-chawal for the family, pasta for the child, maggi when they refuse… Sound familiar? 🍲

  Feeding experts generally recommend one family meal, with small adjustments, rather than cooking separately for children. Kids learn to like foods by seeing family enjoy them, again and again.

  Try:
  🍽️ Serve the family meal in small portions
  🍚 Include one 'safe' food they usually eat
  🌶️ Adjust: take out their portion before the spice goes in
  👀 Eat together so they can watch and copy

  Agree or disagree? 👇

  (General information, not medical advice.)
