printable:
  title: "One Family Meal, Adjusted for Little Ones"
  subtitle: "Practical tips for Indian kitchens · Ages 1–4"
  medical: true
  intro: "Children who eat the family's food from early on usually accept a wider variety. A few small adjustments make most Indian meals toddler-friendly."
  sections:
    - heading: "What the research says"
      items:
        - "Children's food preferences are shaped by repeated exposure and by watching others eat (Birch & Fisher, 1998)."
    - heading: "Adjust the family meal"
      items:
        - "Take out their portion before adding chilli"
        - "Serve a mild version with curd on the side"
        - "Mash or cut into small pieces"
        - "Serve components separately (rice, dal, sabzi)"
    - heading: "Always include one safe food"
      items:
        - "Roti, rice, curd, idli or a fruit they like"
    - heading: "At the table"
      items:
        - "Eat together, without screens"
        - "Small portions; seconds allowed"
        - "No pressure to taste; just keep offering"
  sources:
    - label: "Birch, L. L., & Fisher, J. O. (1998). Development of eating behaviors among children and adolescents. Pediatrics, 101(3 Pt 2), 539–549."
