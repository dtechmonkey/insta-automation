caption: |
  A Sunday reset is better with a little helper! 🧺

  Getting the home ready for a new week teaches order, responsibility and belonging, and toddlers love being part of it.

  Little jobs:
  🔄 Help rotate the toys
  🧽 Wipe their own play shelf
  🌱 Water the plants
  📅 Choose activities for the week on a picture calendar

  Do it together, slowly, with music on. 🌿

  What's on your family's Sunday list? 👇
hashtags: >-
  #sundayreset #practicallife #montessori #montessoriathome #toyrotation #montessoriindia
  #toddlerhelpers #familyroutine #indianmoms #lifeskills #letmetry #slowliving
printable:
  title: "The Family Sunday Reset"
  subtitle: "A weekly checklist with little-helper jobs · Ages 2–4"
  intro: "A short weekly reset keeps the play space calm and gives children real responsibility."
  sections:
    - heading: "Child's jobs"
      items:
        - "Help choose toys to rotate"
        - "Wipe their play shelf"
        - "Water the plants"
        - "Match socks from the laundry"
        - "Pick a book for the week"
    - heading: "Parent's jobs"
      items:
        - "Swap 2–3 toys on the shelf"
        - "Check clothes still fit"
        - "Prepare the week's picture calendar"
        - "Restock the art basket"
    - heading: "Plan the week together"
      text: "One special activity per day: park, baking, nature walk, visiting Nani, painting."
  sources:
    - label: "Montessori, M. The Discovery of the Child (care of the environment)."
