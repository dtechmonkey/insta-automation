caption: |
  Winter means layers, and layers mean a daily battle… unless they can do it themselves! 🧣

  Winter dressing tricks:
  🧦 Socks: scrunch to the heel, toes in, pull up
  🧥 Sweater: lay it face down, head first, then arms
  🧺 A low basket by the door for caps, socks and mittens
  🎨 Two choices: “Red cap or blue cap?”

  Practise on calm weekends first, not on rushed school mornings. 🌿

  Which winter item is hardest in your house? 👇
