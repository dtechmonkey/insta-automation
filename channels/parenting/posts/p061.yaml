printable:
  title: "Winter Dressing Steps"
  subtitle: "Picture-step cards for cold mornings · Ages 2–4"
  intro: "Stick these steps by the door. Practise on calm days, and leave a few extra minutes on school mornings."
  sections:
    - heading: "Socks"
      items:
        - "Sit on the floor."
        - "Scrunch the sock down to the heel."
        - "Toes in, then pull up."
    - heading: "Sweater"
      items:
        - "Lay it face down."
        - "Head in first."
        - "One arm, then the other. Pull down."
    - heading: "Cap and mittens"
      items:
        - "Cap: hold both sides and pull down over the ears."
        - "Mittens: thumb first."
    - heading: "Set up"
      text: "A low basket by the door, a small stool to sit on, and a mirror at child height."
  sources:
    - label: "Montessori, M. The Discovery of the Child (care of the self)."
