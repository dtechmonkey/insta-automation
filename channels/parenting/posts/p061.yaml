  - kind: tip
    title: "A winter *basket*"
    body: "Caps, socks and mittens in one low basket by the door."
    prompt: >-
      A low woven basket by a front door holding small woollen caps, socks and mittens, a toddler reaching in.
      Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor
      wash, reserved for text.
  - kind: tip
    title: "Let them *choose*"
    body: "Two caps to pick from. Choice = cooperation."
    prompt: >-
      A 2-year-old South Asian boy choosing between a red cap and a blue cap held up by his grandmother. Keep the
