  - kind: tip
    title: "Socks: *scrunch* first"
    body: "Scrunch the sock down to the heel, toes in, then pull up."
    prompt: >-
      A 3-year-old South Asian boy sitting on the floor scrunching a woollen sock before pulling it onto his foot.
