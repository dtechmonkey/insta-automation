printable:
  title: "Warm and Firm: Setting Limits That Stick"
  subtitle: "Limits with reasons · Ages 2–5"
  intro: "Children feel safest with adults who are both warm and firm. A short reason helps them understand and, over time, follow limits on their own."
  sections:
    - heading: "What the research says"
      items:
        - "Baumrind's research identified 'authoritative' parenting (high warmth plus clear limits and explanations) as linked to positive outcomes for children (Baumrind, 1966)."
    - heading: "The formula"
      items:
        - "1. Name the limit: “We hold hands near the road.”"
        - "2. One short reason: “Cars are fast and might not see you.”"
        - "3. Acknowledge the feeling: “You want to run. I know.”"
        - "4. Hold it calmly: no long debate."
    - heading: "Examples"
      items:
        - "“Screens off now, because it's dinner time.”"
        - "“Gentle hands, because hitting hurts.”"
        - "“Car seat on, because it keeps you safe.”"
    - heading: "Remember"
      text: "Firm doesn't mean harsh. Warm doesn't mean giving in."
  sources:
    - label: "Baumrind, D. (1966). Effects of authoritative parental control on child behavior. Child Development, 37(4), 887–907."
