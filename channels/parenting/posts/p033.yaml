printable:
  title: "Festival Season Survival Plan"
  subtitle: "Keeping toddlers calm during busy celebrations · Ages 2–4"
  intro: >-
    Busy festival days are full of noise, guests, sweets and late nights. A little planning keeps little ones
    regulated and the whole family happier.
  sections:
    - heading: "Before the day"
      items:
        - "Talk about what will happen, using simple words or a picture book"
        - "Plan visits around naps and bedtimes"
        - "Pack a calm bag: a favourite toy, snacks, water, ear muffs"
    - heading: "On the day"
      items:
        - "Set up a quiet corner with cushions and books"
        - "Keep meals regular, with sweets after food"
        - "Take short breaks outside or in a quiet room"
        - "Watch for early signs of overload: rubbing eyes, clinginess, irritability"
    - heading: "Noise and safety"
      items:
        - "Keep a good distance from firecrackers"
        - "Try child ear muffs for loud evenings"
        - "Keep diyas and candles out of reach"
    - heading: "After"
      text: "Expect a tired, clingy day after. Keep it slow, with extra sleep and cuddles."
  sources:
    - label: "General paediatric guidance on sleep, routines and noise safety for young children."
