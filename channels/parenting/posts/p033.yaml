slides:
  - kind: cover
    title: "Festival *overwhelm*: protecting toddlers"
    body: "from noise, crowds and late nights"
    prompt: >-
      A busy, colourful festive Indian home with guests and lights, and in a quiet corner a 2-year-old South
      Asian boy resting on his father's lap with his head on his chest. Keep the figures in the lower 60% of the
      frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "Protect *naps*"
    body: "A rested toddler handles a busy day much better. Plan visits around sleep."
    prompt: >-
      A 2-year-old South Asian girl napping peacefully in a quiet, darkened room, festive lights faintly visible
      through a doorway. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft
      peach watercolor wash, reserved for text.
  - kind: tip
    title: "A *quiet* spot"
    body: "A room or corner where they can escape the noise for a while."
    prompt: >-
      A small cosy corner with cushions and books in a festive home, a 3-year-old South Asian boy sitting there
      quietly looking at a picture book. Keep the subject in the lower 60% of the frame. Leave the top 35% as an
      empty, soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "Protect little *ears*"
    body: "Loud crackers can hurt small ears. Keep distance, try ear protection."
    prompt: >-
      A father gently covering his 2-year-old daughter's ears with soft child ear muffs on a balcony, distant
      festive lights in the night sky. Keep the figures in the lower 60% of the frame. Leave the top 35% as an
      empty, soft dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "*Prepare* them"
    body: "“Lots of people will visit. It might be loud. We can take breaks.”"
    prompt: >-
      A mother sitting on a bed talking to her 3-year-old South Asian son, showing him a picture book about a
      festival. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: outro
    title: "Calm kids, *happier* festivals."
    body: "What's the hardest part of festivals with little ones?"
    prompt: >-
      A relaxed South Asian family sitting together by a few glowing diyas, the toddler calm and smiling on her
      mother's lap. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft
      sage-green watercolor wash, reserved for text.
caption: |
  Festivals are magical, and also loud, crowded, late and overwhelming for little ones. 🎆

  A meltdown at a festive gathering usually isn't “bad behaviour”. It's a small nervous system that's had too much.

  What helps:
  😴 Protect naps and bedtimes where you can
  🛋️ Create a quiet corner to escape to
  🎧 Protect little ears from loud crackers
  🗣️ Prepare them for what's coming
  🍎 Keep regular meals between the sweets

  Fewer visits, more calm = happier festivals for everyone. 🌿

  What's the hardest part of festivals with little ones? 👇
hashtags: >-
  #diwali #festiveseason #toddlerlife #gentleparenting #montessori #indianparents #indianmoms
