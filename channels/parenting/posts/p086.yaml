printable:
  title: "Potty Readiness Checklist"
  subtitle: "Is my child ready? · Ages 18 months–3 years"
  medical: true
  intro: "Starting when your child is ready usually makes potty learning faster and calmer. Look for several of these signs together."
  sections:
    - heading: "What the research found"
      items:
        - "Children who started toilet training earlier took longer to complete it, and age of completion was similar (Blum, Taubman & Nemeth, 2003)."
        - "The American Academy of Pediatrics recommends a child-oriented approach based on readiness."
    - heading: "Physical signs"
      items:
        - "Stays dry for about 2 hours"
        - "Regular, predictable poos"
        - "Can walk to the potty and sit down"
        - "Can pull pants up and down (with a little help)"
    - heading: "Communication signs"
      items:
        - "Tells you when they've done a wee or poo"
        - "Uses words like 'wee', 'potty', 'susu'"
        - "Follows simple instructions"
    - heading: "Interest signs"
      items:
        - "Curious about the toilet"
        - "Wants to wear underwear"
        - "Dislikes wet or dirty diapers"
    - heading: "When to check"
      text: "Talk to your paediatrician if there's pain, constipation, or no progress after age 4."
  sources:
    - label: "Blum, N. J., Taubman, B., & Nemeth, N. (2003). Relationship between age at initiation of toilet training and duration of training: A prospective study. Pediatrics, 111(4), 810–814."
    - label: "HealthyChildren.org (AAP): Toilet Training."
      url: "https://www.healthychildren.org/English/ages-stages/toddler/toilet-training/"
