plan: "D18 7:30 PM · Warm"
topic: "Parent life · all ages"
keyword: REALITY
slides:
  - kind: cover
    title: "Festival season with a toddler: *expectation vs reality*"
    body: ""
    prompt: >-
      A humorous split-feeling scene: a South Asian family posing for a festive photo, the parents smiling
      nicely while their 2-year-old wriggles away, face covered in mithai. Warm, funny tone. Keep the figures in
      the lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "Expectation: matching *outfits*"
    body: "Reality: the kurta comes off in 4 minutes."
    prompt: >-
      A 2-year-old South Asian boy running happily through the living room in just his vest, a tiny kurta lying
      on the floor behind him, his mother laughing. Keep the figures in the lower 60% of the frame. Leave the
      top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "Expectation: a calm *puja*"
    body: "Reality: one tiny hand reaching for every diya."
    prompt: >-
      A father gently holding back a curious 2-year-old girl's hand as she reaches towards a row of decorative
      flowers and unlit diyas, both smiling. Keep the figures in the lower 60% of the frame. Leave the top 35%
      as an empty, soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "Expectation: the perfect *photo*"
    body: "Reality: 47 blurry photos and one where they're mid-sneeze."
    prompt: >-
      A mother holding up a phone to take a photo while her toddler turns away, mid-sneeze, festive lights in
      the background. Funny and warm. Keep the figures in the lower 60% of the frame. Leave the top 35% as an
      empty, soft dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "Reality *wins*"
    body: "Because the real memories are the messy, laughing ones."
    prompt: >-
      A South Asian family laughing together on the floor, the toddler covered in petals, festive lights glowing.
      Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash,
      reserved for text.
  - kind: outro
    title: "Messy, loud, *perfect*."
    body: "Tag someone who'll relate 😂"
    prompt: >-
      A sleepy toddler asleep on a pile of cushions after a festive evening, a parent covering them with a soft
      blanket. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green
      watercolor wash, reserved for text.
caption: |
  Festival season with a toddler: expectation vs reality 😂

  👗 Expectation: matching outfits. Reality: the kurta is off in 4 minutes.
  🪔 Expectation: a calm puja. Reality: tiny hands reaching for every diya.
  📸 Expectation: the perfect family photo. Reality: 47 blurry ones.

  But honestly? The messy, laughing moments are the ones we'll remember. 💛

  Tag someone who'll relate 👇
hashtags: >-
  #diwali #festiveseason #toddlerlife #momlife #parentinghumor #indianparents #indianmoms #desimom
  #diwali2026 #expectationvsreality #letmetry #realmotherhood
printable:
  title: "Festival Memory Page"
  subtitle: "Fill it in together · All ages"
  intro: >-
    Print this page and fill it in after the festival. Years from now, these small details will be treasures.
  sections:
    - heading: "This year"
      items:
        - "Your child's age:"
        - "Their favourite sweet:"
        - "What they wore (for how long!):"
        - "The funniest moment:"
        - "Who visited:"
        - "Something new they did this year:"
    - heading: "Ask your child"
      items:
        - "What was your favourite part?"
        - "What made you laugh?"
        - "What should we do again next year?"
    - heading: "Stick here"
      text: "A photo, a petal, or their drawing of the day."
  sources:
    - label: "A Let Me Try family activity."
