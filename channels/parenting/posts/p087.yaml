printable:
  title: "Potty Learning Bathroom Checklist"
  subtitle: "Set up for independence · Ages 18 months–3 years"
  intro: "When everything is within reach, children can manage more by themselves, and they learn faster."
  sections:
    - heading: "In the bathroom"
      items:
        - "A small potty or a toilet seat insert"
        - "A sturdy step stool"
        - "A low basket of spare underwear and shorts"
        - "A small bin or bag for wet clothes"
        - "A step stool at the sink"
        - "A towel on a low hook"
    - heading: "Clothes"
      items:
        - "Elastic-waist shorts or pyjamas"
        - "Lots of cotton underwear"
        - "Avoid buttons, belts and dungarees"
    - heading: "The routine"
      items:
        - "Offer the potty after waking, after meals and before going out"
        - "Show the steps: pants down, sit, wipe, flush, pants up, wash"
        - "Stay calm about accidents: “Let's get dry clothes.”"
  sources:
    - label: "Montessori principles of independence (care of the self)."
