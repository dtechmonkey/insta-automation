caption: |
  In Montessori, potty learning is about independence: setting up the bathroom so your child can do as much as possible themselves. 🚽

  The setup:
  🚽 A small potty, or a seat insert with a sturdy step stool
  🩲 Spare underwear and shorts in a low basket
  👖 Elastic-waist clothes only
  🧼 A step stool at the sink, a towel at their height

  When they can manage their own clothes and wash their own hands, accidents become learning moments, not battles. 🌿

  Potty or toilet seat: which worked for you? 👇
hashtags: >-
