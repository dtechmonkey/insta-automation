printable:
  title: "Recasting: The Gentle Way to Help Speech"
  subtitle: "Examples for everyday talk · Ages 1½–4"
  medical: true
  intro: "Recasting means repeating what your child said, in the correct form, as part of a warm response. No 'say it again', no pressure."
  sections:
    - heading: "What the research says"
      items:
        - "A systematic review found recasting to be an effective technique for supporting children's grammar development (Cleave et al., 2015)."
    - heading: "Examples"
      items:
        - "“Me want milk.” → “You want milk? Here's your milk.”"
        - "“He goed outside.” → “Yes, he went outside!”"
        - "“Tat!” → “A cat! A fluffy cat.”"
        - "“Two foots.” → “Two feet! Let's put socks on your feet.”"
    - heading: "Avoid"
      items:
        - "“No, say it properly.”"
        - "Making them repeat words"
        - "Laughing at mistakes in front of others"
    - heading: "When to check"
      text: "Speak to a paediatrician or speech therapist if your child has very few words at 2, is hard for family to understand at 3, or is losing words."
  sources:
    - label: "Cleave, P. L., Becker, S. D., Curran, M. K., Owen Van Horne, A. J., & Fey, M. E. (2015). The efficacy of recasts in language intervention: A systematic review and meta-analysis. American Journal of Speech-Language Pathology, 24(2), 237–255."
