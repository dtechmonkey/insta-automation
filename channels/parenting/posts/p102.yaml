slides:
  - kind: cover
    title: "Stop correcting every word. *How kids really learn to talk.*"
    body: ""
    prompt: >-
      A 2-year-old South Asian boy excitedly pointing at a dog on a street and talking, while his father listens
      with a warm smile. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft cream
      watercolor wash, reserved for text.
  - kind: tip
    title: "Correcting can *shut them down*"
    body: "“No, say it properly!” makes talking feel risky."
    prompt: >-
      A 2-year-old South Asian girl going quiet and looking down after being corrected, an adult wagging a finger.
      Gentle tone. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: tip
    title: "*Repeat it back* correctly"
    body: "Child: “Doggy runned!” You: “Yes, the doggy ran so fast!”"
    prompt: >-
      A mother crouching beside her 2-year-old son at a park, both watching a dog run, the mother responding
      enthusiastically. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft
      sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "Add a *little* more"
    body: "“Big doggy!” → “Yes, a big brown doggy!”"
    prompt: >-
      A grandfather pointing at a cow on a village lane while his 2-year-old granddaughter shouts excitedly. Keep
      the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash,
      reserved for text.
  - kind: tip
    title: "Respond to the *message*"
    body: "Focus on what they're saying, not how they're saying it."
    prompt: >-
      A father listening closely and nodding as his 3-year-old son tells him a story with big gestures. Keep the
      figures in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved
      for text.
  - kind: outro
    title: "Listen first. *Model* gently."
    body: "What's your toddler's cutest mispronunciation? 😄"
    prompt: >-
      A 2-year-old South Asian girl and her mother laughing together on a sofa, mid-conversation. Keep the figures
      in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor wash, reserved for
      text.
caption: |
  “It's not 'nana', it's BANANA. Say it properly!” We mean well, but constant correcting can make little ones stop trying. 🗣️

  Speech experts use 'recasting': repeating what the child said, correctly and warmly, without pointing out the mistake.

  Try:
  🔁 Repeat it back: “Doggy runned!” → “Yes, the doggy ran!”
  ➕ Add a little: “Big doggy!” → “A big brown doggy!”
  💬 Respond to the message, not the grammar
  😄 Enjoy the cute mistakes; they fade naturally

  What's your toddler's cutest mispronunciation? 👇

  (If you're worried about your child's speech, talk to your paediatrician or a speech therapist.)
