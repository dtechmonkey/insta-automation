  - kind: outro
    title: "Messy now. *Capable* forever."
    body: "Which job will your little one try first?"
    prompt: >-
      A South Asian mother and her 2-year-old son sitting at a low table eating a simple snack they made
      together, the child smiling with pride. Keep the figures in the lower 55% of the frame. Leave the top 40%
