  - kind: tip
    title: "*Stir* the batter"
    body: "A big bowl, a wooden spoon, cold ingredients only."
    prompt: >-
      A 2-year-old South Asian girl stirring cold dosa or cake batter in a large steel bowl with a wooden spoon,
