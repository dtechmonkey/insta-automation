caption: |
  The kitchen is the best Montessori classroom in your home. 🍳

  Toddlers don't want pretend kitchens. They want to help with YOUR cooking. Real jobs build focus, coordination, and the feeling “I'm part of this family.”

  6 safe jobs for a 2-year-old:
  🌿 Tearing coriander leaves
  🍌 Peeling a banana
  🥣 Stirring cold batter
  🥔 Washing and carrying vegetables
  🍅 Washing tomatoes
  🧽 Wiping the table

  Always supervise, and keep them away from the stove, knives and hot pans. A sturdy step stool or learning tower helps a lot.

  Which job will your little one try first? 👇
