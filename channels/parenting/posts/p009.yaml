printable:
  title: "Kitchen Jobs by Age"
  subtitle: "A fridge chart for ages 2–4"
  intro: >-
    Choose one job per day. Show it slowly once, then let them try. Always supervise, and keep the stove,
    knives and hot pans out of reach.
  sections:
    - heading: "Age 2"
      items:
        - "Tear coriander, methi or spinach leaves"
        - "Peel a banana or a boiled egg"
        - "Wash vegetables in a bowl of water"
        - "Stir cold batter"
        - "Carry unbreakable things to the table"
        - "Wipe the table with a damp cloth"
    - heading: "Age 3"
      items:
        - "Spread butter or chutney with a butter knife"
        - "Cut soft foods (banana, boiled potato) with a crinkle cutter"
        - "Measure and pour dry ingredients"
        - "Roll small balls of dough"
        - "Set the table using a placemat outline"
    - heading: "Age 4"
      items:
        - "Grate cheese or carrot (with a grater guard)"
        - "Squeeze lemons"
        - "Roll a small roti"
        - "Wash and dry steel plates"
        - "Make a simple snack: bhel, fruit chaat, sandwiches"
    - heading: "Make it work"
      items:
        - "A sturdy step stool or learning tower at the counter"
        - "Child-sized tools: small bowl, wooden spoon, crinkle cutter"
        - "An apron and a cloth within reach"
        - "Plan extra time. Cooking with toddlers is slow, and that's the point."
  sources:
    - label: "Montessori, M. The Discovery of the Child (practical life)."
