slides:
  - kind: cover
    title: "Tantrums aren't *manipulation*"
    body: "Here's what's really happening"
    prompt: >-
      A 2-year-old South Asian boy having a tantrum on the floor of a living room, while his mother sits calmly
      nearby on the floor at a safe distance. Gentle, empathetic tone. Keep the figures in the lower 60% of the
      frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "Their brakes aren't *built* yet"
    body: "The brain's self-control centre develops slowly through childhood. Feelings win."
    prompt: >-
      A soft, simple watercolor illustration of a toddler's head in profile with a gentle glowing warm area in
      the centre and a faint, still-forming area at the front, abstract and child-friendly, no text. Keep the
      subject in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash,
      reserved for text.
  - kind: tip
    title: "It peaks around *2–3*"
    body: "Tantrums are very common at this age. It's development, not bad parenting."
    prompt: >-
      A 2-year-old South Asian girl stamping her feet next to a dropped ice cream, her father kneeling calmly
      nearby. Gentle humour. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft
      sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "In the moment: *safe* and calm"
    body: "Keep them safe, keep your voice low, say less. Wait it out."
    prompt: >-
      A mother sitting close to her crying 3-year-old South Asian son on a rug, saying nothing, just present,
      soft light. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue
      watercolor wash, reserved for text.
  - kind: tip
    title: "After: *connect*, then teach"
    body: "Hug, name what happened, then talk about what to do next time."
    prompt: >-
      A father and his 3-year-old South Asian daughter hugging on the sofa after a meltdown, both calm, the child
      resting her head on his shoulder. Keep the figures in the lower 60% of the frame. Leave the top 35% as an
      empty, soft peach watercolor wash, reserved for text.
  - kind: outro
    title: "Not giving you a hard time. *Having* one."
    body: "What triggers the most tantrums in your house? 👇"
    prompt: >-
      A calm, smiling 2-year-old South Asian boy playing again with blocks while his mother sips chai nearby,
      peace restored. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft
      sage-green watercolor wash, reserved for text.
caption: |
  “He's just doing it for attention.” “She knows exactly how to manipulate you.” Have you heard this? 😮‍💨

  A toddler's tantrum is not a plan. The part of the brain that controls impulses and calms big feelings develops slowly over many years. At 2–3, feelings simply win.

  What helps:
  🛡️ In the moment: keep them safe, keep calm, say less
  ⏳ Wait. Don't reason mid-storm
  🤗 After: reconnect, name what happened
  🧠 Teach for next time when everyone is calm

  Holding a limit with kindness isn't giving in. It's teaching.

  What triggers the most tantrums in your house? 👇
