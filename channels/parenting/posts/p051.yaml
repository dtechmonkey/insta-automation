slides:
  - kind: cover
    title: "Setting the table: a daily job for a *3-year-old*"
    body: ""
    prompt: >-
      A 3-year-old South Asian boy carefully placing a steel plate on a placemat at a family dining table, cups
      and spoons in a small basket beside him. Keep the child in the lower 60% of the frame. Leave the top 35%
      as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "A *placemat* guide"
    body: "Draw outlines of plate, cup and spoon on a placemat. They match them."
    prompt: >-
      Top-down view of a cloth placemat with simple painted outlines of a plate, a cup and a spoon, and a child's
      hand placing a steel cup on its outline. Keep the subject in the lower 60% of the frame. Leave the top 35%
      as an empty, soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "Everything at their *height*"
    body: "Plates, cups and spoons in a low drawer or basket they can reach."
    prompt: >-
      A low kitchen drawer pulled open showing neatly stacked small steel plates, cups and spoons, a toddler
      reaching in. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green
      watercolor wash, reserved for text.
  - kind: tip
    title: "*Count* the family"
    body: "“How many plates do we need?” Real maths, every day."
    prompt: >-
      A 3-year-old South Asian girl counting on her fingers while looking at family members sitting down at a
      table. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue
      watercolor wash, reserved for text.
  - kind: tip
    title: "Unbreakable *first*"
    body: "Steel works perfectly. Add a glass when they're ready."
    prompt: >-
      A 3-year-old South Asian boy carrying a stack of two steel plates carefully with both hands across a room.
      Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash,
      reserved for text.
  - kind: outro
    title: "Dinner is *served* (by me!)"
    body: "Does your little one have a mealtime job?"
    prompt: >-
      A South Asian family sitting down to dinner at a table set by their proud 3-year-old, who sits in her chair
      beaming. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green
      watercolor wash, reserved for text.
caption: |
  “Can you set the table?” might be the best question you ask your 3-year-old today. 🍽️

  Setting the table builds order, counting, coordination and the proud feeling of contributing to the family.

  How to make it work:
  🗺️ A placemat with drawn outlines of plate, cup and spoon
  🗄️ Plates and cups in a low drawer they can reach
  🔢 “How many plates do we need?” (real maths!)
  🥄 Steel plates first, no fear of breaking

  Does your little one have a mealtime job? 👇
hashtags: >-
  #practicallife #montessori #montessoriathome #toddlerhelpers #chores #montessoriindia #3yearold
