printable:
  title: "DIY Placemat Guide"
  subtitle: "Table-setting template · Ages 3–4"
  intro: >-
    Trace this layout onto a cloth or card placemat. Your child matches each item to its outline, and soon
    sets the table without it.
  sections:
    - heading: "Make the placemat"
      items:
        - "A plain cloth, card or laminated sheet"
        - "Trace around a plate in the centre"
        - "Trace a cup at the top right"
        - "Trace a spoon to the right of the plate"
        - "Optional: a napkin outline on the left"
    - heading: "Teach it"
      items:
        - "Carry one item at a time with two hands"
        - "Place it on its outline"
        - "Count: “one plate for Papa, one for Mumma…”"
    - heading: "Next steps"
      items:
        - "Set the table without the placemat"
        - "Fold napkins"
        - "Clear their plate after the meal"
  sources:
    - label: "Montessori, M. The Discovery of the Child (practical life)."
