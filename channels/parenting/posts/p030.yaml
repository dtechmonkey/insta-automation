printable:
  title: "Body Safety Basics for Little Ones"
  subtitle: "Respectful greetings and early body-safety talk · Ages 2–4"
  intro: >-
    Body-safety education starts with small, everyday moments: naming body parts, respecting 'no', and
    teaching that it's okay to tell a trusted adult anything.
  sections:
    - heading: "Everyday practice"
      items:
        - "Use correct names for body parts."
        - "Let your child choose how to greet: namaste, wave, high-five or hug."
        - "Stop tickling when they say stop."
        - "Ask before helping with bathing or dressing: “Can I help you wash?”"
    - heading: "Simple rules to teach"
      items:
        - "Your body belongs to you."
        - "Private parts are private."
        - "No secrets that make you feel worried."
        - "You can always tell me, and you won't be in trouble."
    - heading: "With relatives"
      items:
        - "Prepare your child before gatherings."
        - "Offer a greeting choice out loud, so relatives hear it too."
        - "Thank relatives for understanding."
    - heading: "Learn more"
      text: "The NSPCC's 'PANTS' rule is a simple, child-friendly way to teach body safety."
  sources:
    - label: "NSPCC: Talk PANTS (body safety guidance for parents)."
      url: "https://www.nspcc.org.uk/keeping-children-safe/support-for-parents/pants-underwear-rule/"
