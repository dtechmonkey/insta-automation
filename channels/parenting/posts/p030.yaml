caption: |
  “Go give Mamaji a hug!” …and your child hides behind your legs. What do you do? 🤗

  Many child-safety organisations recommend letting children decide about hugs and kisses. When children learn early that their body belongs to them, it becomes easier for them to speak up if something ever feels wrong.

  This isn't about disrespecting elders. It's about offering choices:
  🙏 Namaste
  ✋ A high-five
  👋 A wave or a flying kiss

  And a gentle line for relatives: “She's warming up. A high-five today?”

  Agree or disagree? Please be kind in the comments 💛
