caption: |
  Two bowls, one spoon, a handful of chana. One of the oldest exercises in every Montessori classroom. 🥄

  It looks simple, but spooning builds wrist control, concentration and the hand movements children later use to eat neatly and write.

  How to present it:
  🧺 Everything on a tray, left bowl full, right bowl empty
  👀 Show slowly, from left to right, without talking
  🤏 Dropped chana get picked up with fingers
  ➕ Make it harder: smaller grains, smaller spoon, more bowls

  Supervise closely, as small grains can be a choking hazard. 🌿

  Have you tried spooning at home? 👇
