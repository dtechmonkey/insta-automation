printable:
  title: "Spoon Transfer: Step by Step"
  subtitle: "Practical life · Ages 2–3"
  intro: >-
    Spooning is a 'preliminary exercise' in Montessori: it prepares the hand for eating, pouring and later
    writing, and it builds deep concentration.
  sections:
    - heading: "You'll need"
      items:
        - "A small tray"
        - "Two small bowls (steel katoris work well)"
        - "A small spoon"
        - "Chana or rajma to start; moong or rice later"
    - heading: "Presenting it"
      items:
        - "Carry the tray to the table with two hands."
        - "Sit to your child's right."
        - "Slowly scoop from the left bowl, pause, tip into the right bowl."
        - "Repeat until empty, then swap the bowls and offer a turn."
    - heading: "Make it harder over time"
      items:
        - "Smaller grains"
        - "A smaller or deeper spoon"
        - "A third bowl or an ice-cube tray"
        - "Scooping water with a ladle"
    - heading: "Safety"
      text: "Always supervise, and use large beans for children who still put things in their mouths."
  sources:
    - label: "Montessori, M. The Discovery of the Child (practical life exercises)."
