id: p065
plan: "D33 1 PM · Practical"
topic: "Pre-reading · age 3–4"
keyword: SOUNDS
slides:
  - kind: cover
    title: "*“I spy”* with sounds: a pre-reading game"
    body: ""
    prompt: >-
      A mother and a 3-year-old South Asian boy sitting in a living room looking around playfully, the boy
      pointing at a mango on the table with an excited face. Keep the figures in the lower 60% of the frame.
      Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "Sounds, not *letter names*"
    body: "Say “mmm” for mango, not “em”. Sounds are what we read with."
    prompt: >-
      A father making an exaggerated 'mmm' mouth shape while holding a mango, his 3-year-old daughter copying
      him and laughing. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: tip
    title: "*“I spy… something that starts with sss”*"
    body: "Spoon? Sock? Sofa? Start with 3 objects on a tray."
    prompt: >-
      A small tray with three objects: a spoon, a sock and a small toy sun, a 3-year-old South Asian boy picking
      up the spoon. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft
      sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "Play it *anywhere*"
    body: "In the car, at the market, during bath time. No materials needed."
    prompt: >-
      A 3-year-old South Asian girl at a vegetable market pointing at potatoes while her mother smiles, mid-game.
      Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor
      wash, reserved for text.
  - kind: tip
    title: "Then *ending* sounds"
    body: "“I spy something that ends with t… cat!” A harder level."
    prompt: >-
      A 4-year-old South Asian boy pointing at a sleeping cat on a windowsill, grinning at his grandfather. Keep
      the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash,
      reserved for text.
  - kind: outro
    title: "Reading starts with *listening*."
    body: "Play it once today and tell us how it went!"
    prompt: >-
      A happy South Asian family playing a game together on a car journey, the 3-year-old in a car seat pointing
      out of the window. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft
      sage-green watercolor wash, reserved for text.
caption: |
  The first step to reading isn't learning the ABC. It's hearing the sounds inside words. 👂

  Research shows that 'phonological awareness' (hearing and playing with sounds) is one of the strongest early predictors of later reading. And “I spy” is the perfect game for it.

  How to play:
  🔤 Use sounds, not letter names: “mmm” for mango
  🧺 Start with 3 objects on a tray
  🚗 Play anywhere: car, market, bath
  🎯 Level up: ending sounds

  Play it once today and tell us how it went! 👇
hashtags: >-
  #prereading #phonics #earlyliteracy #montessori #montessoriathome #learningthroughplay
  #montessoriindia #3yearold #indianmoms #preschoolactivities #letmetry #languagedevelopment
printable:
  title: "Sound Games for Pre-Readers"
  subtitle: "Phonological awareness through play · Ages 3–5"
  intro: "Hearing sounds in words comes before reading them. These games need no materials and fit into any part of the day."
  sections:
    - heading: "What the research found"
      items:
        - "Phonological awareness in early childhood is one of the strongest predictors of later reading and spelling (National Early Literacy Panel, 2008)."
    - heading: "Game 1: Sound I Spy"
      items:
        - "“I spy something that starts with mmm.”"
        - "Start with 3 objects on a tray, then the whole room."
    - heading: "Game 2: Sound basket"
      items:
        - "Put objects with the same first sound in a basket: spoon, sock, soap."
        - "Add one 'odd one out'. Can they find it?"
    - heading: "Game 3: Rhymes"
      items:
        - "“Cat, hat, bat… what else rhymes?”"
        - "Silly rhymes are allowed!"
    - heading: "Game 4: Clap the parts"
      items:
        - "Clap the syllables: ba-na-na (3 claps)"
        - "Their name, family names, foods"
  sources:
    - label: "National Early Literacy Panel (2008). Developing Early Literacy: Report of the National Early Literacy Panel. National Institute for Literacy."
