printable:
  title: "Preparing Your Child for a New Sibling"
  subtitle: "Before and after the baby arrives · Ages 2–5"
  intro: "A new sibling is a huge change. These steps help the older child feel secure and included."
  sections:
    - heading: "What the research says"
      items:
        - "A review of studies found that changes in behaviour, including regression and clinginess, are common in firstborns after a sibling's birth and usually improve over time (Volling, 2012)."
    - heading: "Before the baby"
      items:
        - "Read books about new babies"
        - "Make big changes (new bed, potty) well before, or wait until after"
        - "Show their own baby photos"
    - heading: "After the baby"
      items:
        - "10 minutes of special time every day"
        - "A gift 'from the baby' to the older child"
        - "Ask visitors to greet the older child first"
        - "Invite (don't force) helping"
    - heading: "Words that help"
      items:
        - "“It's hard when the baby needs me. I'll be with you soon.”"
        - "“You can feel cross with the baby. You can't hit the baby.”"
        - "“There's enough love for both of you.”"
  sources:
    - label: "Volling, B. L. (2012). Family transitions following the birth of a sibling: An empirical review of changes in the firstborn's adjustment. Psychological Bulletin, 138(3), 497–528."
