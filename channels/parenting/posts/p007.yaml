plan: "D4 1 PM · Practical"
topic: "Prepared environment · ages 2–4"
keyword: CORNER
slides:
  - kind: cover
    title: "A Montessori corner in a *small flat*"
    body: "No budget needed"
    prompt: >-
      A small, calm corner of a compact Indian apartment living room with one low wooden shelf holding a few
      toys in baskets, a small rug, a floor cushion and a plant, a 2-year-old South Asian girl choosing a toy.
      Keep the scene in the lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash,
      reserved for text.
  - kind: tip
    title: "One *low* shelf"
    body: "A bookshelf turned on its side works. Everything at their eye level."
    prompt: >-
      A simple wooden bookshelf laid on its side against a wall to make a low shelf, with a few wooden toys and
      baskets on it, a toddler kneeling in front of it. Keep the scene in the lower 60% of the frame. Leave the
      top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "Only *6–8* toys out"
    body: "Fewer toys means longer, deeper play. Store the rest out of sight."
    prompt: >-
      A minimal low shelf with exactly a few toys spaced apart, each on its own: a stacking ring, a wooden
      puzzle, a basket of balls, a small car, a picture book. Calm, airy. Keep the shelf in the lower 60% of
      the frame. Leave the top 35% as an empty, soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "A basket for *each*"
    body: "Every toy has a home. That's what makes tidying possible for a toddler."
    prompt: >-
      Close view of small woven baskets and steel trays on a low shelf, each holding a single set of toys, a
      toddler's hand placing a basket back. Keep the shelf in the lower 60% of the frame. Leave the top 35% as
      an empty, soft dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "*Rotate* every week"
    body: "Swap 2–3 toys each Sunday. Old toys feel new again."
    prompt: >-
      A mother sitting on the floor with a storage box of toys, choosing two toys to swap onto a low shelf,
      her 3-year-old South Asian son watching excitedly. Keep the figures in the lower 60% of the frame. Leave
      the top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "A soft spot to *rest*"
    body: "A floor cushion and a few books facing out. Cosy beats fancy."
    prompt: >-
      A 3-year-old South Asian girl curled up on a big floor cushion reading a picture book, a small front-
      facing book rack beside her on the wall. Keep the child in the lower 60% of the frame. Leave the top 35%
      as an empty, soft cream watercolor wash, reserved for text.
  - kind: outro
    title: "Less stuff. More *focus*."
    body: "Send this to someone setting up a play corner."
    prompt: >-
      A wide view of a tidy, calm Montessori-style corner in a small Indian apartment, a 2-year-old playing
      quietly on the rug and a parent sipping chai nearby. Keep the figures in the lower 55% of the frame.
      Leave the top 40% as an empty, soft sage-green watercolor wash, reserved for text.
caption: |
  You don't need a big house or an expensive shelf for a Montessori space. You need one corner and fewer toys. 🏠

  In one study, toddlers given 4 toys played longer and more creatively with each one than toddlers given 16.

  The setup:
  📚 One low shelf (a bookshelf on its side works!)
  🧸 Only 6–8 toys out at a time
  🧺 One basket or tray per toy
  🔄 Rotate 2–3 toys every week
  🛋️ A cushion and a few books facing out

  Clutter overwhelms little minds. Calm spaces help them focus. 🌿

  Send this to someone setting up a play corner 👇
