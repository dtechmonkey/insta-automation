caption: |
  “Share with your brother!” We've all said it. But forced sharing often backfires. 🧸

  When an adult takes the toy away, one child learns that crying works, and the other learns that grown-ups take things. Neither learns generosity.

  In one study, preschoolers who were given a free choice to share were more generous later than children who had no choice.

  Try turn-taking instead:
  ⏳ “She's using it. You can have it when she's done.”
  🤝 Help the waiting child: “Waiting is hard. Let's build while you wait.”
  💛 Notice real sharing: “You gave him a turn. Look at his smile!”

  Sharing isn't skipped. It's taught, not forced.

  Agree or disagree? This one gets heated 👇
hashtags: >-
  #gentleparenting #montessori #toddlerbehaviour #sharing #siblings #parentingtips #indianparents
