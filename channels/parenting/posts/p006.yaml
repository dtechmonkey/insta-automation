      A 2-year-old South Asian boy crying with his arms out while an adult's hands lift a toy away from another
      toddler, both children looking upset. Soft, muted watercolor, gentle tone. Keep the figures in the lower
      60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "Teach *turns* instead"
    body: "“Riya is using it. You can have it when she's done.”"
    prompt: >-
      A mother kneeling between two South Asian toddlers on a rug, gently speaking to the waiting child, who
      holds her hand, while the other child keeps playing with a wooden train. Keep the figures in the lower 60%
