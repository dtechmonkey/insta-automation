id: p025
plan: "D13 1 PM · Practical (festive)"
topic: "Practical life · ages 2–4"
keyword: DIWALI
slides:
  - kind: cover
    title: "Let them help with *Diwali* cleaning"
    body: "6 jobs for little hands"
    prompt: >-
      A bright Indian home being cleaned for the festival, a 3-year-old South Asian girl dusting a low shelf with
      a small cloth while her mother wipes a window, both smiling, marigold strings in the background. Keep the
      figures in the lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved
      for text.
  - kind: tip
    title: "*Dust* low shelves"
    body: "A small cloth or a soft brush. Give them 'their' shelf."
    prompt: >-
      A 2-year-old South Asian boy dusting a low wooden shelf with a small soft cloth, concentrating. Keep the
      child in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved
      for text.
  - kind: tip
    title: "*Polish* the diyas"
    body: "Clean clay diyas with a dry cloth. Unbreakable ones for little ones."
    prompt: >-
      A 3-year-old South Asian girl sitting on a mat cleaning small clay diyas with a dry cloth, a row of clean
      diyas lined up beside her. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty,
      soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "*Sort* and give away"
    body: "Choose old toys to give to other children. Generosity in action."
    prompt: >-
      A 3-year-old South Asian boy placing a toy into a box marked with a heart drawing, his father helping sort
      a pile of old toys on the floor. Keep the figures in the lower 60% of the frame. Leave the top 35% as an
      empty, soft dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "*Wipe* the doors"
    body: "A spray bottle of water and a cloth. Toddlers love spray bottles!"
    prompt: >-
      A 2-year-old South Asian girl spraying water from a small spray bottle onto a low cupboard door and wiping
      it with a cloth, giggling. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty,
      soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "*Hang* the toran"
    body: "Hand you the flowers, decide where they go. They're part of the celebration."
    prompt: >-
      A father lifting his 3-year-old South Asian son up to help hang a marigold toran over a doorway, the child
      reaching up proudly. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft
      cream watercolor wash, reserved for text.
  - kind: outro
    title: "A home they helped *shine*."
    body: "Which job will your child get this year?"
    prompt: >-
      A sparkling clean, festively decorated Indian living room with diyas and marigolds, a proud toddler
      standing in the middle with arms spread wide. Keep the subject in the lower 55% of the frame. Leave the
      top 40% as an empty, soft sage-green watercolor wash, reserved for text.
caption: |
  Festival cleaning is coming! Instead of keeping the little ones out of the way, give them real jobs. ✨

  Toddlers love meaningful work, and helping prepare the home makes them feel part of the celebration.

  6 jobs for little hands:
  🧹 Dusting low shelves
  🪔 Polishing clay diyas
  📦 Sorting toys to give away
  💦 Wiping doors with a spray bottle
  🌼 Helping hang the toran
  🧺 Matching and folding napkins

  It won't be perfect. It doesn't need to be. 🌿

  Which job will your child get this year? 👇
hashtags: >-
  #diwali #diwalicleaning #montessori #montessoriathome #practicallife #festivewithkids #montessoriindia
  #toddleractivities #indianmoms #diwali2026 #letmetry #lifeskills
printable:
  title: "Festival Cleaning Jobs by Age"
  subtitle: "A checklist for little helpers · Ages 2–4"
  intro: >-
    Real jobs make children feel capable and included. Pick 2–3 for your child, show each slowly once, and
    let their work be 'good enough'.
  sections:
    - heading: "Age 2"
      items:
        - "Dust low shelves with a small cloth"
        - "Wipe doors with a water spray bottle"
        - "Carry cushions to the sofa"
        - "Put toys back in baskets"
    - heading: "Age 3"
      items:
        - "Polish clay or brass diyas with a dry cloth"
        - "Sort toys to give away"
        - "Match and fold napkins"
        - "Water the plants"
    - heading: "Age 4"
      items:
        - "Sweep with a small broom and dustpan"
        - "Wipe the dining chairs"
        - "Arrange flowers in a small vase"
        - "Help hang the toran or lights (with you, never alone)"
    - heading: "Child-sized tools"
      items:
        - "Small cloths in a basket"
        - "A small spray bottle of plain water"
        - "A child-sized broom and dustpan"
        - "An apron"
    - heading: "Safety"
      text: >-
        Keep cleaning chemicals, ladders, electrical lights and glass items with adults only. Children use
        plain water and dry cloths.
  sources:
    - label: "Montessori, M. The Discovery of the Child (practical life: care of the environment)."
