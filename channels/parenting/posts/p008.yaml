caption: |
  “Say sorry. NOW.” …“Sorryyy.” Sound familiar? 😅

  Forced apologies teach kids that “sorry” is the magic word that ends trouble, not a feeling of regret. Research on how children see apologies suggests they understand the feelings behind them better when the apology comes from real understanding.

  Try repair instead:
  🌬️ Wait for calm first
  👀 Point to the feeling: “Look at her face. She's sad.”
  🤲 Ask: “How can we help her feel better?”
  🗣️ Model it yourself: “I'm sorry I shouted. I was frustrated.”

  When they understand, the sorry comes on its own, and it means something. 💛

  Do you make your kids say sorry? Tell us honestly 👇
