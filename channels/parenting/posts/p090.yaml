caption: |
  “Don't take him out, he'll catch a cold!” Every Indian winter, we hear it. 🧣

  ❌ Myth: cold weather causes colds
  ✅ Fact: colds are caused by viruses, which spread from person to person

  We get more colds in winter mostly because we spend more time indoors, close together.

  What helps:
  🧼 Handwashing
  💪 Covering coughs and sneezes
  😴 Good sleep
  🌳 Outdoor play, dressed warmly
  🏠 Staying home when sick

  Did your family believe this too? 👇

  (General information, not medical advice. See a doctor if your child has a high fever, trouble breathing or seems very unwell.)
hashtags: >-
  #mythbusting #parentingmyths #wintercare #commoncold #montessori #indianparents #indianmoms
