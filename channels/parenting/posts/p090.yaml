printable:
  title: "Winter Health: Myths and Facts"
  subtitle: "What really keeps little ones well · Ages 1–5"
  medical: true
  intro: "Many winter beliefs are passed down with love. Here's what the science says, and what actually helps."
  sections:
    - heading: "Myths and facts"
      items:
        - "Myth: Cold air causes colds. Fact: Colds are caused by viruses (CDC)."
        - "Myth: Wet hair gives you a cold. Fact: You can only catch a cold from a virus."
        - "Myth: Kids should stay indoors all winter. Fact: Outdoor play is healthy year-round when dressed warmly."
    - heading: "What helps prevent colds"
      items:
        - "Handwashing with soap, especially before eating"
        - "Covering coughs and sneezes with an elbow"
        - "Enough sleep"
        - "Keeping sick children home"
    - heading: "Dress for the weather"
      items:
        - "Layers they can take off when warm"
        - "A cap and socks on very cold days"
        - "Avoid overheating: sweaty under too many layers is uncomfortable too"
    - heading: "See a doctor if"
      text: "Your child has a high fever, trouble breathing, unusual drowsiness, or isn't drinking."
  sources:
    - label: "CDC: About Common Cold."
      url: "https://www.cdc.gov/common-cold/about/"
