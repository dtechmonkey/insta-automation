id: p098
plan: "D49 7:30 PM · Practical"
topic: "Prepared environment · ages 2–4"
keyword: ROTATE
slides:
  - kind: cover
    title: "Toy rotation in *15 minutes*"
    body: ""
    prompt: >-
      A mother sitting on a rug sorting toys into a low shelf and a storage box, her 2-year-old son happily
      exploring a 'new' toy she just brought out. Keep the figures in the lower 60% of the frame. Leave the top
      35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "1. *Gather* everything"
    body: "All the toys in one place. Yes, all of them."
    prompt: >-
      A big pile of assorted toys on a living room floor, a parent looking at it with a determined smile. Gentle
      humour. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: tip
    title: "2. *Sort* into groups"
    body: "Puzzles, building, pretend, art, books, movement."
    prompt: >-
      Toys sorted into neat groups on the floor: blocks, puzzles, a toy kitchen set, books, balls. Keep the
      subject in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green watercolor wash,
      reserved for text.
  - kind: tip
    title: "3. Pick *one* from each"
    body: "6–8 toys on the shelf. The rest go into boxes, out of sight."
    prompt: >-
      A tidy low shelf with just a few toys, and labelled storage boxes stacked in a cupboard behind. Keep the
      subject in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash,
      reserved for text.
  - kind: tip
    title: "4. *Swap* weekly"
    body: "Notice what's ignored. Swap 2–3 toys every Sunday."
    prompt: >-
      A 3-year-old South Asian girl gasping with delight at a toy that just came back from storage. Keep the child
      in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved for
      text.
  - kind: outro
    title: "Old toys, *new* excitement."
    body: "Do you rotate toys? How often?"
    prompt: >-
      A calm play corner with a toddler absorbed in a wooden puzzle, a tidy shelf behind him. Keep the figures in
      the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor wash, reserved for
      text.
caption: |
  Too many toys, and your child still says “I'm bored”? Try toy rotation. It takes 15 minutes. 🔄

  1️⃣ Gather all the toys in one place
  2️⃣ Sort into groups: puzzles, building, pretend, art, books, movement
  3️⃣ Pick one from each group (6–8 toys on the shelf)
  4️⃣ Box the rest out of sight and swap 2–3 every week

  Old toys feel new again, play gets deeper, and tidying gets easier. 🌿

  Do you rotate toys? How often? 👇
hashtags: >-
  #toyrotation #montessori #montessoriathome #playroom #minimalistparenting #montessorishelf
  #montessoriindia #toddlerroom #indianmoms #declutter #letmetry #preparedenvironment
printable:
  title: "Toy Rotation Planner"
  subtitle: "Fewer toys, deeper play · Ages 1–4"
  intro: "Use this planner to sort toys and plan weekly swaps. Keep 6–8 toys out, one from each category."
  sections:
    - heading: "Categories"
      items:
        - "Fine motor: puzzles, threading, shape sorters"
        - "Building: blocks, stacking cups"
        - "Pretend: kitchen set, dolls, animals"
        - "Art: crayons, play dough"
        - "Books: 3–5 facing out"
        - "Movement: balls, push toys"
    - heading: "This week's shelf"
      items:
        - "1. ________"
        - "2. ________"
        - "3. ________"
        - "4. ________"
        - "5. ________"
        - "6. ________"
    - heading: "Swap tips"
      items:
        - "Swap toys they ignore"
        - "Keep favourites out until interest fades"
        - "Store the rest in labelled boxes out of sight"
    - heading: "What the research found"
      text: "Toddlers with fewer toys played longer and more creatively (Dauch et al., 2018)."
  sources:
    - label: "Dauch, C., et al. (2018). The influence of the number of toys in the environment on toddlers' play. Infant Behavior and Development, 50, 78–87."
