printable:
  title: "Festive Process Art for Toddlers"
  subtitle: "Diya painting and more · Ages 2–4"
  intro: >-
    Process art focuses on exploring, not on a finished product. It builds creativity, fine-motor skills and
    confidence. Every result is 'right'.
  sections:
    - heading: "Diya painting setup"
      items:
        - "Plain clay diyas"
        - "Washable poster paints in 3–4 colours"
        - "Chunky brushes, cotton buds, fingertips"
        - "Newspaper, an apron and a wet cloth"
    - heading: "More festive process art"
      items:
        - "Finger-print toran on a strip of paper"
        - "Stick paper shapes on a cardboard lantern"
        - "Leaf and petal printing with paint"
        - "Torn-paper collage cards for family"
    - heading: "What to say"
      items:
        - "“Tell me about your colours.”"
        - "“You made so many dots!”"
        - "Avoid fixing or redoing their work."
    - heading: "Safety"
      text: "Use non-toxic paints, let diyas dry fully, and keep children away from lit flames and firecrackers."
  sources:
    - label: "General early-childhood guidance on process-focused art."
