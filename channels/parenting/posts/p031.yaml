plan: "D16 1 PM · Practical (festive)"
topic: "Art · age 3–4"
keyword: DIYA
slides:
  - kind: cover
    title: "Diya painting: festive art for *little hands*"
    body: ""
    prompt: >-
      A 3-year-old South Asian girl painting a plain clay diya with bright colours using a thick brush, sitting
      on a newspaper-covered floor, small paint pots beside her. Keep the child in the lower 60% of the frame.
      Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "The *process*, not the result"
    body: "Let them choose colours and paint freely. No 'correct' way."
    prompt: >-
      Close view of small hands dabbing bright pink and yellow paint onto a clay diya with a chunky brush. Keep
      the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash,
      reserved for text.
  - kind: tip
    title: "Set up for *mess*"
    body: "Old newspaper, an apron, washable paint, a wet cloth nearby."
    prompt: >-
      A simple painting setup on the floor: newspaper, a few clay diyas, small cups of paint, brushes and a wet
      cloth, a small apron hanging nearby. Keep the subject in the lower 60% of the frame. Leave the top 35% as
      an empty, soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "Add *dots* and stamps"
    body: "Cotton buds for dots, fingertips for prints. Great for fine motor skills."
    prompt: >-
      A 3-year-old South Asian boy using a cotton bud to make colourful dots on a painted diya, concentrating
      hard. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue
      watercolor wash, reserved for text.
  - kind: tip
    title: "*Display* their work"
    body: "Put their diyas in the place of honour. Pride lights up brighter."
    prompt: >-
      A row of colourful, imperfectly painted diyas glowing on a windowsill at dusk, a toddler pointing at them
      proudly. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: outro
    title: "Imperfect diyas, *perfect* memories."
    body: "Will you paint diyas together this year?"
    prompt: >-
      A South Asian mother and her 3-year-old daughter side by side painting diyas, both with paint on their
      fingers, laughing. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft
      sage-green watercolor wash, reserved for text.
caption: |
  The best diyas this festive season will be the wonky, colourful ones painted by tiny hands. 🪔

  For toddlers, art is about the process: choosing colours, moving the brush, making dots. Not about a perfect result.

  Easy setup:
  📰 Newspaper on the floor
  🎨 Washable paints and a chunky brush
  🔵 Cotton buds for dots
  🧽 A wet cloth nearby

  Then display their diyas proudly. 🌿 Never light a diya they've painted until the paint is completely dry, and keep flames away from little ones.

  Will you paint diyas together this year? 👇
