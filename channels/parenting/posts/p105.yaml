id: p105
plan: "D53 1 PM · Practical"
topic: "Grace and courtesy · age 2–3"
keyword: MANNERS
slides:
  - kind: cover
    title: "Teaching *please and thank you* by modelling, not prompting"
    body: ""
    prompt: >-
      A father handing a cup of water to his 2-year-old daughter and saying thank you to her as she hands him a
      napkin, both smiling at a dining table. Keep the figures in the lower 60% of the frame. Leave the top 35% as
      an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "*“Say thank you!”* rarely works"
    body: "Prompting in front of others often makes children freeze or refuse."
    prompt: >-
      A shy 2-year-old South Asian boy hiding his face in his mother's shoulder while an aunty holds out a gift and
      waits. Gentle tone. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft
      peach watercolor wash, reserved for text.
  - kind: tip
    title: "*Use* the words with them"
    body: "“Please pass the roti.” “Thank you for helping.” They copy what they hear."
    prompt: >-
      A mother saying please to her 3-year-old son as he passes her a bowl at the table, both relaxed. Keep the
      figures in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green watercolor wash,
      reserved for text.
  - kind: tip
    title: "*Role-play* it"
    body: "Play shop with toys: “Can I have a mango, please?” Practise when calm."
    prompt: >-
      A 3-year-old South Asian girl playing 'shop' with toy fruits, her grandmother pretending to buy a mango.
      Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor
      wash, reserved for text.
  - kind: tip
    title: "*Say it for them*"
    body: "If they freeze: “Thank you, Mamaji, she loves it!” Modelling still counts."
    prompt: >-
      A mother smiling and thanking a relative for a gift while her shy toddler holds the gift and peeks out from
      behind her leg. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: outro
    title: "Manners are *caught*, not taught."
    body: "Does your toddler say thank you yet?"
    prompt: >-
      A 2-year-old South Asian boy spontaneously saying thank you with a namaste to his grandfather who gave him a
      banana. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green
      watercolor wash, reserved for text.
caption: |
  “Say thank you to Aunty! Say it! …Why won't you say it?!” 😬 We've all been there.

  In Montessori, manners are part of 'grace and courtesy', and they're taught mainly through modelling, not prompting.

  Try:
  🗣️ Use please and thank you WITH your child, all day
  🎭 Role-play shop or tea party when calm
  🛡️ If they freeze, say it for them: “Thank you, she loves it!”
  ⏳ Be patient. It comes on its own

  Does your toddler say thank you yet? 👇
