printable:
  title: "Grace and Courtesy Role-Plays"
  subtitle: "Practising manners through play · Ages 2–4"
  intro: "Montessori teaches manners through calm practice and adult example. Try one role-play a week, when everyone is in a good mood."
  sections:
    - heading: "Role-plays"
      items:
        - "Shop: “Can I have a mango, please?” “Here you are.” “Thank you!”"
        - "Tea party: offering and accepting"
        - "Doorbell: greeting a visitor with namaste or hello"
        - "Interrupting: placing a hand on your arm and waiting"
        - "Sneezing: covering with an elbow"
    - heading: "Everyday modelling"
      items:
        - "Say please and thank you to your child"
        - "Greet family members warmly"
        - "Apologise when you make a mistake"
    - heading: "Avoid"
      text: "Forcing words in front of others. If your child freezes, say it for them and move on."
  sources:
    - label: "Montessori, M. The Discovery of the Child (grace and courtesy lessons)."
