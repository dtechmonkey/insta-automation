printable:
  title: "Real School Readiness Checklist"
  subtitle: "What actually matters before school · Ages 3–5"
  intro: >-
    School readiness isn't about reading or writing early. It's about independence, communication, curiosity
    and getting along with others.
  sections:
    - heading: "What the research says"
      items:
        - "The American Academy of Pediatrics describes play as essential for developing executive function, language and social skills (Yogman et al., 2018)."
        - "Developmental scientists warn that early drilling can crowd out the play that builds real learning (Hirsh-Pasek, Golinkoff & Eyer, 2003)."
    - heading: "Independence"
      items:
        - "Uses the toilet with little help"
        - "Eats and drinks without help"
        - "Puts on shoes and a jacket"
    - heading: "Communication"
      items:
        - "Says what they need"
        - "Follows two-step instructions"
        - "Listens to a short story"
    - heading: "Social and emotional"
      items:
        - "Takes turns"
        - "Separates from parents with some comfort"
        - "Calms down with help"
    - heading: "Curiosity"
      items:
        - "Asks questions"
        - "Plays pretend"
        - "Sticks with a task for a few minutes"
  sources:
    - label: "Yogman, M., Garner, A., Hutchinson, J., et al. (2018). The power of play: A pediatric role in enhancing development in young children. Pediatrics, 142(3)."
    - label: "Hirsh-Pasek, K., Golinkoff, R. M., & Eyer, D. (2003). Einstein Never Used Flash Cards. Rodale."
