caption: |
  Tuition at 3. Handwriting classes at 3½. “Phonics crash course” before nursery. The pressure starts early in India. 📚

  But the American Academy of Pediatrics calls play essential for brain development, focus, problem-solving and social skills. Early academic drilling doesn't give a lasting advantage.

  What really prepares a 3-year-old:
  🗣️ Lots of conversation
  📖 Reading together every day
  🧦 Independence: dressing, eating, tidying
  🤝 Playing with other children
  🌳 Free time outdoors

  Agree or disagree? This one divides people 👇
hashtags: >-
