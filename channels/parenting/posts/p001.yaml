caption: |
  Your toddler's favourite words are "Let me try!" 🙋‍♀️ Here's how to say yes more often.

  At two, children badly want to do real things by themselves. When we step in to save time, they learn "I can't." When we step back, they learn "I can."

  Start with one of these this week:
  👟 Chappals: velcro or slip-on, sitting on the floor
  💧 Pouring: a small steel jug and tumbler
  🍅 Washing vegetables: a bowl of water does the rest
  🧺 Tidying: a low shelf, few toys, one basket each
  🧽 Spills: a small cloth always within reach

  Yes, it's slower and messier at first. That's the learning. 🌿

  Which one will you try first? Tell us in the comments 👇
  Save this for later, and share it with someone raising a little one.

