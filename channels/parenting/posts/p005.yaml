printable:
  title: "Dal Sorting: 5 Levels of Focus"
  subtitle: "Sensorial and fine-motor work · Ages 3–4"
  intro: >-
    A ₹0 activity from your kitchen. Each level makes the work a little harder. Stay at a level until your
    child finishes it calmly, then move on.
  sections:
    - heading: "Safety first"
      text: >-
        Always supervise. Skip this activity if your child still puts small objects in their mouth, and start
        with large beans like rajma and chana.
    - heading: "The 5 levels"
      items:
        - "Level 1: Two large beans (rajma + chana), sorted by hand into two katoris."
        - "Level 2: Same beans, moved with a small spoon."
        - "Level 3: Small wooden tongs or a clothes peg."
        - "Level 4: Three or four dals, sorted into a muffin tray."
        - "Level 5: Small grains (moong, masoor) with tweezers, for older 4-year-olds."
    - heading: "How to present it"
      items:
        - "Put everything on a tray, so the work has a clear 'home'."
        - "Show slowly once: pick, look, drop. No talking."
        - "Let them repeat as many times as they like."
        - "At the end, show how to pour everything back for next time."
    - heading: "Talk while they work (later, not during)"
      items:
        - "Name the dals: rajma, chana, moong, masoor."
        - "Compare: big and small, smooth and wrinkly, dark and light."
        - "Count a few: 'Let's count 5 rajma.'"
    - heading: "Extend it"
      items:
        - "Help wash and soak the dal for dinner."
        - "Make a dal collage on cardboard with glue."
        - "Fill and seal small bottles as shakers to compare sounds."
  sources:
    - label: "Montessori, M. The Montessori Method (sensorial education)."
    - label: "Lillard, A. S. (2017). Montessori: The Science Behind the Genius. Oxford University Press."
