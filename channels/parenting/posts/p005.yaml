slides:
  - kind: cover
    title: "Sorting dals: the *₹0* activity"
    body: "that builds focus like nothing else"
    prompt: >-
      A 3-year-old South Asian boy sitting cross-legged on a mat, sorting a mix of colourful lentils (yellow
      moong, orange masoor, black urad, red rajma) into small steel katoris, totally absorbed. Keep the child
      in the lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for
      text.
  - kind: tip
    title: "Start with *two*"
    body: "Mix rajma and chana in a bowl. Two katoris. Sort by hand."
    prompt: >-
      Top-down view of a wooden tray with a bowl of mixed red rajma and pale chana and two empty small steel
      katoris, a small child's hand picking a bean. Keep the tray in the lower 60% of the frame. Leave the top
      35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "Add a *spoon*"
    body: "Spooning beans builds the grip they'll later use for a pencil."
    prompt: >-
      A 3-year-old South Asian girl carefully spooning chana from a bowl into a katori with a small steel
      spoon, her tongue peeking out in concentration. Keep the child in the lower 60% of the frame. Leave the
      top 35% as an empty, soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "Then *tongs*"
    body: "Small kitchen tongs or a clothes peg make it harder, and more fun."
    prompt: >-
      A 3-year-old South Asian boy using small wooden tongs to pick up a single rajma bean and drop it into a
      katori, with a little bowl of mixed dals beside him. Keep the child in the lower 60% of the frame. Leave
      the top 35% as an empty, soft dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "Make it *harder*"
    body: "Four dals, smaller grains, a muffin tray with many cups."
    prompt: >-
      A 4-year-old South Asian girl sorting four kinds of small lentils into the cups of a muffin tray with her
      fingers, her grandmother sitting nearby cleaning rice in a thali. Keep the figures in the lower 60% of the
      frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: outro
    title: "Your kitchen is a *classroom*."
    body: "Which dal will you start with?"
    prompt: >-
      A cosy Indian kitchen corner with a low stool and a tray of neatly sorted lentils in katoris, a proud
      3-year-old South Asian boy showing his finished work to his mother. Keep the figures in the lower 55% of
      the frame. Leave the top 40% as an empty, soft sage-green watercolor wash, reserved for text.
caption: |
  No toys to buy. No screens. Just a handful of dals from your kitchen. 🫘

  Sorting looks simple, but it builds concentration, hand control, colour and size discrimination, and the pincer grip they'll need for writing.

  Make it harder step by step:
  ✋ Two dals, by hand
  🥄 With a spoon
  🥢 With small tongs or a peg
  🧁 Four dals in a muffin tray

  Sit nearby, but don't help. Let them get absorbed. That focus is the magic. 🌿

  Supervise closely: small grains are a choking risk for children who still put things in their mouths.

  Which dal will you start with? 👇
