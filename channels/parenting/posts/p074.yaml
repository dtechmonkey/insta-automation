printable:
  title: "A Family Screen-Time Plan"
  subtitle: "Healthy habits for ages 2–5"
  medical: true
  intro: "Screens are part of modern life. A simple family plan helps keep them in their place."
  sections:
    - heading: "What the guidance says"
      items:
        - "WHO: for ages 2–4, sedentary screen time no more than 1 hour a day; less is better. No screen time under 2."
        - "AAP: choose high-quality content and watch with your child to help them understand it."
    - heading: "Our family rules"
      items:
        - "Screens are for: ________"
        - "Our daily limit: ____ minutes"
        - "No screens at meals"
        - "No screens in the hour before bed"
        - "No screens in bedrooms"
    - heading: "Choose content that is"
      items:
        - "Slow-paced and calm"
        - "Without ads or autoplay"
        - "Something you can talk about together"
    - heading: "Instead of a screen, try"
      items:
        - "A book, play dough, a water tray, a walk, a helper job"
  sources:
    - label: "World Health Organization (2019). Guidelines on physical activity, sedentary behaviour and sleep for children under 5 years of age."
    - label: "AAP Council on Communications and Media (2016). Media and Young Minds. Pediatrics, 138(5)."
