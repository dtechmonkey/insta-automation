printable:
  title: "Dough Play: Hand-Strength Activities"
  subtitle: "Practical life and pre-writing · Ages 3–4"
  intro: >-
    Hand strength and finger control come before neat writing. Dough is the perfect, ₹0 way to build them.
    Use real atta dough or homemade play dough.
  sections:
    - heading: "Easy play dough recipe"
      items:
        - "1 cup atta or maida, ½ cup salt, 1 tbsp oil"
        - "Add about ½ cup water slowly, knead until soft"
        - "Optional: a drop of food colour or haldi"
        - "Stores for a week in a closed box"
    - heading: "10 dough activities"
      items:
        - "Squeeze, squash and poke"
        - "Roll small balls between both palms"
        - "Roll long snakes on the table"
        - "Flatten with a small belan"
        - "Cut with a cookie cutter or steel katori"
        - "Press in buttons, beans or leaves"
        - "Pinch small pieces off"
        - "Make letters with dough snakes"
        - "Count balls into a bowl"
        - "Make real roti or puri with you"
    - heading: "Safety"
      items:
        - "Keep children away from the stove and tawa."
        - "Supervise small objects pressed into dough."
    - heading: "Signs of growing hand strength"
      text: >-
        Rolling smoother balls, pinching smaller pieces, holding the belan with both hands evenly, and
        lasting longer before getting tired.
  sources:
    - label: "Montessori, M. The Discovery of the Child (practical life and the hand)."
