id: p015
plan: "D8 1 PM · Practical"
topic: "Practical life · age 3–4"
keyword: ROTI
slides:
  - kind: cover
    title: "Rolling roti dough: the best *fine-motor* activity"
    body: "and it's already in your kitchen"
    prompt: >-
      A 3-year-old South Asian girl at a low table rolling a small ball of roti dough flat with a small wooden
      belan, flour on her hands, her grandmother rolling a roti beside her. Warm kitchen light. Keep the figures
      in the lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for
      text.
  - kind: tip
    title: "Squeeze and *knead*"
    body: "Give them a small piece of dough to squash, poke and knead. Strong hands write better."
    prompt: >-
      Close view of a toddler's small hands squeezing and kneading a soft ball of dough on a wooden board, flour
      dusted around. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: tip
    title: "Roll little *balls*"
    body: "Between both palms. Make 5 small peras for the family."
    prompt: >-
      A 3-year-old South Asian boy rolling small balls of dough between his palms, a few finished dough balls
      lined up on a steel plate. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty,
      soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "A small *belan*"
    body: "A child-sized rolling pin. Wonky shapes are perfect."
    prompt: >-
      A 4-year-old South Asian girl pressing down with a small rolling pin on a little flat circle of dough,
      laughing at its funny shape. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty,
      soft dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "*Eat* what they made"
    body: "You cook it, they serve it. Pride on a plate."
    prompt: >-
      A happy South Asian family at a dining table, the 3-year-old proudly serving a slightly odd-shaped roti
      onto her father's plate. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty,
      soft peach watercolor wash, reserved for text.
  - kind: outro
    title: "Wonky roti, *happy* child."
    body: "Does your little one help in the kitchen?"
    prompt: >-
      A 3-year-old South Asian boy with flour on his nose grinning while holding up a small rolled roti, warm
      kitchen in the background. Keep the child in the lower 55% of the frame. Leave the top 40% as an empty,
      soft sage-green watercolor wash, reserved for text.
caption: |
  Before a child can hold a pencil well, they need strong little hands. And roti dough is the best hand workout there is. 🫓

  Squeezing, poking, rolling balls and using a small belan build hand strength, coordination and focus, while your child feels like a real helper.

  Try it in 4 steps:
  ✊ Squeeze and knead a small piece
  ⚪ Roll little peras between their palms
  🪵 Roll it flat with a child-sized belan
  🍽️ You cook it, they serve it

  Keep them well away from the tawa and stove. 🌿

  Does your little one help in the kitchen? 👇
hashtags: >-
  #montessori #montessoriathome #finemotorskills #practicallife #cookingwithkids #montessoriindia
