    title: "You'll read the same book *47* times"
    body: "And they'll still notice if you skip a page."
    prompt: >-
      A father lying on a bed reading a worn picture book to his 2-year-old South Asian son, who points at the
      page with excitement. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft
      peach watercolor wash, reserved for text.
  - kind: tip
    title: "The wrong-coloured cup is a *tragedy*"
    body: "Big feelings over small things are normal. They're learning."
    prompt: >-
      A 2-year-old South Asian girl in a high chair dramatically pushing away a blue cup with a pout while her
      mother holds up a red cup with an amused smile. Keep the figures in the lower 60% of the frame. Leave the
      top 35% as an empty, soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "You'll never go to the bathroom *alone*"
    body: "Your tiny shadow wants to be wherever you are."
    prompt: >-
      A toddler's small feet visible under a closed bathroom door from the hallway side, with a toy duck beside
      them. Humorous, warm, simple. Keep the subject in the lower 60% of the frame. Leave the top 35% as an
      empty, soft dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "*“Why?”* will be asked 100 times a day"
    body: "Every why is a brain wiring itself. Answer what you can."
    prompt: >-
      A curious 3-year-old South Asian boy looking up at the sky and pointing, asking a question, while his
      grandfather crouches beside him thinking with a smile. Keep the figures in the lower 60% of the frame.
      Leave the top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: outro
    title: "Long days. Short *years*."
    body: "Tag a parent in the thick of it 💛"
    prompt: >-
      A soft evening scene of a South Asian mother cuddling her sleeping toddler on a sofa, a warm lamp glowing.
      Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor
      wash, reserved for text.
caption: |
  Nobody warned us about this part. 😂

  📖 The same book, 47 times, no skipping
  🥤 The wrong-coloured cup is a full tragedy
  🚪 Bathroom privacy? Gone
  ❓ “Why?” about a hundred times a day

  And somehow, also: the tightest hugs, the funniest sentences, and watching a whole little person appear in front of you.

  Long days. Short years. 💛

  Tag a parent who's in the thick of it 👇
hashtags: >-
  #toddlerlife #momlife #dadlife #parentinghumor #toddlermom #indianparents #indianmoms #montessori
  #parentingjourney #letmetry #realmotherhood #raisingkids
printable:
  title: "The Toddler Years Survival Card"
  subtitle: "Little reminders for the long days · All ages"
  intro: >-
    Print this and stick it on the fridge. For the days when everything is a battle, and the days when it's
    all magic.
  sections:
    - heading: "When it's hard, remember"
      items:
        - "Big feelings over small things are normal at this age."
        - "Repetition is how toddlers learn. The 47th reading counts."
        - "Saying 'no' is how they practise being their own person."
        - "Following you everywhere means you are their safe place."
        - "'Why?' is a brain wiring itself. 'Let's find out' is a great answer."
    - heading: "Quick resets"
      items:
        - "Get outside, even for 10 minutes."
        - "Lower your voice instead of raising it."
        - "Sing the instruction instead of saying it."
        - "Sit on the floor. Toddlers relax when you're at their level."
        - "Lower the bar: fed, safe and loved is a good day."
    - heading: "For you"
      items:
        - "Drink water. Eat something."
        - "Ask for help without apologising."
        - "One deep breath before you respond."
        - "You don't have to enjoy every moment to be a great parent."
  sources:
    - label: "General guidance; see our research printables for sources on specific topics."
