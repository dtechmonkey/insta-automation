printable:
  title: "Handwashing Steps Poster"
  subtitle: "Stick it at the sink · Ages 2–5"
  medical: true
  intro: "Print this and stick it at your child's eye level by the sink. Point to each step together until they know it by heart."
  sections:
    - heading: "The steps"
      items:
        - "1. Wet your hands"
        - "2. Add soap"
        - "3. Scrub palms, backs, between fingers and thumbs (sing a short song, about 20 seconds)"
        - "4. Rinse"
        - "5. Dry with your towel"
        - "6. Turn off the tap"
    - heading: "When to wash"
      items:
        - "Before eating"
        - "After the toilet"
        - "After playing outside"
        - "After coughing, sneezing or blowing the nose"
    - heading: "Set up"
      text: "A sturdy step stool, pump soap, and a towel on a low hook."
  sources:
    - label: "CDC: Clean Hands (handwashing guidance)."
      url: "https://www.cdc.gov/clean-hands/"
