slides:
  - kind: cover
    title: "Travelling with toddlers: a *Montessori busy bag*"
    body: ""
    prompt: >-
      A 3-year-old South Asian girl sitting by a train window happily doing a small activity from a cloth pouch on
      her lap, her mother beside her, countryside passing outside. Keep the figures in the lower 60% of the frame.
      Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "Small *pouches*"
    body: "One activity per zip pouch. Bring out one at a time."
    prompt: >-
      A few small zip pouches laid out on a train seat: one with crayons and paper, one with pipe cleaners and
      beads, one with stickers. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty,
      soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "Pipe cleaners and *beads*"
    body: "Big beads on a pipe cleaner: no rolling away on a moving train."
    prompt: >-
      Close view of small hands threading big beads onto a pipe cleaner on a tray table in a car. Keep the
      subject in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green watercolor wash,
      reserved for text.
  - kind: tip
    title: "*Sticker* scenes"
    body: "A sheet of stickers and a blank paper. Peeling = fine motor work."
    prompt: >-
      A 3-year-old South Asian boy in a car seat peeling a sticker and placing it on a paper, concentrating. Keep
      the child in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash,
      reserved for text.
  - kind: tip
    title: "*Window* games"
    body: "“How many cows can you see?” “Spot something red!”"
    prompt: >-
      A father and his 3-year-old daughter looking out of a train window together, the child pointing at cows in a
      field. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor
      wash, reserved for text.
  - kind: outro
    title: "Happy travels, *little explorer*."
    body: "Where are you travelling this winter?"
    prompt: >-
      A South Asian family arriving at a hill station with a toddler on her father's shoulders, mountains in the
      background. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green
      watercolor wash, reserved for text.
caption: |
  Winter holidays mean long train rides, flights and car journeys with toddlers. A Montessori busy bag can save the day. 🚂

  Pack small pouches, one activity each:
  📿 Big beads on pipe cleaners
  ⭐ Stickers and blank paper
  🖍️ Crayons and a small notebook
  🧸 A small soft toy
  📚 One new book

  Bring out one pouch at a time, and save the screen as a last resort. 🌿

  Where are you travelling this winter? 👇
hashtags: >-
  #travelwithkids #toddlertravel #busybag #montessori #montessoriathome #roadtrip #montessoriindia
  #familytravel #indianmoms #travelhacks #letmetry #wintervacation
printable:
  title: "Travel Busy Bag Checklist"
  subtitle: "Screen-light travel with toddlers · Ages 2–4"
  intro: "Pack one activity per small pouch. Bring them out one at a time, and keep a 'new' surprise for the hardest part of the journey."
  sections:
    - heading: "Busy bag ideas"
      items:
        - "Pipe cleaners and big beads"
        - "Sticker sheets and blank paper"
        - "Crayons and a small notebook"
        - "Play dough in a small box"
        - "Lacing card"
        - "A small 'I spy' picture book"
        - "Finger puppets"
    - heading: "No-material games"
      items:
        - "I spy (with colours or sounds)"
        - "Counting cows, trucks or bridges"
        - "Singing rhymes with actions"
    - heading: "Comfort kit"
      items:
        - "Familiar soft toy or blanket"
        - "Snacks and water"
        - "Spare clothes"
        - "Wet wipes"
  sources:
