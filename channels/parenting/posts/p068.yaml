caption: |
  “What did you do at school today?” “Nothing.” Every. Single. Day. 😂

  It's not that they don't want to share. A whole day is just too big to summarise for a 3-year-old.

  Try these instead:
  🍱 “Who did you sit next to at lunch?”
  😂 “What made you laugh today?”
  🎨 “What did you make with your hands?”
  😟 “Was anything hard today?”
  🌙 Wait for bedtime, when they're relaxed

  And share a bit of your day first. They'll copy you.

  What's the funniest answer your child has given? 👇
