printable:
  title: "25 Better Questions After School"
  subtitle: "Questions little children can actually answer · Ages 3–6"
  intro: "Specific, fun questions get much richer answers than 'How was school?'. Pick two or three a day."
  sections:
    - heading: "Friends"
      items:
        - "Who did you play with today?"
        - "Who did you sit next to at lunch?"
        - "Did anyone need help today?"
    - heading: "Feelings"
      items:
        - "What made you laugh today?"
        - "Was anything hard today?"
        - "When did you feel proud?"
    - heading: "Activities"
      items:
        - "What did you make with your hands?"
        - "What song did you sing?"
        - "What was the best part of the day?"
        - "If you were the teacher, what would you do tomorrow?"
    - heading: "Silly"
      items:
        - "Did anything surprising happen?"
        - "What would your teacher's pet be?"
        - "If school was in the clouds, what would it look like?"
    - heading: "Tips"
      text: "Ask after a snack, in the car, or at bedtime. Share your own day too."
  sources:
    - label: "General early-childhood communication guidance."
