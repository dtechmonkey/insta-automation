printable:
  title: "Object Basket Ideas for Language"
  subtitle: "Vocabulary with real things · Ages 1½–3"
  intro: >-
    Real objects build stronger word understanding than pictures for young toddlers. Fill a small basket with
    5–6 safe objects on a theme and explore them together.
  sections:
    - heading: "Theme ideas"
      items:
        - "Fruits: banana, orange, lemon, mango, grapes"
        - "Kitchen: spoon, cup, ladle, whisk, small bowl"
        - "Bath: soap, sponge, small towel, mug, comb"
        - "Clothes: sock, cap, scarf, glove, small shirt"
        - "Nature: leaf, pebble, flower, feather, pinecone"
    - heading: "How to explore"
      items:
        - "Take out one object at a time"
        - "Name it clearly: “This is a lemon.”"
        - "Describe it: “It's yellow. It's bumpy. Smell it!”"
        - "Then play 'show me the…' (see our WORDS printable)"
    - heading: "Safety"
      text: "Choose objects too big to swallow, and always supervise."
  sources:
    - label: "Montessori, M. The Absorbent Mind (language)."
