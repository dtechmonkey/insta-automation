plan: "D22 1 PM · Practical"
topic: "Language · age 2–3"
keyword: BASKET
slides:
  - kind: cover
    title: "Object baskets: new words with *real things*"
    body: ""
    prompt: >-
      A 2-year-old South Asian girl sitting on a rug next to a small woven basket full of real kitchen objects (a
      spoon, a small steel cup, a lemon, a brush), holding up the lemon, her father naming it. Keep the figures
      in the lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for
      text.
  - kind: tip
    title: "Pick a *theme*"
    body: "Kitchen, fruits, bath time, clothes. 5–6 real objects in a basket."
    prompt: >-
      A small woven basket holding a mango, a banana, a lemon, an orange and a small bunch of grapes, on a wooden
      floor. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor
      wash, reserved for text.
  - kind: tip
    title: "Take out, *name*, explore"
    body: "One at a time. Let them touch, smell, shake. Say the name clearly."
    prompt: >-
      A 2-year-old South Asian boy smelling an orange with his eyes closed, his mother smiling beside him. Keep
      the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green watercolor wash,
      reserved for text.
  - kind: tip
    title: "Two *languages*? Great!"
    body: "Name it in your home language and English. Kids handle both."
    prompt: >-
      A grandmother holding up a small brass bell to her 2-year-old granddaughter, both smiling, a basket of
      objects between them. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft
      dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "*Change* it weekly"
    body: "A new basket each week keeps curiosity high."
    prompt: >-
      A low shelf with three different themed baskets: bath items, clothes and kitchen tools, a toddler reaching
      for one. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: outro
    title: "Real things, *real* words."
    body: "What would you put in your first basket?"
    prompt: >-
      A happy 2-year-old South Asian girl wearing a small cap from a 'clothes' basket, laughing with her mother.
      Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor
      wash, reserved for text.
caption: |
  The best vocabulary tool for toddlers isn't a flashcard. It's a basket of real things from your home. 🧺

  Montessori classrooms use real objects because toddlers learn words by touching, smelling and using things, not just looking at pictures.

  How to:
  🍋 Pick a theme: fruits, kitchen, bath, clothes
  🖐️ Take out one at a time, name it clearly, explore it
  🗣️ Use your home language and English
  🔄 Change the basket every week

  What would you put in your first basket? 👇
hashtags: >-
  #montessori #montessoriathome #languagedevelopment #treasurebasket #toddleractivities #montessoriindia
