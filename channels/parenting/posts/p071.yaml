id: p071
plan: "D36 1 PM · Practical"
topic: "Fine motor · age 2–3"
keyword: BEADS
slides:
  - kind: cover
    title: "Threading big beads: *focus* in a bowl"
    body: ""
    prompt: >-
      A 2-year-old South Asian girl threading big colourful wooden beads onto a thick cord at a low table, a
      small bowl of beads beside her, fully absorbed. Keep the child in the lower 60% of the frame. Leave the top
      35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "Start with *pipe cleaners*"
    body: "A stiff pipe cleaner and big beads are easiest for beginners."
    prompt: >-
      Close view of small hands pushing a big wooden bead onto a stiff pipe cleaner. Keep the subject in the lower
      60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "*Penne* pasta works too"
    body: "Dry penne on a shoelace: free, colourful and big."
    prompt: >-
      A small bowl of dry penne pasta and a shoelace on a tray, a toddler threading pasta pieces. Keep the subject
      in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green watercolor wash, reserved for
      text.
  - kind: tip
    title: "Then *patterns*"
    body: "Red, blue, red, blue… threading turns into early maths."
    prompt: >-
      A 3-year-old South Asian boy holding up a threaded cord of beads in an alternating red and blue pattern,
      proud. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue
      watercolor wash, reserved for text.
  - kind: tip
    title: "*Wear* it"
    body: "A necklace or bracelet they made. Instant pride."
    prompt: >-
      A 3-year-old South Asian girl putting a big bead necklace she made around her grandmother's neck, both
      smiling. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: outro
    title: "One bead at a *time*."
    body: "Has your toddler tried threading?"
    prompt: >-
      A happy 2-year-old South Asian boy showing off a long threaded pasta necklace to his mother. Keep the
      figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor wash,
      reserved for text.
caption: |
  Threading looks simple, but it asks a toddler to coordinate both hands, aim carefully and stick with it. That's real focus. 📿

  Start easy and build up:
  🔸 Big beads on a stiff pipe cleaner
  🍝 Dry penne pasta on a shoelace (free!)
  🔁 Then patterns: red, blue, red, blue
  📿 Wear what they made

  Use big beads only, and supervise children who still mouth objects. 🌿

  Has your toddler tried threading? 👇
hashtags: >-
  #finemotorskills #threading #montessori #montessoriathome #toddleractivities #montessoriindia
  #2yearold #concentration #indianmoms #diyactivities #letmetry #playathome
printable:
  title: "Threading Levels"
  subtitle: "From pipe cleaners to patterns · Ages 2–4"
  intro: "Threading builds hand-eye coordination, two-handed control and concentration. Move up a level when they're confident."
  sections:
    - heading: "Level 1"
      items:
        - "Big wooden beads on a stiff pipe cleaner"
        - "Or rings onto a standing kitchen-roll holder"
    - heading: "Level 2"
      items:
        - "Dry penne or rigatoni on a shoelace (tape the end)"
        - "Cut straws on a cord"
    - heading: "Level 3"
      items:
        - "Smaller beads on a cord with a stiff tip"
        - "Copy a simple 2-colour pattern"
    - heading: "Level 4"
      items:
        - "Lacing cards (punch holes around a cardboard shape)"
        - "3-colour patterns"
    - heading: "Safety"
      text: "Use large beads for children who still mouth objects, and always supervise."
  sources:
    - label: "Montessori, M. The Discovery of the Child (practical life)."
