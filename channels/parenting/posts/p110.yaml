slides:
  - kind: cover
    title: "*“Log kya kahenge?”* Raise your child for them, not for others"
    body: ""
    prompt: >-
      A South Asian mother at a family gathering holding her 3-year-old son's hand, while several relatives in
      the background whisper and look over, gentle and warm tone, the mother calm and confident. Keep the figures
      in the lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "*“What will people say?”*"
    body: "Many parenting choices are made to look good, not to help the child."
    prompt: >-
      A toddler in an uncomfortable fancy outfit tugging at the collar at a party, looking unhappy. Gentle humour.
      Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash,
      reserved for text.
  - kind: tip
    title: "Kids *feel* the pressure"
    body: "Performing for relatives, being compared, being hushed. It shapes how they see themselves."
    prompt: >-
      A 3-year-old South Asian girl looking nervous as relatives ask her to recite a rhyme, her mother stepping
      in kindly. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green
      watercolor wash, reserved for text.
  - kind: tip
    title: "Ask: *who* is this for?"
    body: "Before a choice, ask: “Is this for my child, or for the audience?”"
    prompt: >-
      A thoughtful father sitting on a bed next to his sleeping toddler, looking calm and reflective. Keep the
      figures in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash,
      reserved for text.
  - kind: tip
    title: "*Respect* elders, choose for your child"
    body: "You can listen kindly and still decide what's best for your family."
    prompt: >-
      A young South Asian mother smiling and nodding politely to an elderly relative while holding her toddler
      close, warm and respectful. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty,
      soft peach watercolor wash, reserved for text.
  - kind: outro
    title: "Your child, your *choice*."
    body: "What's one 'log kya kahenge' you've let go of? 👇"
    prompt: >-
      A 3-year-old South Asian boy in comfortable clothes playing happily in mud in a garden, his parents laughing
      nearby. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green
      watercolor wash, reserved for text.
caption: |
  “Log kya kahenge?” (What will people say?) Four words that shape so many Indian parenting decisions. 👀

  The fancy outfit they hate. Making them perform for relatives. Hushing their questions. Worrying about which school sounds impressive.

  But children feel it when choices are made for an audience instead of for them.

  Try asking:
  ❓ “Is this for my child, or for others?”
  💛 Listen to elders kindly, then choose for your family
  🌱 Let your child be a child, not a showpiece

  What's one “log kya kahenge” you've let go of? 👇
