printable:
  title: "Parenting for Your Child, Not the Audience"
  subtitle: "A reflection worksheet · All ages"
  intro: "Social pressure is real, especially in close-knit families. This worksheet helps you notice which choices are truly for your child."
  sections:
    - heading: "Reflect"
      items:
        - "One choice I make mainly because of what others will think: ___"
        - "How does my child feel about it? ___"
        - "What would I choose if no one was watching? ___"
    - heading: "Common pressures"
      items:
        - "Performing for relatives"
        - "Fancy clothes over comfortable ones"
        - "Early academics to impress"
        - "Comparisons with cousins"
        - "Hushing a child who is 'too loud'"
    - heading: "Kind responses to relatives"
      items:
        - "“Thank you for caring. We're trying it this way for now.”"
        - "“She'll share when she's ready.”"
        - "“The doctor suggested this. We're giving it a try.”"
    - heading: "Remember"
      text: "Your child's sense of worth grows from feeling accepted at home, whatever others think."
  sources:
    - label: "Harter, S. (2012). The Construction of the Self (2nd ed.). Guilford Press."
