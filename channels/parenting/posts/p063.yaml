plan: "D32 1 PM · Practical"
topic: "Practical life · age 2–3"
keyword: BANANA
slides:
  - kind: cover
    title: "Peeling and slicing a banana: *first knife work*"
    body: ""
    prompt: >-
      A 2-year-old South Asian boy at a low table slicing a peeled banana on a small wooden board with a
      child-safe crinkle cutter, concentrating, a plate ready beside him. Keep the child in the lower 60% of the
      frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "*Peel* it first"
    body: "Start the top for them. They pull the strips down."
    prompt: >-
      Close view of small hands pulling down a banana peel strip, the top already opened. Keep the subject in the
      lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "A *safe* cutter"
    body: "A crinkle cutter or a blunt butter knife. Soft food only."
    prompt: >-
      A small wooden board with a peeled banana, a wavy crinkle cutter and a blunt butter knife laid neatly
      beside it. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green
      watercolor wash, reserved for text.
  - kind: tip
    title: "Two hands, *flat* fingers"
    body: "One hand holds the cutter handle, the other keeps fingers flat and away."
    prompt: >-
      A father guiding his 3-year-old daughter's hands as she slices a banana with a crinkle cutter. Keep the
      figures in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash,
      reserved for text.
  - kind: tip
    title: "*Serve* the family"
    body: "Banana slices on a plate, offered to everyone. Pride on a plate."
    prompt: >-
      A 2-year-old South Asian girl offering a small plate of banana slices to her grandmother and mother at a
      table, beaming. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: outro
    title: "Real tools, *real* confidence."
    body: "What soft food will your toddler cut first?"
    prompt: >-
      A proud 2-year-old South Asian boy eating a banana slice he cut himself, his plate of uneven slices in
      front of him. Keep the child in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green
      watercolor wash, reserved for text.
caption: |
  A knife for a 2-year-old?! With the right tool and close supervision, yes. 🍌

  Montessori children start food preparation early, beginning with soft foods and child-safe cutters. It builds coordination, focus and huge confidence.

  The steps:
  🍌 Start the peel; they pull the strips
  〰️ A crinkle cutter or blunt butter knife
  ✋ Two hands: one on the handle, fingers flat and away
  🍽️ Serve the slices to the family

  Always supervise closely. Never sharp knives. 🌿

  What soft food will your toddler cut first? 👇
