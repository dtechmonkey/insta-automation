printable:
  title: "First Food Prep: Soft Foods to Cut"
  subtitle: "Practical life in the kitchen · Ages 2–4"
  intro: "Cutting soft foods with child-safe tools builds coordination and confidence. Always supervise."
  sections:
    - heading: "Tools"
      items:
        - "A crinkle cutter (wavy chopper)"
        - "A blunt butter knife"
        - "A small wooden board"
        - "A plate to serve"
    - heading: "Soft foods to start"
      items:
        - "Banana"
        - "Boiled potato"
        - "Paneer"
        - "Ripe papaya"
        - "Cucumber (peeled, cut in half lengthwise first)"
        - "Idli"
    - heading: "How to teach"
      items:
        - "Show slowly once"
        - "One hand on the handle, other hand flat and away"
        - "Cut away from the body"
        - "Serve and share what they cut"
    - heading: "Safety"
      text: "Never sharp knives; always supervise; keep the board on a non-slip cloth."
  sources:
    - label: "Montessori, M. The Discovery of the Child (practical life: food preparation)."
