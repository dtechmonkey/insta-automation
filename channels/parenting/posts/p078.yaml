id: p078
plan: "D39 7:30 PM · Debate"
topic: "Transitions · ages 2–4"
keyword: HURRY
slides:
  - kind: cover
    title: "Stop saying *“Hurry up!”*"
    body: "4 ways to get out the door calmly"
    prompt: >-
      A mother at a front door with keys and bags, while her 3-year-old South Asian son sits on the floor slowly
      looking at a ladybug, one shoe on. Gentle humour. Keep the figures in the lower 60% of the frame. Leave the
      top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "Toddlers *can't* rush"
    body: "Time pressure makes young children slower, not faster."
    prompt: >-
      A 2-year-old South Asian girl frozen and teary in a hallway while hurried adult legs pass by. Gentle,
      empathetic tone. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: tip
    title: "1. *Warn* ahead"
    body: "“In 5 minutes, shoes. Then we go.” Transitions need notice."
    prompt: >-
      A father kneeling beside his 3-year-old son who is playing with blocks, holding up five fingers with a
      smile. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green
      watercolor wash, reserved for text.
  - kind: tip
    title: "2. Make it a *game*"
    body: "“Can you hop to the door like a frog?” Play beats pressure."
    prompt: >-
      A 3-year-old South Asian girl hopping like a frog towards the front door, laughing, her mother hopping too.
      Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor
      wash, reserved for text.
  - kind: tip
    title: "3. Give a *job*"
    body: "“Can you carry the keys?” Helpers move faster."
    prompt: >-
      A proud 3-year-old South Asian boy carrying a small bag and a set of keys out of the front door. Keep the
      child in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved
      for text.
  - kind: tip
    title: "4. *Start* earlier"
    body: "The only real fix: build in 10 extra minutes."
    prompt: >-
      A relaxed mother sipping chai by the window while her toddler puts on shoes slowly by the door. Keep the
      figures in the lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved
      for text.
  - kind: outro
    title: "Calm is the *fastest* way out."
    body: "How long does leaving the house take you? 😅"
    prompt: >-
      A happy South Asian mother and toddler walking out of the gate hand in hand on a sunny morning. Keep the
      figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor wash,
      reserved for text.
caption: |
  “Jaldi karo! Hurry up! We're late!” …and somehow, they get slower. 😩

  Young children don't experience time the way we do, and pressure makes them freeze or resist.

  4 things that actually work:
  ⏰ Warn ahead: “In 5 minutes, shoes.”
  🐸 Make it a game: “Hop to the door like a frog!”
  🔑 Give a job: “Can you carry the keys?”
  🕰️ Start 10 minutes earlier (the real fix!)

  How long does leaving the house take you? 👇
hashtags: >-
  #toddlerlife #transitions #gentleparenting #morningroutine #montessori #indianparents #indianmoms
  #calmparenting #parentinghacks #parentingtips #letmetry #positiveparenting
printable:
  title: "Smooth Transitions Toolkit"
  subtitle: "Getting out the door without tears · Ages 2–4"
  intro: "Transitions (leaving the park, getting dressed, going out) are hard for toddlers. These tools make them smoother."
  sections:
    - heading: "Before"
      items:
        - "Give a 5-minute and a 1-minute warning"
        - "Use a timer they can see"
        - "Prepare bags and shoes in advance"
    - heading: "During"
      items:
        - "Make it a game: hop, tiptoe, race"
        - "Give a job: carry the keys, press the lift button"
        - "Offer a choice: “Shoes first or jacket first?”"
        - "Bring the toy along: “Teddy can come too.”"
    - heading: "Phrases"
      items:
        - "“First shoes, then we'll see the birds.”"
        - "“You don't want to stop. It's hard to stop playing.”"
        - "“We'll come back tomorrow.”"
  sources:
    - label: "General early-childhood guidance on transitions."
