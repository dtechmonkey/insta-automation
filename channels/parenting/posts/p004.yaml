caption: |
  “He only eats if the phone is on.” If that's your home, you are not alone, and it's not a parenting failure. 📱

  But here's what the research says: when a child's eyes are on a screen, they eat on autopilot. They stop noticing when they're full, and they miss the colours, smells and textures that teach them to enjoy food.

  The WHO recommends no screen time under age 2, and no more than 1 hour a day for ages 2–4.

  Start small:
  🍽️ One screen-free meal a day
  👨‍👩‍👧 Eat together, at the same time
  🥄 Smaller portions, more self-feeding
  🗣️ Talk about the food: “This mango is so juicy!”

  The first 3–4 days are hard. Then it gets easier. 🌿

  Honest question: does your family eat with screens? 👇

  (General information, not medical advice.)
