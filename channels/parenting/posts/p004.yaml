printable:
  title: "Screen-Free Mealtimes: A 7-Day Plan"
  subtitle: "For toddlers who 'only eat with the phone' · Ages 1–4"
  medical: true
  intro: >-
    Screens at meals usually start as a lifesaver. Moving away from them works best gradually, with a clear
    routine and lots of company at the table.
  sections:
    - heading: "What the guidance says"
      items:
        - "The WHO recommends no sedentary screen time for children under 2, and no more than 1 hour a day for ages 2–4."
        - "The American Academy of Pediatrics advises keeping mealtimes screen-free for the whole family."
    - heading: "The 7-day plan"
      items:
        - "Days 1–2: Pick one meal, usually breakfast, and make it screen-free. Sit and eat with them."
        - "Days 3–4: Add a small 'job' before the meal: carrying spoons, pouring water."
        - "Days 5–6: Make a second meal screen-free. Talk about the food's colour, smell and crunch."
        - "Day 7: Phones go in a basket during meals, for everyone."
    - heading: "Things that help"
      items:
        - "Smaller portions. They can always ask for more."
        - "Let them self-feed, with hands or a small spoon."
        - "Meals at the same times every day, without snacks just before."
        - "Keep meals short: 20–30 minutes, then calmly clear the plate."
        - "Expect them to eat less for a few days. Appetites balance out over the week."
    - heading: "Talk instead of scroll"
      items:
        - "“What colour is your sabzi?”"
        - "“Is the roti soft or crunchy?”"
        - "“Who should we save a piece for?”"
    - heading: "When to ask a doctor"
      text: >-
        If your child is losing weight, often gags or vomits at meals, or eats very few foods, speak to your
        paediatrician.
  sources:
    - label: "World Health Organization (2019). Guidelines on physical activity, sedentary behaviour and sleep for children under 5 years of age."
      url: "https://www.who.int/publications/i/item/9789241550536"
    - label: "AAP Council on Communications and Media (2016). Media and Young Minds. Pediatrics, 138(5)."
