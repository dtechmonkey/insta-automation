slides:
  - kind: cover
    title: "5 calm-down ideas for *big feelings*"
    body: ""
    prompt: >-
      A 3-year-old South Asian girl sitting in a cosy calm corner with a soft cushion and a stuffed toy, taking a
      slow breath with her eyes closed, a small plant beside her. Keep the child in the lower 60% of the frame.
      Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "A calm *corner*"
    body: "Cushions, a soft toy, a few books. A place to go, not a punishment."
    prompt: >-
      A small cosy nook in a home with floor cushions, a soft blanket, a stuffed elephant and two picture books
      in a basket, gentle light, no people. Keep the scene in the lower 60% of the frame. Leave the top 35% as
      an empty, soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "*Name* it to tame it"
    body: "“You're so angry the tower fell.” Naming feelings helps calm the brain."
    prompt: >-
      A father kneeling beside his crying 2-year-old South Asian son next to a fallen block tower, gently
      putting a hand on his back. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty,
      soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "Smell the flower, blow the *candle*"
    body: "A breathing game toddlers actually like."
    prompt: >-
      A 3-year-old South Asian girl holding up one finger like a candle and puffing her cheeks to blow, her
      mother doing the same opposite her, both smiling. Keep the figures in the lower 60% of the frame. Leave
      the top 35% as an empty, soft dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "*Move* the feeling out"
    body: "Stamp feet, squeeze a pillow, push the wall. Bodies need to let it go."
    prompt: >-
      A 3-year-old South Asian boy squeezing a big pillow tightly with a fierce face, then starting to grin,
      in a living room. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: tip
    title: "Just *stay*"
    body: "Sometimes they don't need words. They need you nearby, calm."
    prompt: >-
      A mother sitting quietly on the floor next to her upset 2-year-old South Asian daughter, not talking, just
      close, a soft lamp glowing. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty,
      soft cream watercolor wash, reserved for text.
  - kind: outro
    title: "Calm is *taught*, not told."
    body: "Which one works for your child?"
    prompt: >-
      A 3-year-old South Asian boy hugging his father after a meltdown, both calm now, sitting in a cosy corner
      with cushions. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft
      sage-green watercolor wash, reserved for text.
caption: |
  “Calm down!” has never calmed down a single toddler. 😅

  Little children can't calm themselves yet. The part of the brain that manages emotions is still developing for years. They learn calm by borrowing ours.

  5 ideas that help:
  🛋️ A calm corner (a place to go, not a punishment)
  🏷️ Name the feeling: “You're angry the tower fell.”
  🌸 Smell the flower, blow the candle
  👊 Move it out: stamp, squeeze, push the wall
  🤍 Just stay close, calmly

  Practise these when everyone is calm, so they're ready when the storm hits. 🌿

  Which one works for your child? 👇
