printable:
  title: "Calm-Down Toolkit"
  subtitle: "Big-feelings cards to print and cut · Ages 2–4"
  intro: >-
    Practise these when your child is calm, like a game. Then, in a big moment, offer two choices: “Do you
    want to blow the candle or squeeze the pillow?”
  sections:
    - heading: "Why it works"
      items:
        - "Naming a feeling ('name it to tame it') helps a child's thinking brain calm the emotional brain (Siegel & Bryson, 2011)."
        - "Children whose parents accept and talk about emotions ('emotion coaching') manage their feelings better over time (Gottman, 1997)."
    - heading: "Breathing games"
      items:
        - "Smell the flower, blow the candle"
        - "Blow bubbles (real or pretend)"
        - "Balloon belly: hands on tummy, fill it up slowly"
        - "Snake breath: breathe in, hiss out slowly"
    - heading: "Move it out"
      items:
        - "Stamp your feet 10 times"
        - "Squeeze a pillow as hard as you can"
        - "Push the wall"
        - "Jump like a frog"
    - heading: "Words to say"
      items:
        - "“You're really angry. I'm here.”"
        - "“It's okay to be sad. I'll stay with you.”"
        - "“I won't let you hit. You can hit this pillow.”"
        - "“When you're ready, I'm ready for a hug.”"
    - heading: "Calm corner kit"
      items:
        - "Two cushions and a soft blanket"
        - "A favourite soft toy"
        - "2–3 books about feelings"
        - "A small sand timer or glitter jar to watch"
  sources:
    - label: "Siegel, D. J., & Bryson, T. P. (2011). The Whole-Brain Child. Delacorte Press."
    - label: "Gottman, J. (1997). Raising an Emotionally Intelligent Child. Simon & Schuster."
