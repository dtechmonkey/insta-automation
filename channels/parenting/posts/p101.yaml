id: p101
plan: "D51 1 PM · Practical"
topic: "Pre-writing · age 3–4"
keyword: LETTERS
slides:
  - kind: cover
    title: "Writing readiness: DIY *sandpaper letters*"
    body: ""
    prompt: >-
      A 3-year-old South Asian girl tracing a large textured letter shape glued on a small wooden board with two
      fingers, eyes focused, other letter boards beside her. Keep the child in the lower 60% of the frame. Leave
      the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "Make them at *home*"
    body: "Cut letters from sandpaper, glue onto card. Or use glue and sand."
    prompt: >-
      A table with sandpaper sheets, scissors, glue and cut-out letter shapes on small cards, a parent's hands
      gluing one. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: tip
    title: "Trace and *say the sound*"
    body: "Two fingers trace the shape while saying 'sss', not 'es'."
    prompt: >-
      A mother guiding her 3-year-old son's two fingers along a textured letter while making a sound with her
      mouth. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green
      watercolor wash, reserved for text.
  - kind: tip
    title: "Start with *a few*"
    body: "s, a, t, m, p: three new letters a week is plenty."
    prompt: >-
      Three textured letter cards laid out on a small mat, a toddler's hand resting on one. Keep the subject in
      the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash, reserved for
      text.
  - kind: tip
    title: "Then a *sand tray*"
    body: "Trace the letter in a tray of sand or salt. Shake to erase."
    prompt: >-
      A 4-year-old South Asian girl tracing a letter shape with her finger in a shallow tray of sand. Keep the
      child in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved
      for text.
  - kind: outro
    title: "Touch it, say it, *know* it."
    body: "Would you try making sandpaper letters?"
    prompt: >-
      A proud 3-year-old South Asian boy holding up a sandpaper letter card to his grandmother, both smiling. Keep
      the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor wash,
      reserved for text.
caption: |
  In Montessori, children learn letters with their hands before they write them, by tracing sandpaper letters and saying their sounds. ✍️

  You can make them at home:
  ✂️ Cut letters from sandpaper and glue them onto card
  👆 Trace with two fingers while saying the sound ('sss', not 'es')
  🔤 Start with s, a, t, m, p
  🏖️ Then trace them in a tray of sand or salt

  Touch + sound + sight = letters that stick. 🌿

  Would you try making sandpaper letters? 👇
hashtags: >-
  #sandpaperletters #montessori #montessoriathome #prewriting #earlyliteracy #montessoriindia #3yearold
  #diymontessori #indianmoms #phonics #letmetry #preschoolactivities
printable:
  title: "DIY Sandpaper Letters"
  subtitle: "Touch-and-trace letter sounds · Ages 3–5"
  intro: "Tracing a letter while saying its sound connects touch, movement and hearing, preparing the hand and mind for writing and reading."
  sections:
    - heading: "Make them"
      items:
        - "Fine sandpaper, thick card, scissors, glue"
        - "Draw lowercase letters about 8 cm tall on the back of sandpaper (reversed)"
        - "Cut out and glue onto card"
        - "Option: draw letters with glue on card and sprinkle sand"
    - heading: "Start with these sounds"
      items:
        - "s, a, t, m, p, i, n"
        - "These make many simple words: sat, map, tin, pan"
    - heading: "Presenting a letter"
      items:
        - "Trace slowly with two fingers, in the writing direction"
        - "Say the sound: 'sss'"
        - "Invite them to trace and say it"
        - "Play 'show me the sss'"
    - heading: "Next steps"
      text: "Trace letters in a sand or salt tray, then on a chalkboard, and later with a pencil."
  sources:
    - label: "Montessori, M. The Montessori Method (sandpaper letters)."
