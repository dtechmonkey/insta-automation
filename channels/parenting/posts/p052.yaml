printable:
  title: "Conversation Starters for Little Ones"
  subtitle: "Questions that get toddlers talking · Ages 2–5"
  intro: >-
    Children grow language and confidence through real conversation. Use these at meals, in the car, at
    bedtime.
  sections:
    - heading: "What the research found"
      items:
        - "The number of conversational turns between adults and children was linked to children's language skills and activity in language areas of the brain (Romeo et al., 2018)."
    - heading: "About their day"
      items:
        - "What made you laugh today?"
        - "Who did you play with?"
        - "What was the yummiest thing you ate?"
    - heading: "Imagination"
      items:
        - "If you were a bird, where would you fly?"
        - "What would you do if you were tiny like an ant?"
        - "What should we name the moon?"
    - heading: "Their opinion"
      items:
        - "What should we cook tomorrow?"
        - "Which book should we read?"
        - "Where should we go this weekend?"
    - heading: "Tips"
      text: "Wait for answers. Repeat back what they said. Follow their topic, even if it's dinosaurs again."
  sources:
    - label: "Romeo, R. R., et al. (2018). Beyond the 30-million-word gap. Psychological Science, 29(5), 700–710."
