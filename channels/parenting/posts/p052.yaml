caption: |
  “Bado ke beech mein nahi bolte.” (Don't speak when elders are talking.) Many of us grew up with this. 🤫

  Manners matter. But children also need to be heard. Research shows that back-and-forth conversations between adults and young children are linked to stronger language skills and brain development.

  Try:
  🗣️ Give them a turn at the dinner table
  👂 Listen with full attention, even for 2 minutes
  ✋ Teach waiting, and make sure the turn comes: “One minute, then I'm all yours.”
  ❓ Ask their opinion: “What should we cook tomorrow?”

  Were children heard in your home growing up? 👇
