id: p112
plan: "D56 7:30 PM · Practical (recap)"
topic: "8-week recap · ages 2–4"
keyword: RECAP8
slides:
  - kind: cover
    title: "Our *top 5* ideas from 8 weeks"
    body: "Save this one"
    prompt: >-
      A cosy watercolor scene of a calm Indian home corner with a low shelf, a pouring tray and a reading cushion,
      a 3-year-old South Asian girl choosing an activity. Keep the scene in the lower 60% of the frame. Leave the
      top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "Let them *pour*"
    body: "A small steel jug and tumbler. Spills are practice."
    prompt: >-
      A 2-year-old South Asian boy pouring water from a small steel jug into a tumbler, concentrating. Keep the
      child in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved for
      text.
  - kind: tip
    title: "Describe, don't just *praise*"
    body: "“You kept trying until it fit!”"
    prompt: >-
      A mother kneeling and smiling at her 3-year-old daughter who just finished a puzzle. Keep the figures in the
      lower 60% of the frame. Leave the top 35% as an empty, soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "*Fewer* toys"
    body: "6–8 on a low shelf, rotated weekly."
    prompt: >-
      A minimal low wooden shelf with a few toys in baskets, a toddler choosing one. Keep the subject in the lower
      60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "Name the *feeling*"
    body: "“You're sad the park time is over.” Then stay close."
    prompt: >-
      A father kneeling beside his sad 3-year-old son at a park gate, a hand on his shoulder. Keep the figures in
      the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "*Real* jobs at home"
    body: "Sweeping, setting the table, washing vegetables."
    prompt: >-
      A 3-year-old South Asian girl setting steel plates on a dining table using a placemat guide. Keep the child
      in the lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: outro
    title: "Here's to the *next* 8 weeks."
    body: "Which idea will you keep doing? 💛"
    prompt: >-
      A South Asian family laughing together on a rug with their toddler and a pile of picture books, warm evening
      light. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green
      watercolor wash, reserved for text.
caption: |
  8 weeks, 112 posts, and a whole community of parents trying new things. 🌿 Here are our top 5 ideas to save:

  🫗 Let them pour
  🎨 Describe, don't just praise
  🧺 Fewer toys, rotated weekly
  💛 Name the feeling, then stay close
  🧹 Real jobs at home

  Which idea will you keep doing? 💛

  New here? Follow for 2 Montessori ideas every day.
hashtags: >-
  #montessori #montessoriathome #gentleparenting #parentingtips #montessoriindia #toddleractivities
  #indianparents #indianmoms #positiveparenting #toddlerlife #letmetry #raisingkids
