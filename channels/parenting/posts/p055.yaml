plan: "D28 1 PM · Warm"
topic: "Parent life · all ages"
keyword: REMEMBER
slides:
  - kind: cover
    title: "5 things your child will *remember*"
    body: "(and 5 they won't)"
    prompt: >-
      A South Asian father carrying his 3-year-old daughter on his shoulders during an evening walk, both
      laughing, golden light. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft
      cream watercolor wash, reserved for text.
  - kind: tip
    title: "They *won't* remember"
    body: "The messy house. The store-bought cake. The unfolded laundry."
    prompt: >-
      A slightly messy, lived-in living room with toys on the floor and a laundry pile on the sofa, warm and
      homely, no people. Keep the scene in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: tip
    title: "They *will* remember"
    body: "How you laughed together."
    prompt: >-
      A mother and her 3-year-old son laughing hysterically together on a bed. Keep the figures in the lower 60%
      of the frame. Leave the top 35% as an empty, soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "They *will* remember"
    body: "That you listened to their stories."
    prompt: >-
      A grandfather listening intently to his 3-year-old granddaughter telling a story with big gestures. Keep
      the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash,
      reserved for text.
  - kind: tip
    title: "They *will* remember"
    body: "That you said sorry, and made it right."
    prompt: >-
      A father kneeling and hugging his 3-year-old son warmly after a disagreement, both calm now. Keep the
      figures in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved
      for text.
  - kind: tip
    title: "They *will* remember"
    body: "Feeling safe, and feeling loved."
    prompt: >-
      A 2-year-old South Asian girl asleep on her mother's chest on a sofa, the mother's hand on her back. Keep
      the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash,
      reserved for text.
  - kind: outro
    title: "Be *present*. That's enough."
    body: "Send this to a parent who's being too hard on themselves 💛"
    prompt: >-
      A South Asian family having a simple picnic on a balcony floor, the toddler feeding his mother a piece of
      fruit. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green
      watercolor wash, reserved for text.
caption: |
  They won't remember the messy house, the store-bought cake, or the laundry that didn't get folded. 🧺

  They will remember:
  😂 How you laughed together
  👂 That you listened to their stories
  🤗 That you said sorry and made it right
  🏡 That home felt safe
  💛 That they were loved

  Be present. That's enough.

  Send this to a parent who's being too hard on themselves 👇
hashtags: >-
  #parentingquotes #momlife #dadlife #gentleparenting #presentparenting #indianparents #indianmoms
  #montessori #childhoodmemories #mindfulparenting #letmetry #goodenoughparent
printable:
  title: "10-Minute Connection Ideas"
  subtitle: "Small moments that become big memories · All ages"
  intro: >-
    Children remember how they felt with us. These short, simple moments build that feeling day by day.
  sections:
    - heading: "At home"
      items:
        - "A pillow fight"
        - "A dance party to one song"
        - "Reading together in a blanket fort"
        - "Cooking a simple snack together"
        - "Looking at old photos and telling stories"
    - heading: "Outside"
      items:
        - "A walk to look for birds"
        - "Jumping in puddles"
        - "Watching the sunset from the balcony"
    - heading: "At bedtime"
      items:
        - "'Best part of today' question"
        - "A made-up story starring them"
        - "A back rub and a song"
  sources:
    - label: "A Let Me Try family activity."
