printable:
  title: "Raising a Bilingual Child"
  subtitle: "What the research says · Ages 0–5"
  intro: >-
    Many Indian children grow up hearing two or three languages. That's a strength, not a problem.
  sections:
    - heading: "What the research says"
      items:
        - "Learning two languages from early childhood is natural; bilingual children reach language milestones within the normal range (Byers-Heinlein & Lew-Williams, 2013)."
        - "UNESCO recommends that children learn in a language they understand, especially in the early years (UNESCO, 2016)."
    - heading: "Myths and facts"
      items:
        - "Myth: Two languages confuse children. Fact: Children learn to separate languages naturally."
        - "Myth: Mixing languages is a sign of confusion. Fact: It's a normal, clever strategy."
        - "Myth: Speak only English to help school. Fact: Rich talk in any language builds the skills they need."
    - heading: "Everyday tips"
      items:
        - "Each adult can speak their strongest language"
        - "Read, sing and tell stories in your home language"
        - "Keep talking even if they answer in English"
        - "Visit grandparents and relatives who speak the language"
    - heading: "When to check"
      text: "If your child isn't using words by about 16 months, or isn't combining words by 2, speak to your paediatrician, whatever the number of languages."
  sources:
    - label: "Byers-Heinlein, K., & Lew-Williams, C. (2013). Bilingualism in the early years: What the science says. LEARNing Landscapes, 7(1), 95–112."
    - label: "UNESCO (2016). If you don't understand, how can you learn? Global Education Monitoring Report, Policy Paper 24."
