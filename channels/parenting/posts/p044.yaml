caption: |
  “Only speak English to him, or he'll struggle in school.” Many Indian parents worry about this. The research is reassuring. 🗣️

  Young children are capable of learning two or more languages at once. A strong first language actually supports the second: skills like understanding stories and building vocabulary carry over. UNESCO recommends mother-tongue-based learning in the early years.

  What helps:
  💬 Speak the language you're most fluent and expressive in
  📚 Read and sing in your home language
  🔀 Mixing languages is normal, not a problem
  🌍 English will come through school, media and friends

  Which languages does your child hear at home? 👇
