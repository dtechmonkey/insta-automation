caption: |
  The baby walker is a gift at almost every Indian baby shower. But the science isn't on its side. 🚼

  ❌ Myth: walkers help babies walk earlier
  ✅ Fact: studies found no benefit, and some found babies in walkers walked later

  Walkers also cause thousands of injuries every year, mostly falls down stairs, which is why the American Academy of Pediatrics has called for a ban.

  What helps instead:
  🤸 Lots of floor time: tummy time, rolling, crawling
  🪑 A sturdy low table to pull up and cruise along
  🛒 A heavy, stable push toy for first steps

  If you used a walker, don't feel guilty. Most of us did. Now we know better. 💛

  Share this with someone expecting a baby 👇

  (General information, not medical advice.)
