printable:
  title: "Flower Rangoli for Toddlers"
  subtitle: "A step-by-step festive activity · Ages 2–3"
  intro: >-
    A soft, safe and beautiful way to include the littlest ones in festive decorating.
  sections:
    - heading: "You'll need"
      items:
        - "Marigolds, roses or any flowers"
        - "Green leaves"
        - "Chalk"
        - "Small bowls or baskets"
    - heading: "Steps"
      items:
        - "Draw a simple circle or flower outline with chalk."
        - "Let your child pull petals into bowls, one colour each."
        - "Fill the shape with one colour, then add another ring."
        - "Decorate the edge with leaves."
    - heading: "Learning along the way"
      items:
        - "Finger strength from pulling petals"
        - "Colour names and 'inside' and 'outside'"
        - "Focus and finishing a task"
        - "Belonging: they helped decorate the home"
  sources:
    - label: "Montessori, M. The Montessori Method (sensorial education)."
