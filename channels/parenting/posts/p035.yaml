caption: |
  Rangoli powder and toddlers… we all know how that ends. 😅 Try flowers instead!

  A flower rangoli is safe, beautiful and full of learning: pulling petals builds finger strength, filling a shape builds focus, and choosing colours builds confidence.

  How to:
  ⭕ Draw one simple chalk circle
  🌼 Let them pull marigold petals apart
  🍃 Fill the shape, leaves around the edge
  📸 Take a photo with their creation!

  Share a picture of your little one's rangoli with us! 👇
