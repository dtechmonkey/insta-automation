caption: |
  “Bahut shaitan hai!” We call toddlers naughty for climbing, throwing, refusing and not listening. But most of it is completely normal development. 😄

  🧗 Climbing everything → testing body and balance
  🍽️ Throwing food → learning cause and effect
  🙅 “No!” to everything → discovering they're a separate person
  👂 Not listening → deeply absorbed in play

  When we understand the why, we can respond calmly: redirect, give safe options, offer choices.

  What's your toddler's “naughtiest” habit right now? 👇
