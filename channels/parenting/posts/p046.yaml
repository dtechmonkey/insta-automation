printable:
  title: "What's Behind the 'Naughty' Behaviour?"
  subtitle: "Common toddler behaviours decoded · Ages 2–4"
  intro: >-
    Most behaviour we call 'naughty' at this age is a child learning about their body, the world and their
    own will. Understanding why helps us respond calmly.
  sections:
    - heading: "Climbing"
      items:
        - "Why: building strength, balance and confidence"
        - "Try: a safe climbing spot (cushions, a low climber); 'Feet on the floor; you can climb here.'"
    - heading: "Throwing"
      items:
        - "Why: exploring cause and effect"
        - "Try: soft balls to throw outside; at meals, calmly: 'Food stays on the table. Are you finished?'"
    - heading: "Saying no"
      items:
        - "Why: discovering independence"
        - "Try: two choices, fewer commands; 'Red cup or blue cup?'"
    - heading: "Not listening"
      items:
        - "Why: deep concentration, or too many instructions"
        - "Try: get close, make eye contact, one short instruction"
    - heading: "Biting and hitting"
      items:
        - "Why: big feelings, few words"
        - "Try: 'I won't let you bite.' Teach words: 'Say stop!'"
    - heading: "Learn more"
      text: "The CDC's 'Learn the Signs. Act Early.' milestones show what's typical at each age."
  sources:
    - label: "CDC: Learn the Signs. Act Early. (developmental milestones)."
      url: "https://www.cdc.gov/ncbddd/actearly/milestones/"
