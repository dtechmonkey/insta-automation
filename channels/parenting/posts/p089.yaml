caption: |
  Cold, foggy or rainy days stuck indoors? Sensory play keeps little hands busy and minds calm. 🌫️

  5 easy ideas:
  🍚 A rice tray with scoops and cups
  🫓 Homemade atta play dough
  💧 Warm water play with sponges
  🧶 A texture basket: wool, silk, stone, paper
  🧊 Ice painting with frozen coloured water

  A mat or towel underneath, and supervise little ones who still mouth things. 🌿

  Which one will you try this week? 👇
