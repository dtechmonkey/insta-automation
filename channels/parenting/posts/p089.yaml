printable:
  title: "15 Indoor Sensory Activities"
  subtitle: "For cold or rainy days · Ages 2–4"
  intro: "Sensory play builds focus, fine motor skills and language. Most activities use things you already have."
  sections:
    - heading: "Dry trays"
      items:
        - "Rice with scoops and cups"
        - "Chana and moong with spoons"
        - "Oats with toy animals to bury"
    - heading: "Wet play"
      items:
        - "Warm water with sponges and cups"
        - "Washing toy animals with a brush"
        - "Ice painting"
        - "Bubbles in a tub"
    - heading: "Dough and squish"
      items:
        - "Atta play dough"
        - "Cooked noodles to squish (taste-safe)"
        - "Shaving foam on a tray (age 3+)"
    - heading: "Touch and listen"
      items:
        - "Texture basket"
        - "Sound shakers (sealed bottles with dal, rice, pebbles)"
        - "Mystery bag: guess the object by touch"
    - heading: "Safety"
      text: "Supervise closely, use taste-safe materials for children who mouth objects, and keep water play on a towel."
  sources:
