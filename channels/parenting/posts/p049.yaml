topic: "Practical life · age 2–3"
keyword: SOCKS
slides:
  - kind: cover
    title: "Matching socks: the laundry job toddlers *love*"
    body: ""
    prompt: >-
      A 2-year-old South Asian boy sitting on a bed beside a pile of clean laundry, holding up two matching
      striped socks with a delighted face, his mother folding clothes nearby. Keep the figures in the lower 60%
      of the frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "Find the *pairs*"
    body: "Start with 3–4 very different pairs. Matching is a thinking skill."
    prompt: >-
      Top-down view of a few colourful children's socks laid out on a bed in a messy row, small hands holding two
      matching yellow socks. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft
      peach watercolor wash, reserved for text.
  - kind: tip
    title: "*Whose* is it?"
    body: "Sort by family member: Papa's big socks, my small socks."
    prompt: >-
      A 3-year-old South Asian girl sorting socks into piles labelled only by size, holding a big sock against
      her tiny foot and laughing. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty,
      soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "Roll and *put away*"
    body: "Show how to fold a pair over. Into their own drawer."
    prompt: >-
      A 2-year-old South Asian boy placing a rolled pair of socks into a low open drawer. Keep the child in the
      lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash, reserved for text.
  - kind: outro
    title: "A real job for a *real* helper."
    body: "Does your toddler help with laundry?"
    prompt: >-
      A happy South Asian father and his 2-year-old daughter folding laundry together on a bed, the child wearing
      a sock on her hand like a puppet. Keep the figures in the lower 55% of the frame. Leave the top 40% as an
      empty, soft sage-green watercolor wash, reserved for text.
caption: |
  Laundry day = learning day! 🧦

  Matching socks is one of the best early thinking activities: comparing colours, patterns and sizes, and finding what's the same and different. And toddlers love helping with real family jobs.

  Try:
  🧦 Start with 3–4 very different pairs
  👨‍👩‍👧 Sort by family member: big socks, small socks
  🔄 Roll the pairs together
  🗄️ Put them away in their own low drawer

  Does your toddler help with laundry? 👇
