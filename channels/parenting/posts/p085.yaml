keyword: TOAST
slides:
  - kind: cover
    title: "Spreading butter on toast: a *first snack* they make"
    body: ""
    prompt: >-
      A 2-year-old South Asian girl at a low table spreading butter on a slice of toast with a small butter knife,
      tongue out in concentration, a small plate and butter dish beside her. Keep the child in the lower 60% of
      the frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "*Soft* butter"
    body: "Take it out early so it spreads easily. Hard butter tears the bread."
    prompt: >-
      Close view of a small dish of soft butter and a small wooden butter knife on a wooden board. Keep the
      subject in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved
      for text.
  - kind: tip
    title: "Scoop, place, *spread*"
    body: "Show slowly: a little scoop, put it in the middle, spread to the edges."
    prompt: >-
      A father slowly demonstrating spreading butter on toast while his 2-year-old son watches his hands closely.
      Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green watercolor
      wash, reserved for text.
  - kind: tip
    title: "Then *jam* or chutney"
    body: "Same movement, new taste. Let them choose."
    prompt: >-
      A 3-year-old South Asian girl choosing between a small jar of jam and a small bowl of green chutney, a
      slice of toast waiting. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft
      dusty-blue watercolor wash, reserved for text.
  - kind: outro
    title: "*“I made it myself!”*"
    body: "What's your toddler's favourite snack to make?"
    prompt: >-
      A proud 2-year-old South Asian boy holding up a buttered toast with a big bite taken out, grinning. Keep the
      child in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor wash,
      reserved for text.
caption: |
  The simplest snack becomes the proudest one when they make it themselves. 🍞

  Spreading builds wrist control and coordination, plus the confidence of feeding themselves.

  How to:
  🧈 Soft butter (take it out early)
  🔪 A small butter knife
  👀 Show slowly: scoop, place in the middle, spread to the edges
  🍓 Then jam or chutney

  Torn toast is still delicious. 🌿

  What's your toddler's favourite snack to make? 👇
