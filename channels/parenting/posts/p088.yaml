caption: |
  Hired hall, 200 guests, a DJ, a theme… and the birthday child asleep, or crying, by 8 pm. 🎂

  Let's be honest: big parties for 2-year-olds are often more for us and our families. And that's okay! But little ones often find the noise, crowds and late nights overwhelming.

  Ideas:
  🧺 A small family picnic in the park
  🍰 Their favourite food and a simple cake
  🛋️ If it's a big party: a quiet room and an early exit plan
  ⏰ Party during the day, not past bedtime

  Big party or small celebration? Tell us 👇
