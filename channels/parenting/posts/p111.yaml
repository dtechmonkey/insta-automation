  - kind: tip
    title: "Kids are *more capable* than we think"
    body: "Pouring, sweeping, dressing. Given time, they amaze us."
    prompt: >-
      A 2-year-old South Asian girl carefully carrying a small jug of water to a table, proud. Keep the child in
