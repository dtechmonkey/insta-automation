      watercolor wash, reserved for text.
  - kind: outro
    title: "Thank you. *Let's keep trying.*"
    body: "What should we talk about next? Tell us below 💛"
    prompt: >-
      A happy South Asian family waving together from a balcony at sunset, the toddler on her father's hip. Keep
      the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor wash,
      reserved for text.
caption: |
  Eight weeks ago we started Let Me Try with one idea: children can do so much more when we let them try. 🌿

  What we've learned together:
  🫗 Kids are more capable than we think
  💛 Feelings need space, not fixing
  🏡 Old habits can change gently, with respect
  🤝 Parents learn best from each other

  Thank you for every comment, save and share. You made this a community.

  What should we talk about next? Tell us below 💛
hashtags: >-
  #letmetry #montessori #montessoriathome #gentleparenting #parentingcommunity #montessoriindia
  #indianparents #indianmoms #thankyou #positiveparenting #raisingkids #parentingjourney
printable:
  title: "Our Let Me Try Principles"
  subtitle: "A one-page summary of everything we believe · All ages"
  intro: "Eight weeks of ideas, boiled down to a few principles. Print it, stick it up, come back to it on hard days."
  sections:
    - heading: "Our principles"
      items:
        - "Let them try: real work, real tools, real trust."
        - "Slow down: children can't rush, and calm is faster."
        - "Connect before you correct."
        - "Feelings are allowed; hurting isn't."
        - "Fewer things, more attention."
        - "Play is how children learn."
        - "Limits with warmth, not fear."
        - "Every child has their own pace."
        - "Repair matters more than perfection."
        - "You are a good enough parent."
    - heading: "Find every printable"
      text: "All our free printables are on our printables page: the link is in our Instagram bio."
  sources:
    - label: "See each printable for its sources."
