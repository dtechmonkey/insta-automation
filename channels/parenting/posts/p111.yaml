  - kind: tip
    title: "Feelings need *space*, not fixing"
    body: "Name it, stay close, let it pass."
    prompt: >-
      A father sitting calmly with his upset 3-year-old son in a cosy corner, his arm around him. Keep the figures
      in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green watercolor wash, reserved for
      text.
  - kind: tip
    title: "Old habits can *change* gently"
    body: "We can honour our parents and still do some things differently."
    prompt: >-
      A grandmother, a mother and a toddler laughing together at a kitchen table. Keep the figures in the lower
      60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash, reserved for text.
  - kind: tip
    title: "*You* made this community"
    body: "Every comment, save and share helped another parent."
    prompt: >-
      A cosy illustration of many small hands of different sizes placing petals together to form a heart shape on
