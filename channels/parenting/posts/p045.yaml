printable:
  title: "Cutting Practice Sheets"
  subtitle: "Step-by-step scissor skills · Ages 3–4"
  intro: >-
    Draw these lines on paper strips, or print and cut this page into strips. Move to the next level when your
    child is confident.
  sections:
    - heading: "Level 1: Snips"
      items:
        - "Paper strips about 2 cm wide"
        - "One snip = one piece"
        - "Collect pieces in a bowl for a collage"
    - heading: "Level 2: Straight lines"
      items:
        - "Thick lines across wider strips"
        - "Cut from edge to edge"
    - heading: "Level 3: Zig-zags and curves"
      items:
        - "Zig-zag lines"
        - "Gentle wavy lines"
        - "Large circles (cut roughly around them)"
    - heading: "Good grip"
      items:
        - "Thumb on top, fingers below"
        - "Elbow close to the body"
        - "Other hand holds and turns the paper"
    - heading: "Safety"
      text: "Use rounded-tip scissors, always supervise, and teach 'scissors stay on the table'."
  sources:
    - label: "General occupational therapy guidance on scissor-skill development."
