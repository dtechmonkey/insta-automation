id: p045
plan: "D23 1 PM · Practical"
topic: "Fine motor · age 3–4"
keyword: SCISSORS
slides:
  - kind: cover
    title: "First *scissor* skills: a safe start"
    body: ""
    prompt: >-
      A 3-year-old South Asian girl at a low table snipping a strip of coloured paper with small child-safe
      scissors, small paper pieces in a bowl, her concentration intense. Keep the child in the lower 60% of the
      frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "*Child-safe* scissors"
    body: "Small, rounded tips, sized for little hands."
    prompt: >-
      A pair of small, rounded-tip children's scissors resting on a wooden tray next to strips of coloured
      paper. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor
      wash, reserved for text.
  - kind: tip
    title: "*Thumb* on top"
    body: "“Thumb up, like a thumbs-up!” Open, close, open, close."
    prompt: >-
      Close view of a child's hand holding small scissors correctly with the thumb on top, an adult's hand
      gently guiding. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft
      sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "Start with *snips*"
    body: "Narrow paper strips: one snip cuts a piece. Instant success!"
    prompt: >-
      A 3-year-old South Asian boy snipping a narrow paper strip into small pieces that fall into a steel bowl,
      delighted. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue
      watercolor wash, reserved for text.
  - kind: tip
    title: "Then *lines*"
    body: "Straight lines, then zig-zags, then curves."
    prompt: >-
      A 4-year-old South Asian girl cutting along a thick straight line drawn on paper, a sheet with zig-zag
      lines waiting beside her. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft
      peach watercolor wash, reserved for text.
  - kind: outro
    title: "Snip by *snip*."
    body: "Has your child started using scissors yet?"
    prompt: >-
      A proud 3-year-old South Asian boy holding up a bowl full of snipped paper pieces to his smiling mother.
      Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor
      wash, reserved for text.
caption: |
  Scissors and toddlers sound scary, but with the right tools and steps, cutting is a wonderful fine-motor skill. ✂️

  Many children start snipping around age 3. It builds hand strength, coordination and the control they'll later use for writing.

  The steps:
  ✂️ Child-safe scissors with rounded tips
  👍 Thumb on top: “like a thumbs-up!”
  📄 Start with narrow strips: one snip, one piece
  〰️ Then straight lines, zig-zags, curves

  Always supervise, and keep scissors on a tray when not in use. 🌿

  Has your child started using scissors yet? 👇
