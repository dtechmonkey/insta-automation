slides:
  - kind: cover
    title: "Annoying toddler habits that are actually *milestones*"
    body: ""
    prompt: >-
      A 2-year-old South Asian boy pulling all the steel bowls out of a low kitchen cupboard onto the floor while
      his mother watches, amused, holding a cup of chai. Warm humour. Keep the figures in the lower 60% of the
      frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "Emptying every *drawer*"
    body: "Learning about in and out, full and empty."
    prompt: >-
      A 2-year-old South Asian girl sitting surrounded by clothes she pulled out of a low drawer, looking pleased.
      Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash,
      reserved for text.
  - kind: tip
    title: "*“Why? Why? Why?”*"
    body: "A brain making connections at top speed."
    prompt: >-
      A 3-year-old South Asian boy tugging his grandfather's kurta and asking a question, pointing at the sky.
      Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green watercolor
      wash, reserved for text.
  - kind: tip
    title: "The same story, *again*"
    body: "Repetition builds memory and language."
    prompt: >-
      A father reading a very worn picture book to his 2-year-old daughter who is holding up one finger for
      'again'. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue
      watercolor wash, reserved for text.
  - kind: tip
    title: "Copying *everything* you do"
    body: "Imitation is how they learn to be people."
    prompt: >-
      A 3-year-old South Asian girl pretending to talk on a toy phone exactly like her mother talking on her real
      phone beside her. Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: tip
    title: "*Lining up* toys"
    body: "Exploring order, patterns and sorting."
    prompt: >-
      A 2-year-old South Asian boy lying on the floor carefully lining up toy cars in a long row. Keep the child
      in the lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for
      text.
  - kind: outro
    title: "Not a phase to survive. A *stage* to see."
    body: "Which one is happening at your house? 😄"
    prompt: >-
      A South Asian mother sitting on the floor of a messy living room laughing and hugging her toddler. Keep
      the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor wash,
      reserved for text.
caption: |
  The habits that drive us mad are often signs of a brain growing exactly as it should. 😄

  📦 Emptying every drawer → learning in, out, full, empty
  ❓ “Why? Why? Why?” → making connections
  📖 The same story again → building memory and language
  🪞 Copying everything → learning how to be a person
  🚗 Lining up toys → exploring order and patterns

  It's not a phase to survive. It's a stage to see. 🌿

  (Most of these are typical. If you have concerns about your child's development, talk to your paediatrician.)

  Which one is happening at your house? 👇
