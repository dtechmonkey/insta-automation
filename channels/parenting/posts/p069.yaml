printable:
  title: "Say Yes to the Stage"
  subtitle: "Safe outlets for common toddler urges · Ages 1½–4"
  intro: "When a child has a strong urge (to empty, climb, throw), give them a safe place to do it."
  sections:
    - heading: "Urge: emptying and filling"
      items:
        - "Give them one 'yes' drawer full of safe steel bowls and lids."
        - "Offer filling games: pouring, spooning, posting coins in a box."
    - heading: "Urge: asking why"
      items:
        - "Answer simply, or say 'Let's find out!'"
        - "Ask back: 'Why do you think?'"
    - heading: "Urge: repetition"
      items:
        - "Read the same book again; it's working."
        - "Offer a similar new book alongside."
    - heading: "Urge: copying"
      items:
        - "Give real jobs: sweeping, wiping, stirring."
        - "Child-sized versions of your tools."
    - heading: "Urge: lining up"
      items:
        - "Offer sorting and pattern activities."
        - "Join in and name colours and sizes."
  sources:
    - label: "General early-childhood guidance; see the CDC milestone checklists for typical development."
