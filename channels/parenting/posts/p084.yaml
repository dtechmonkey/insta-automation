topic: "Fortnight recap · ages 2–4"
keyword: RECAP3
slides:
  - kind: cover
    title: "6 weeks in: 5 ideas *worth saving*"
    body: ""
    prompt: >-
      A cosy winter living room in an Indian home, a 3-year-old South Asian girl doing a threading activity on a
      rug, a soft blanket and a cup of chai nearby. Keep the scene in the lower 60% of the frame. Leave the top
      35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "No tuition at *3*"
    body: "Play is their study."
    prompt: >-
      Two South Asian 3-year-olds building a block tower together on a rug, laughing. Keep the figures in the
      lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved for text.
  - kind: tip
    title: "Sounds before the *ABC*"
    body: "Play 'I spy' with sounds."
    prompt: >-
      A mother and her 3-year-old son playing I spy, the boy pointing at a mango. Keep the figures in the lower
      60% of the frame. Leave the top 35% as an empty, soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "Swap *“Hurry up!”*"
    body: "Warn ahead, make it a game, give a job."
    prompt: >-
      A 3-year-old South Asian girl hopping like a frog to the front door, her father laughing. Keep the figures
      in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash, reserved for
      text.
  - kind: tip
    title: "Drop the *labels*"
    body: "“She likes to watch first” instead of “She's shy.”"
    prompt: >-
      A 3-year-old girl slowly approaching a group of children at a park with her mother's encouragement. Keep the
      figures in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved
      for text.
  - kind: tip
    title: "Let lefties be *lefties*"
    body: "Support, don't switch."
    prompt: >-
      A 3-year-old South Asian boy drawing happily with his left hand. Keep the child in the lower 60% of the
      frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: outro
    title: "Thank you for being *here*."
    body: "Which idea changed something in your home? 💛"
    prompt: >-
      A South Asian family wrapped in a blanket together on a sofa, the toddler in the middle, warm lamp light.
      Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor
      wash, reserved for text.
caption: |
  Six weeks of Let Me Try! 🌿 Five favourites from this fortnight:

  📚 No tuition at 3: play is their study
  👂 Sounds before the ABC song
  🐸 Swap “Hurry up!” for warnings, games and jobs
  🏷️ Drop the labels
  ✍️ Let lefties be lefties

  Which idea changed something in your home? Tell us 💛

  New here? Follow for 2 Montessori ideas every day.
