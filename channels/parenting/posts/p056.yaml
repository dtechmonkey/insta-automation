slides:
  - kind: cover
    title: "5 ideas worth *saving* from the festive fortnight"
    body: ""
    prompt: >-
      A cosy Indian living room after the festival, a few diyas on the shelf, and a 3-year-old South Asian boy
      happily doing a spooning activity at a low table. Keep the scene in the lower 60% of the frame. Leave the
      top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "Tantrums aren't *manipulation*"
    body: "Stay calm, keep them safe, connect after."
    prompt: >-
      A mother sitting calmly beside her upset 2-year-old on a rug, a hand gently on her back. Keep the figures
      in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved for
      text.
  - kind: tip
    title: "Offer a *namaste*"
    body: "No forced hugs. Let them choose how to greet."
    prompt: >-
      A 3-year-old South Asian girl doing namaste to a smiling elderly relative. Keep the figures in the lower
      60% of the frame. Leave the top 35% as an empty, soft sage-green watercolor wash, reserved for text.
  - kind: tip
    title: "Mother tongue *first*"
    body: "Speak the language you speak best."
    prompt: >-
      A grandmother reading a picture book to a toddler on her lap, both pointing at the pictures. Keep the
      figures in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue watercolor wash,
      reserved for text.
  - kind: tip
    title: "Swap *“Be careful!”*"
    body: "“That rock is wobbly. Where will your foot go?”"
    prompt: >-
      A 3-year-old South Asian boy carefully balancing on a low wall in a park, his father walking alongside.
      Keep the figures in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash,
      reserved for text.
  - kind: tip
    title: "Self-feeding, step by *step*"
    body: "Hand over the spoon gradually."
    prompt: >-
      A 3-year-old South Asian girl eating by herself with a small spoon at a family table, proud. Keep the child
      in the lower 60% of the frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for
      text.
  - kind: outro
    title: "Thank you for *growing* with us."
    body: "Which idea will you try this week? 💛"
    prompt: >-
      A South Asian family relaxing together on a rug with their toddler, everyone smiling, warm evening light.
      Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft sage-green watercolor
      wash, reserved for text.
caption: |
  Four weeks of Let Me Try! 🌿 Here are 5 favourites from our festive fortnight:

  😤 Tantrums aren't manipulation: stay calm, connect after
  🙏 Offer a namaste instead of forced hugs
  🗣️ Mother tongue first won't hurt their English
  🌳 Swap “Be careful!” for specific words
  🥄 Hand over the spoon, step by step

  Which idea will you try this week? 💛

  New here? Follow for 2 Montessori ideas every day.
