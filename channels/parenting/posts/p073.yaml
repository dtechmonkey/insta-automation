caption: |
  By 3, many children are ready for real kitchen tools, with close supervision. 🍋

  3 skills to try:
  🧀 Grating paneer or cheese (adult hand steadying the grater)
  🍋 Squeezing lemons with a hand squeezer
  🥪 Spreading chutney with a butter knife

  Then put it together: chutney sandwiches and nimbu pani, made by them for the whole family! 🌿

  Which skill will you try first? 👇
hashtags: >-
  #cookingwithkids #practicallife #montessori #montessoriathome #toddlerinthekitchen #montessoriindia
