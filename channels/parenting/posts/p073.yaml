printable:
  title: "3-Year-Old Kitchen Skills"
  subtitle: "With a snack recipe they can make · Ages 3–4"
  intro: "These skills build hand strength and confidence. Always supervise, and keep sharp tools and the stove with adults."
  sections:
    - heading: "Skills"
      items:
        - "Grating: paneer or cheese, adult hand on the grater"
        - "Squeezing: lemons or oranges with a hand squeezer"
        - "Spreading: chutney, butter or jam with a butter knife"
        - "Stirring: mixing in a big bowl"
        - "Pouring: water into glasses"
    - heading: "Recipe: chutney sandwiches"
      items:
        - "Spread butter on two slices of bread"
        - "Spread green chutney on one slice"
        - "Add grated paneer"
        - "Press together, adult cuts into squares"
    - heading: "Recipe: nimbu pani"
      items:
        - "Squeeze 1 lemon into a jug"
        - "Add 2 glasses of water, 2 teaspoons of sugar, a pinch of salt"
        - "Stir and pour"
    - heading: "Safety"
      text: "Graters can scrape fingers: grate large pieces only, with an adult holding the grater."
  sources:
    - label: "Montessori, M. The Discovery of the Child (practical life: food preparation)."
