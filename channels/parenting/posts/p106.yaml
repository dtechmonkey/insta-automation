caption: |
  Lost your temper. Too much screen time. Missed a school event. Ordered food again. 😔

  Parent guilt is real. But here's the truth: children don't need perfect parents. They need parents who love them, show up, and repair when things go wrong.

  Researchers even have a name for it: the 'good enough' parent.

  You're doing better than you think. 💛

  Send this to a parent who needs to hear it 👇
hashtags: >-
  #momguilt #dadguilt #parentguilt #goodenoughparent #gentleparenting #indianparents #indianmoms
  #workingmom #momlife #mentalhealth #letmetry #selfcompassion
printable:
  title: "A Self-Compassion Card for Parents"
  subtitle: "For the hard days · All ages"
  intro: "Keep this card in your phone case or on the fridge. Read it on the days you feel you're failing."
  sections:
    - heading: "Remember"
      items:
        - "Children need 'good enough', not perfect."
        - "Repair matters more than never making mistakes."
        - "Your child's behaviour is not a report card on you."
        - "Rest is not a reward. It's a need."
        - "Asking for help is a strength."
    - heading: "When guilt hits, ask"
      items:
        - "Is my child safe, fed and loved? Then today was enough."
        - "What would I say to a friend in my place?"
        - "What's one small thing I can do differently tomorrow?"
    - heading: "Get support"
      text: "If you feel low most days, can't sleep or feel hopeless, please talk to a doctor or counsellor. Parents deserve care too."
  sources:
    - label: "Winnicott, D. W. (1953). Transitional objects and transitional phenomena. International Journal of Psycho-Analysis, 34, 89–97 (the 'good enough mother')."
