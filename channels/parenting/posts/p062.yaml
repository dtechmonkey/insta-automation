caption: |
  In many Indian homes, toddlers sleep at 11 pm on weekends, after the family dinner and the late visitors. But is it worth it? 🌙

  Research finds regular bedtimes help young children sleep better, and irregular bedtimes have been linked with more behaviour difficulties. In one large study, children's behaviour improved when their bedtimes became regular.

  A realistic approach:
  ⏰ Keep bedtime within 30–60 minutes of the usual time
  🛁 Keep the routine, even if it's later
  ☀️ After a late night: quiet morning, early nap, early bedtime

  Agree or disagree? 👇

  (General information, not medical advice.)
