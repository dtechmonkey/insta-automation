printable:
  title: "Consistent Sleep, Realistically"
  subtitle: "Bedtimes for busy families · Ages 1–5"
  medical: true
  intro: "Perfect consistency isn't possible in real family life. Aim for 'mostly regular', and protect the day after a late night."
  sections:
    - heading: "What the research found"
      items:
        - "Children with irregular bedtimes had more behaviour difficulties, which improved when bedtimes became regular (Kelly, Kelly & Sacker, 2013)."
        - "Consistent bedtime routines are linked to better sleep in young children (Mindell et al., 2015)."
    - heading: "How much sleep (in 24 hours, including naps)"
      items:
        - "1–2 years: 11–14 hours"
        - "3–5 years: 10–13 hours"
    - heading: "Realistic rules"
      items:
        - "Bedtime within 30–60 minutes of usual, most nights"
        - "Same routine even when it's late"
        - "Wake-up time roughly steady"
    - heading: "After a late night"
      items:
        - "A slow, quiet morning"
        - "An earlier or longer nap"
        - "An early bedtime"
  sources:
    - label: "Kelly, Y., Kelly, J., & Sacker, A. (2013). Changes in bedtime schedules and behavioral difficulties in 7 year old children. Pediatrics, 132(5), e1184–e1193."
    - label: "World Health Organization (2019). Guidelines on physical activity, sedentary behaviour and sleep for children under 5 years of age."
