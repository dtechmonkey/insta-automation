caption: |
  “Finish your plate, food shouldn't be wasted.” Most of us grew up hearing this. But for little kids, it can backfire. 🍽️

  Children are born with a good sense of when they're full. Pressure to “eat one more bite” teaches them to override that signal. In a classic study, children trained to clean their plates paid less attention to their own fullness.

  Feeding experts recommend a simple split:
  👩 Parents decide WHAT, WHEN and WHERE
  🧒 Children decide WHETHER and HOW MUCH

  Serve small portions (less waste!), allow seconds, and keep calm when they stop early. Over a week, it balances out.

  Were you made to finish your plate as a kid? 👇

  (General information, not medical advice. Talk to your paediatrician about any concerns over weight or growth.)
