printable:
  title: "The Division of Responsibility in Feeding"
  subtitle: "Calmer mealtimes, less pressure · Ages 2–4"
  medical: true
  intro: >-
    Feeding battles leave everyone stressed. The 'division of responsibility' gives parents and children each
    a clear job, and takes the pressure off.
  sections:
    - heading: "What the research found"
      items:
        - "Children rewarded for cleaning their plates became less responsive to their own fullness cues (Birch et al., 1987)."
        - "Dietitian Ellyn Satter's 'division of responsibility' is widely used by feeding specialists to reduce mealtime conflict."
    - heading: "Your job (parent)"
      items:
        - "Decide what food is served"
        - "Decide when meals and snacks happen (about every 2–3 hours)"
        - "Decide where: at the table, together, without screens"
        - "Include at least one food your child usually eats"
    - heading: "Their job (child)"
      items:
        - "Decide whether to eat"
        - "Decide how much to eat"
    - heading: "Things to avoid"
      items:
        - "“One more bite” and bribing with dessert"
        - "Praising a clean plate"
        - "Cooking a separate meal every time they refuse"
    - heading: "Things that help"
      items:
        - "Small portions, seconds allowed (less waste, too)"
        - "Eating together and enjoying your own food"
        - "Offering new foods many times, without pressure"
        - "Ending the meal calmly when they're done"
    - heading: "When to check"
      text: >-
        If your child is losing weight, has very few accepted foods, or meals involve choking or vomiting,
        speak to your paediatrician.
  sources:
    - label: "Birch, L. L., McPhee, L., Shoba, B. C., Steinberg, L., & Krehbiel, R. (1987). 'Clean up your plate': Effects of child feeding practices on the conditioning of meal size. Learning and Motivation, 18(3), 301–317."
    - label: "Ellyn Satter Institute: The Division of Responsibility in Feeding."
      url: "https://www.ellynsatterinstitute.org/"
