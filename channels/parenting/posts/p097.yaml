printable:
  title: "Create a 'Yes' Home: Room-by-Room Checklist"
  subtitle: "A prepared environment · Ages 1–4"
  intro: "Walk through your home at your child's eye level. What can they reach, use and put away by themselves?"
  sections:
    - heading: "Entrance"
      items:
        - "A low hook for their bag and jacket"
        - "A small stool for putting on shoes"
        - "A basket for their shoes"
    - heading: "Kitchen"
      items:
        - "A low drawer with their plate, cup and spoon"
        - "A step stool or learning tower"
        - "A small jug of water they can pour from"
    - heading: "Living room"
      items:
        - "One low shelf with 6–8 toys"
        - "A few books facing out"
        - "Breakables moved up high"
    - heading: "Bathroom"
      items:
        - "A step stool at the sink"
        - "A low towel hook"
        - "Their toothbrush within reach"
    - heading: "Bedroom"
      items:
        - "A low bed or mattress"
        - "Two outfit choices on a low shelf"
  sources:
    - label: "Montessori, M. The Absorbent Mind (the prepared environment)."
