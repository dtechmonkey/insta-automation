slides:
  - kind: cover
    title: "What a *“yes” home* looks like"
    body: ""
    prompt: >-
      A calm, child-friendly Indian living room: low shelves with a few toys, a small table and chair, a low
      hook with a jacket, a 2-year-old South Asian girl freely choosing a book. Keep the scene in the lower 60% of
      the frame. Leave the top 35% as an empty, soft cream watercolor wash, reserved for text.
  - kind: tip
    title: "They can *reach*"
    body: "Cups, books, shoes, towels at their height. Fewer 'help me's."
    prompt: >-
      A 2-year-old South Asian boy taking a small steel cup from a low kitchen drawer by himself. Keep the child
      in the lower 60% of the frame. Leave the top 35% as an empty, soft peach watercolor wash, reserved for
      text.
  - kind: tip
    title: "They can *choose*"
    body: "A few toys on display, not a toy mountain."
    prompt: >-
      A 3-year-old South Asian girl kneeling in front of a low shelf, deciding between a puzzle and a basket of
      blocks. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft sage-green
      watercolor wash, reserved for text.
  - kind: tip
    title: "It's *safe* to explore"
    body: "Breakables and dangers out of reach, so you say no less."
    prompt: >-
      A 2-year-old South Asian boy exploring a living room freely, cabinet locks on low cupboards, breakables on
      high shelves. Keep the child in the lower 60% of the frame. Leave the top 35% as an empty, soft dusty-blue
      watercolor wash, reserved for text.
  - kind: tip
    title: "It's *their* home too"
    body: "A small chair, a hook, a shelf. Little signs that they belong."
    prompt: >-
      A small wooden chair and a low hook with a little bag beside a family's front door, a toddler hanging up
      her bag. Keep the subject in the lower 60% of the frame. Leave the top 35% as an empty, soft peach
      watercolor wash, reserved for text.
  - kind: outro
    title: "Fewer no's. More *“let me try!”*"
    body: "What's one change you could make this week?"
    prompt: >-
      A happy 2-year-old South Asian girl pouring her own water at a small table in a calm living room, her
      mother reading nearby. Keep the figures in the lower 55% of the frame. Leave the top 40% as an empty, soft
      sage-green watercolor wash, reserved for text.
caption: |
  If you're saying “No, don't touch!” all day, the problem might not be your child. It might be the space. 🏡

  A 'yes' home (Montessori calls it a prepared environment) is arranged so children can reach, choose and explore safely.

  ✋ Things they need are within reach
  🧸 A few toys on display, not a toy mountain
  🔒 Breakables and dangers out of reach
  🪑 Small signs they belong: a chair, a hook, a shelf

  Fewer no's. More “let me try!” 🌿

  What's one change you could make this week? 👇
