printable:
  title: "Milestone Ranges: What's Typical"
  subtitle: "Wide normal ranges, and when to check · Ages 0–3"
  medical: true
  intro: "Milestones are guides, not deadlines. Healthy children reach them at different times."
  sections:
    - heading: "What the research found"
      items:
        - "In a study of healthy children, the age of reaching infant motor milestones had little value in predicting later intelligence or motor skills (Jenni et al., 2013)."
    - heading: "Typical ranges (approximate)"
      items:
        - "Sitting without support: about 5–9 months"
        - "Crawling: about 6–11 months (some babies skip it)"
        - "Walking: about 9–18 months"
        - "First words: about 10–15 months"
        - "Two-word phrases: about 18–24 months"
    - heading: "Talk to a doctor if"
      items:
        - "Not walking by about 18 months"
        - "No words by about 16 months"
        - "No two-word phrases by about 2 years"
        - "Losing skills they had"
        - "Anything that worries you"
    - heading: "Learn more"
      text: "The CDC's 'Learn the Signs. Act Early.' checklists are a helpful guide."
  sources:
    - label: "Jenni, O. G., Chaouch, A., Caflisch, J., & Rousson, V. (2013). Infant motor milestones: Poor predictive value for outcome of healthy children. Acta Paediatrica, 102(4), e181–e184."
    - label: "CDC: Learn the Signs. Act Early."
      url: "https://www.cdc.gov/ncbddd/actearly/milestones/"
