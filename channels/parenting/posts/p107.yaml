caption: |
  No stove, no knives: just measuring, mixing and rolling. No-cook ladoos are the perfect cooking project for little ones. 🟤

  The steps:
  🥄 Measure: cups and spoons (early maths!)
  🤲 Mix with clean hands
  ⚪ Roll small balls and count them
  🥥 Coat in coconut and share

  Grab today's printable for the full recipe. 🌿

  What's your family's favourite ladoo? 👇
hashtags: >-
  #cookingwithkids #ladoo #practicallife #montessori #montessoriathome #healthysnacks #montessoriindia
  #3yearold #indianmoms #kidsrecipes #letmetry #earlymaths
printable:
  title: "No-Cook Date and Oat Ladoos"
  subtitle: "A recipe little hands can make · Ages 3–4"
  intro: "A simple, no-stove recipe that practises measuring, mixing, rolling and counting. Makes about 12 small ladoos."
  sections:
    - heading: "Ingredients"
      items:
        - "1 cup soft dates, pitted (adult chops or blends them first)"
        - "1 cup oats (lightly roasted by an adult, or quick oats)"
        - "2 tablespoons peanut butter or ghee"
        - "Desiccated coconut for rolling"
    - heading: "Steps"
      items:
        - "Measure the oats into a big bowl"
        - "Add the date paste and peanut butter"
        - "Mix and squish with clean hands"
        - "Roll small balls between the palms"
        - "Roll each ball in coconut"
        - "Count them onto a plate and share"
    - heading: "Learning along the way"
      items:
        - "Measuring and counting"
        - "Hand strength from squishing and rolling"
        - "Following steps in order"
    - heading: "Allergy note"
      text: "Swap peanut butter for ghee if anyone has a nut allergy. Whole nuts are a choking risk for young children."
  sources:
    - label: "A Let Me Try family recipe."
