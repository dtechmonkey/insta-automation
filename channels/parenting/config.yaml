# Channel: Let Me Try — Montessori & gentle parenting (pre-written posts from posts/, images from images/)
name: "Let Me Try"
handle: "@letmetry.montessori"
timezone: "Asia/Kolkata"

publish_times: ["13:00", "19:30"]   # IST; add "21:30" for a third daily post
start_date: "2026-10-17"            # no posts before this day

# Prefixed to every slide's Gemini prompt (a post may override with its own `style:`)
image_style: >-
  Soft watercolor illustration in a gentle children's picture-book style. Pastel palette of sage green,
  soft peach, warm cream and dusty blue. Visible paper texture, loose soft brush edges, light washes,
  warm natural light. Calm, airy, uncluttered composition. Portrait orientation, 4:5 aspect ratio.
  Absolutely no text, letters, numbers, captions, logos or watermarks anywhere in the image.

hashtags_max: 12

# Last slide + caption call to action for the free printable:
#   comment: "Comment KEYWORD ↓" (the comment bot replies, pointing to the bio link)
#   bio:     "Free printable · link in bio" (no comment bot needed)
cta_mode: comment
printables_url: "https://dtechmonkey.github.io/insta-automation/printables/"   # put this in the Instagram bio
story: true               # also share each post's cover as a "New post" Story
low_queue_days: 3          # open a GitHub issue when fewer days of ready posts remain

reels:                     # one a day from reels/bank.yaml; .github/workflows/parenting-reel.yml starts 30 min early
  publish_time: "08:30"    # IST; the busiest window for top India-focused reels. Retest once boosts give real reach
  story: true              # also share the same video to the Story
  share_to_feed: true      # also show it in the grid and feed
  cover_ms: 1000           # cover frame, once the hook text has faded in
  low_bank_days: 3         # open a GitHub issue when fewer ready Reels remain

brand:
  cream: "#FBF6EE"
  ink: "#3D3A35"          # body text
  ink_soft: "#6B655C"
  sage: "#8FA98B"
  peach: "#E9B79A"
  terracotta: "#C07A5A"   # *highlighted* words
  dusty_blue: "#9DB4C8"

instagram:
  api_version: "v23.0"
