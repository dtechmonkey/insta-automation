# Reel bank: run_posts.py --reel posts the first entry that isn't in history.json, once a day at
# config.yaml's reels.publish_time, then shares the same video to the Story.
# `folder` holds reel.mp4. An entry with `hold` is skipped until the line is removed.
# Captions leave out the comment line: build_caption adds "Comment KEYWORD and...", which the comment bots look for.
- id: r003
  folder: r003-ill-do-it
  keyword: ALONE
  caption: >-
    Ten minutes earlier is often the whole difference. Not every morning, and that's okay. Letting her try
    doesn't mean hot pans or roads. It means the safe jobs she's ready for.
  hashtags: "#toddlerindependence #montessoriathome #parentingtips #indianparents #letmetry"
- id: r021
  folder: r021-ziddi
  keyword: CALM
  caption: >-
    Send this to the next person who calls her ziddi. If tantrums get worse after 4, or she hurts herself or
    others, speak to your paediatrician.
  hashtags: "#toddlertantrums #gentleparenting #indianparenting #parentingtips #letmetry"
- id: r013
  folder: r013-dadi
  keyword: BORED
  caption: >-
    New ideas and Dadi agree more often than we think. Tag your family's Dadi, and tell us the best thing she
    taught you.
  hashtags: "#grandparents #simpleplay #montessoriathome #indianfamily #letmetry"
- id: r012
  folder: r012-whose-bed
  keyword: BEDTIME
  caption: >-
    Who has this tiny fighter at home? Tired nights pass, and the hugs are what you'll remember. Send this to
    the one on the floor.
  hashtags: "#toddlersleep #bedtimeroutine #parenting #indianparents #letmetry"
- id: r025
  folder: r025-sorry
  keyword: SORRY
  caption: माफ़ी कमज़ोरी नहीं है।
  hashtags: "#hindiparenting #indianparents #gentleparenting #mindfulparenting #letmetry"
- id: r007
  folder: r007-he-hit-her
  keyword: GENTLE
  caption: >-
    Comfort the hurt child first, then speak to the other one with a short, firm line. Forced sorrys rarely
    teach much at 2 or 3. If hitting is severe or doesn't ease with time, speak to your paediatrician.
  hashtags: "#toddlerbehavior #gentleparenting #positiveparenting #indianparents #letmetry"
- id: r030
  folder: r030-pencil
  keyword: ROTI
  caption: >-
    Save this for today. Under 4: stay close, because small dough pieces, peg springs and paper can go in the
    mouth.
  hashtags: "#prewritingskills #finemotorskills #montessoriathome #toddleractivities #letmetry"
- id: r010
  folder: r010-ladke-rote-nahi
  keyword: CRY
  caption: >-
    Most of us heard this growing up, and it was meant kindly. Naming a feeling is one small thing you can do
    instead.
  hashtags: "#raisingboys #emotionalintelligence #gentleparenting #indianparents #letmetry"
- id: b01
  folder: b01-reading
  keyword: WORDS
  caption: >-
    Reading starts long before letters. Ten minutes a day of sounds, rhymes and stories builds the ear for it.
    Save this for today.
  hashtags: "#earlyreading #prereadingskills #montessoriathome #toddleractivities #letmetry"
- id: r008
  folder: r008-give-it
  keyword: SHARE
  caption: >-
    Being ready to share comes slowly, and estimates vary, often around 3 to 4 years. Taking turns is the
    easier first step.
  hashtags: "#toddlerbehavior #gentleparenting #socialskills #indianparents #letmetry"
- id: b04
  folder: b04-scissors
  keyword: ROTI
  caption: >-
    Strong little hands come first. Five minutes each is enough. Under 4, stay close, because dough, cotton and
    pegs can go in the mouth.
  hashtags: "#finemotorskills #prewritingskills #montessoriathome #toddleractivities #letmetry"
- id: r006
  folder: r006-leaving-park
  keyword: CALM
  caption: >-
    He may still cry. Warning him first and letting him choose something small usually makes it easier, not
    perfect.
  hashtags: "#gentleparenting #toddlertantrums #parentingtips #indianparents #letmetry"
- id: b05
  folder: b05-school
  keyword: ALONE
  caption: >-
    School readiness starts at home, with small things she can do and the same calm goodbye every day. It won't
    be perfect, and that's okay.
  hashtags: "#schoolreadiness #preschool #montessoriathome #toddlerindependence #letmetry"
- id: r031
  folder: r031-parrot
  keyword: ALONE
  caption: >-
    "Laa, main kar deti hoon" comes from love. But every small job we take over is one they don't get to
    learn. Let them try, even when it's slow and messy. Which line did you hear most growing up?
  hashtags: "#letmetry #toddlerindependence #montessoriathome #indianparents #gentleparenting"
- id: r004
  folder: r004-one-more-bite
  keyword: KHANA
  caption: >-
    The phone works, which is why almost all of us have used it. If you want to step away from it, go slowly,
    one meal at a time.
  hashtags: "#toddlermeals #screentime #parentingtips #indianmoms #letmetry"
- id: b12
  folder: b12-focus
  keyword: POUR
  caption: >-
    Focus isn't taught by asking her to sit still. It grows with one job at a time and an adult who doesn't
    interrupt. Under 4: stay close with water and beads.
  hashtags: "#concentration #montessoriathome #practicallife #toddleractivities #letmetry"
- id: r027
  folder: r027-shouted
  keyword: SORRY
  caption: Send this to a parent having that kind of day.
  hashtags: "#momguilt #gentleparenting #parentingtips #indianmoms #letmetry"
- id: r005
  folder: r005-spill
  keyword: POUR
  caption: >-
    Keep a small cloth where she can reach it. It'll be slower for a few weeks. Always stay close when a child is
    using water.
  hashtags: "#practicallife #montessoriathome #toddleractivities #indianmoms #letmetry"
- id: r009
  folder: r009-poem
  keyword: WORDS
  caption: >-
    Honest question: should children have to perform for guests? Everyone in this scene means well. Tell us what
    happens in your home.
  hashtags: "#shychild #gentleparenting #indianparenting #parentingtips #letmetry"
- id: r017
  folder: r017-throwing-food
  keyword: PLATE
  caption: >-
    It feels personal, but it's usually an experiment. Offer food in safe sizes and sit with her while she eats.
  hashtags: "#toddlermeals #toddlerbehavior #montessori #parentingtips #letmetry"
- id: r018
  folder: r018-nahi
  keyword: TODDLER
  caption: Save this for the next "nahi".
  hashtags: "#terribletwos #toddlerbehavior #gentleparenting #indianmoms #letmetry"
- id: r022
  folder: r022-good-girl
  keyword: PRAISE
  caption: You don't have to ban "good girl". Just add what she did.
  hashtags: "#positiveparenting #growthmindset #childdevelopment #parentingtips #letmetry"
- id: r011
  folder: r011-riya
  keyword: COMPARE
  caption: >-
    Children grow at different speeds. If her speech worries you, ask your paediatrician. That's a much better use
    of the worry than comparing.
  hashtags: "#toddlerdevelopment #positiveparenting #parentingtips #indianmoms #letmetry"
- id: r033
  folder: r033-poem-en
  keyword: POUR
  caption: >-
    Every spill was practice. Every wrong shoe was a first try.


    The patience you give them today becomes the steady hands they hold you with tomorrow.


    So when they say "let me try"... let them. 🤍
  hashtags: "#LetMeTry #ParentingPoem #GentleParenting #PositiveParenting #IndianParents #Montessori #ToddlerIndependence #ParentingReels #MomLife #DadLife #RaisingKids"
- id: pp01
  folder: pp01-nani-ginti
  keyword: ALONE
  caption: >-
    Bachchi shy hai… ya shy banayi gayi hai? 🤔


    Hum madad karna chahte hain. Project hum bana dete hain, doctor ko jawab hum de dete hain, park mein ladaai hum
    kar lete hain… Par bachcha har baar ek hi baat sunta hai: "tumse nahi hoga."


    Nani ka ek simple rule 👇

    Agli baar se... let them try.

    Aur bachche ke paas baith ke bolo: "Wave karogi, ya bas ek smile? Main yahin hoon." 🤍


    Aapke ghar mein sabse zyada kaun "help" karta hai? Comment mein batao 💬

    Save karo, aur us maa ko bhejo jise aaj yeh sunna chahiye ❤️
  hashtags: "#LetMeTry #MishtiAndMumma #ParentingTips #GentleParenting #IndianParents #ConfidentKids #ParentingReels #MomLife #NaniKiBaat #ChildConfidence #PositiveParenting"
- id: pp02
  folder: pp02-kyunki-maine-kaha
  keyword: ALONE
  caption: >-
    "Kyun?" poochhna badtameezi hai… ya samajhdaari? 🤔


    "Kyunki maine kaha" — humne bhi suna tha, ab hum bhi bolte hain.


    Par jo bachcha shaanti se "kyun?" poochhta hai, woh badtameez nahi hai. Woh soch raha hai.

    Nani ka rule 👇

    Reason do. Limit wahi rakho, bas samjhao. Aur agar reason hi nahi mil raha… toh shayad "haan" bol do. 🤍


    Aapke bachpan mein kaunsi baat "kyunki maine kaha" pe khatam hoti thi? Comment mein batao 💬

    Follow karo Mishti aur Mumma ki agli kahani ke liye, aur us dost ko bhejo jiske ghar mein abhi bhi "kyunki maine kaha" chalta hai ❤️


    Kahani kaalpanik hai, chitra AI se bane hain.
  hashtags: "#LetMeTry #MishtiAndMumma #ParentingTips #GentleParenting #IndianParents #CuriousKids #ParentingReels #MomLife #NaniKiBaat #RespectfulParenting #PositiveParenting"
- id: pp03
  folder: pp03-wahi-awaaz
  keyword: SORRY
  caption: >-
    Bachche pe chillayi… aur apni Maa ki awaaz sunai di. 💔


    Doodh gira, aur main chillayi. Phir mujhe yaad aaya, yeh shabd mere nahi the. Bachpan mein maine yahi suna tha.


    Jo shabd humne bachpan mein sune, woh gusse mein apne aap nikal aate hain. Yeh hamari galti nahi, par isse rokna
    hamari zimmedari hai.


    Agli baar galti ho jaaye toh 👇

    1. Ruko, ek saans lo.

    2. Bachche ko nahi, galti ko dekho.

    3. "Sorry" bolo, saath mein theek karo, aur use phir se try karne do.


    Agar gussa baar baar control se bahar jaata hai, toh kisi counsellor se baat karna bhi himmat ki baat hai. 🤍


    Aapke bachpan ka kaunsa vaakya aaj bhi aapke muh se nikal jaata hai? Comment mein batao 💬

    Follow karo Mishti aur Mumma ki agli kahani ke liye, aur us dost ko bhejo jo apni Maa jaisi nahi, apne jaisi Maa
    banna chahti hai ❤️


    Kahani kaalpanik hai, chitra AI se bane hain.
  hashtags: "#LetMeTry #MishtiAndMumma #GentleParenting #ParentingTips #IndianParents #GenerationalHealing #MomLife #ParentingReels #NaniKiBaat #PositiveParenting #ConsciousParenting"
