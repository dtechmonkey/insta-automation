# Channel: Your Move — vote-loop story reels (series 1: Platform 13).
# A manual run of stories-reel.yml with dry_run off posts the next part immediately; the 21:00 run then
# skips that day, so the following part goes out the next night at 21:00. Reels only, made in C:\Claude\insta-stories.
# Posts with its own Meta app: secrets IG_USER_ID_STORIES / IG_ACCESS_TOKEN_STORIES.
name: "Your Move"
handle: "@your_move24"
timezone: "Asia/Kolkata"

hashtags_max: 8
cta_mode: none               # no printable line; the caption carries the vote question itself

reels:                       # one part every other day from reels/bank.yaml (user's choice, 13 Nov 2026)
  publish_time: "20:30"      # IST, exact; end cards promise "raat 8:30"
  every_days: 2              # alternate days: 13, 15, 17 Nov...; the days between are free for other posts
  days_from: "2026-11-13"    # a posting day the count starts from
  prepare_minutes: 12        # upload and process first, publish on the minute; a cover.jpg beside reel.mp4 is used
  story: false               # parts run longer than a Story's 60 s limit
  share_to_feed: true
  cover_ms: 1000
  low_bank_days: 1           # open a GitHub issue when no finished part is waiting

ai:                          # comment summaries in the hourly vote report (engine/votes.py)
  models:
    - "gemini-3.8-flash"
    - "gemini-3.7-flash"
    - "gemini-flash-latest"
  fallback_models:
    - "gemini-3.5-flash-lite"

instagram:
  api_version: "v23.0"
