# Story parts: run_posts.py --channel stories --reel posts the first entry that isn't in history.json,
# once a day at config.yaml's reels.publish_time. `folder` holds reel.mp4.
# An entry with `hold: true` is skipped until the line is removed.
# `vote` lists the one-word choices viewers comment; engine/votes.py tallies them hourly into a GitHub issue.
# `vote_aliases` adds other spellings (Hindi script, English) per choice; stretched spellings match on their own.
- id: p13-01
  folder: p13-01
  vote_closed: true                # counting stopped 12 Nov; final BHAAGO 14, BAITHO 6
  vote: [BAITHO, BHAAGO]          # in the end card's order: comments "1" and "2" count as these
  vote_aliases:
    BAITHO: [baith, betho, baitho, बैठो, बैठ, बैठूंगा, sit, board]
    BHAAGO: [bhag, bhago, bhaago, भागो, भाग, run]
  caption: |-
    Sonapur Junction par sirf 12 platform hain… aaj raat 13va khula. 🚉
    Train mein Kabir khud baitha tha. Aur message aaya: "Bahar wala tum nahi ho." 😨

    Agar aap Kabir hote… BAITHO ya BHAAGO? 👇
    Comment mein sirf ek word. Jo zyada, wahi Part 2 banega.
  hashtags: "#platform13 #horrorstory #darawnikahani #hindistory #storytime #hinglish #reels #animation"
- id: p13-02
  folder: p13-02
  vote_closed: true                # voting closed 13 Nov 2 PM; final UTHAO 4, PALTO 0
  vote: [UTHAO, PALTO]             # in the end card's order: comments "1" and "2" count as these
  vote_aliases:
    UTHAO: [utha, uthao, uthaw, uthau, uthaao, uthalo, utha lo, उठाओ, उठा, उठा लो, pick, answer]
    PALTO: [palat, palto, paltho, palat jao, पलटो, पलट, पीछे, turn, peeche]
  caption: |-
    Part 2 · Aapne chuna: BHAAGO. 🏃
    Kabir seedhi par bhaaga… par seedhi khatam hi nahi hui. Upar pahuncha, toh wahi platform 12 tha… saal 2001 mein.
    Phone 1%. Call aa raha hai: "Kabir". Aur peeche se, usi ki awaaz. 😨

    Call utha le, ya peeche palat kar dekh le? Votes decide karenge Part 3.
    Part 1 profile par hai.
  hashtags: "#platform13 #horrorstory #darawnikahani #hindistory #storytime #hinglish #reels #animation"
- id: p13-03
  folder: p13-03
  vote: [BAITHO, UTRO]             # end-card order: 1 = BAITHO (2:57 ki gaadi mein baitho), 2 = UTRO (seedhi se neeche utro)
  vote_aliases:                    # verbs only: "gaadi", "train", "seedhi" turn up in ordinary comments
    BAITHO: [baitho, baith, beitho, baito, बैठो, बैठ, sit, board]
    UTRO: [utro, utar, utaro, neeche, niche, उतरो, उतर, नीचे, down]
  caption: |-
    Part 3 · Aapne chuna: UTHAO. 📞
    Kabir ne phone utha liya… aur phone par uski apni awaaz thi, 2001 se. Teesra niyam toot gaya, aur uski awaaz chali gayi. 😶
    Phir 2:57 ki gaadi aa kar ruki. Phone kehta hai "baith jao"… seedhi se awaaz aati hai "mat baithna".

    Gaadi mein baithe, ya seedhi se neeche utre? Votes decide karenge Part 4, parso raat 8:30.
    Part 1 aur 2 profile par hain.
  hashtags: "#platform13 #horrorstory #darawnikahani #hindistory #storytime #hinglish #reels #animation"
