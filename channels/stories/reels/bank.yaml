    GIRVI · Part 5 · FINALE 🏠 Papa ko sab pata chal gaya.
    Khaata freeze tha, kisht 6 din mein. Tum thane nahi gaye. Tumne bank ke nodal officer ko chitthi likhi: vivaad ₹480 ka hai, wahi roko, baaki kholo. Saath mein har bikri ka saboot. 📄
    Phir ek raat Papa ko almirah mein bank ka letter mil gaya... aur is baar tumne kuch nahi chhupaya.
    Kisht waqt par gayi. Aur ghar ke kaagaz? Aakhir mein dekho. ❤️

    Girvi yahin khatam. NAYI KAHANI: LIFT. Raat ke 2 baje, lift ruk gayi, aur bahar se koi darwaza khol raha hai.
