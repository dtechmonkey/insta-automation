- id: girvi-05
  folder: girvi-05
  vote: [KHOLO, RUKO]           # teaser vote for the next series LIFT (Part 1 on 30 Nov): 1 = KHOLO (open the lift door), 2 = RUKO (stay inside); Girvi itself ends here
  vote_aliases:
