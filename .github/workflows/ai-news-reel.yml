# Tech Monkey (ai-news): posts one explainer Reel a day from channels/ai-news/reels/bank.yaml, plus its Story.
# Cron times are UTC (IST = UTC + 5:30). The job starts 30 min early (GitHub can start late);
# run_posts.py waits for the exact publish time in channels/ai-news/config.yaml.
#   09:00 IST start -> 09:30 IST post
name: Tech Monkey - reel

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run: { description: "Have Instagram check every ready Reel, posting nothing", default: true, type: boolean }

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-news-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests PyYAML Jinja2 python-dotenv playwright tzdata

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python run_posts.py --channel ai-news --reel
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Commit history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels/ai-news/history.json
          if ! git diff --cached --quiet; then
            git commit -m "post: ai-news reel"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
          fi
