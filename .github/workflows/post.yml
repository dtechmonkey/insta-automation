# Daily + weekly posting. Cron times are in UTC (IST = UTC + 5:30).
# Jobs start ~25 min early (GitHub can start late); run.py then waits for the exact
# publish_time set in the channel config.
name: Post to Instagram

on:
  schedule:
    - cron: "35 12 * * *"  # daily:  starts 18:05 IST, publishes 18:30 IST
    - cron: "5 6 * * 0"    # weekly: Sundays, starts 11:35 IST, publishes 12:00 IST
  workflow_dispatch:
    inputs:
      channel: { description: "Channel folder", default: "ai-news" }
      mode: { description: "daily or weekly", default: "daily", type: choice, options: [daily, weekly] }
      dry_run: { description: "Only make images (don't post)", default: true, type: boolean }

permissions:
  contents: write

concurrency:
  group: instagram-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # includes waiting for the exact publish time
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Decide what to run
        id: what
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            [ "${{ inputs.dry_run }}" = "true" ] && echo "flags=--dry-run" >> "$GITHUB_OUTPUT" || true
          elif [ "${{ github.event.schedule }}" = "5 6 * * 0" ]; then
            echo "channel=ai-news" >> "$GITHUB_OUTPUT"; echo "mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "channel=ai-news" >> "$GITHUB_OUTPUT"; echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python run.py --channel "${{ steps.what.outputs.channel }}" --mode "${{ steps.what.outputs.mode }}" ${{ steps.what.outputs.flags }}

      - name: Save slides for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slides-${{ steps.what.outputs.mode }}-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore

      - name: Commit history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels/*/history.json
          git diff --cached --quiet || (git commit -m "history: ${{ steps.what.outputs.channel }} ${{ steps.what.outputs.mode }}" && git push)
